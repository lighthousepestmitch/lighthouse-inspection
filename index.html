<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Inspection Capture</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap">

<link rel="icon" type="image/png" sizes="32x32" href="logo/icon-32.png">
<link rel="apple-touch-icon" href="logo/icon-capture-180.png">
<style>
  :root{
    --paper:#F6F7F5; --raised:#FFFFFF; --sunk:#EDF0EC;
    --edge:#DCE1DD; --edge-soft:#EBEEEA;
    --ink:#14201E; --muted:#4B5B57; --faint:#7E8D88;
    --timber:#0E4F54; --timber-soft:#DDEBEC;
    --clear:#276B59; --clear-bg:#E2EFE9;
    --find:#B4551C; --find-bg:#f7e7d6;
    --todo:#98897a; --todo-bg:#ece5d9;
    --na:#56606a; --na-bg:#e6e9ec;
    --place:#7a4bb8; --place-bg:#ece2fb;
    --has:var(--timber); --has-bg:var(--timber-soft); /* one highlight colour for anything with photos / answered */
    --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.05);
    --radius:15px;
  }
  @media not all{
    :root:not([data-theme="light"]){
      --paper:#161210; --raised:#201A15; --sunk:#120f0c; --edge:#33291f; --edge-soft:#2a231c;
      --ink:#ECE4D9; --muted:#a99b89; --faint:#7d7160;
      --timber:#d59a5f; --timber-soft:#31241a;
      --clear:#77c79a; --clear-bg:#1b2a21;
      --find:#e79a5b; --find-bg:#2f2216;
      --todo:#8a7d6d; --todo-bg:#241d16;
      --place:#c3a3f0; --place-bg:#241b33;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
      --paper:#161210; --raised:#201A15; --sunk:#120f0c; --edge:#33291f; --edge-soft:#2a231c;
      --ink:#ECE4D9; --muted:#a99b89; --faint:#7d7160; --timber:#d59a5f; --timber-soft:#31241a;
      --clear:#77c79a; --clear-bg:#1b2a21; --find:#e79a5b; --find-bg:#2f2216;
      --todo:#8a7d6d; --todo-bg:#241d16; --place:#c3a3f0; --place-bg:#241b33;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:96px}
  .wrap{max-width:820px;margin:0 auto;padding:0 15px}
  button{font-family:inherit}

  /* header */
  header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--edge);
    padding:calc(env(safe-area-inset-top) + 12px) 0 10px}
  .hrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .htitle{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.2rem;line-height:1.05}
  .htitle small{display:block;font-family:"Public Sans";font-weight:500;font-size:.72rem;color:var(--muted);margin-top:2px}
  .prog{display:flex;align-items:center;gap:8px;font-family:"Spline Sans Mono",monospace;font-size:.72rem;color:var(--muted)}
  .bar{width:70px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--timber);width:0;transition:width .3s}

  /* section chips nav */
  .jump{display:flex;gap:6px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .jchip{flex:none;font-family:"Spline Sans Mono",monospace;font-size:.72rem;font-weight:600;padding:5px 9px;border-radius:8px;
    border:1px solid var(--edge);background:var(--raised);color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
  .jchip.has{color:var(--has);border-color:var(--has);background:var(--has-bg)}
  .jumprow{display:flex;gap:8px;align-items:center;margin-top:10px}
  .jumprow .jump{margin-top:0;flex:1;min-width:0}
  .srcpill{flex:none;display:inline-flex;align-items:center;gap:5px;font-family:"Spline Sans Mono",monospace;font-size:.7rem;font-weight:700;
    padding:5px 9px;border-radius:8px;border:1.5px solid var(--timber);background:var(--timber-soft);color:var(--timber);cursor:pointer}
  .srcpill:active{transform:scale(.95)}
  .srcpill svg{width:14px;height:14px;stroke:currentColor;fill:none}
  /* camera / library icon swap (body.lib = library mode) */
  .ic-lib{display:none}
  body.lib .ic-cam{display:none}
  body.lib .ic-lib{display:inline}

  main{padding-top:18px}

  /* details card */
  .block{background:var(--raised);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow);
    margin-bottom:14px;overflow:hidden}
  .block-h{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;user-select:none}
  .block-h .code{font-family:"Spline Sans Mono",monospace;font-weight:600;font-size:.82rem;color:var(--timber);flex:none;min-width:34px}
  .block-h .name{flex:1;font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.04rem;letter-spacing:-.01em}
  .pill{flex:none;font-family:"Spline Sans Mono",monospace;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    padding:4px 8px;border-radius:20px}
  .pill.todo{background:var(--todo-bg);color:var(--todo)}
  .pill.clear{background:var(--clear-bg);color:var(--clear)}
  .pill.find{background:var(--find-bg);color:var(--find)}
  .pill.undet{background:var(--todo-bg);color:var(--muted)}
  .pill.na{background:var(--na-bg);color:var(--na)}
  .hcam{flex:none;position:relative;border:1px solid var(--edge);background:var(--paper);color:var(--timber);
    border-radius:10px;padding:8px 10px;display:flex;align-items:center;cursor:pointer}
  .hcam:active{transform:scale(.94)}
  .hcam svg{width:19px;height:19px;stroke:currentColor;fill:none}
  .hcount{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--has);
    color:#fff;font-size:.64rem;font-weight:700;display:none;align-items:center;justify-content:center;font-family:"Spline Sans Mono",monospace;border:2px solid var(--raised)}
  .hcount.on{display:flex}
  .htog{display:flex;gap:4px;flex:none}
  .ht{width:33px;height:33px;border-radius:9px;border:1.5px solid var(--edge);background:var(--paper);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--faint)}
  .ht:active{transform:scale(.94)}
  .ht svg{width:16px;height:16px;stroke:currentColor;fill:none}
  .ht.clear.on{background:var(--clear-bg);border-color:var(--clear);color:var(--clear)}
  .ht.find.on{background:var(--find-bg);border-color:var(--find);color:var(--find)}
  .ht.undet.on{background:var(--todo-bg);border-color:var(--faint);color:var(--muted)}
  .ht.na{font-family:"Spline Sans Mono",monospace;font-size:.56rem;font-weight:700;letter-spacing:-.03em;padding:0}
  .ht.na.on{background:var(--na-bg);border-color:var(--na);color:var(--na)}
  @media (max-width:420px){
    .block-h{padding:13px 10px;gap:5px}
    .block-h .code{min-width:26px;font-size:.76rem}
    .block-h .name{font-size:.94rem;min-width:0;overflow-wrap:anywhere}
    .htog{gap:3px}.ht{width:28px;height:28px;border-radius:8px}.ht svg{width:15px;height:15px}
    .hcam{padding:6px 6px}.hcam svg{width:17px;height:17px}
    .block-h .needchip{font-size:0;width:18px;height:18px;padding:0;justify-content:center;border-radius:50%;gap:0}
    .block-h .needchip::before{content:"!";font-size:.72rem;font-weight:700;line-height:1}
  }
  @media (max-width:380px){.block-h .name{font-size:.88rem}.block-h{padding-left:9px;padding-right:8px}.block-h .code{min-width:24px}}
  .chev{flex:none;width:16px;height:16px;stroke:var(--faint);fill:none;transition:transform .2s}
  .block.open .chev{transform:rotate(90deg)}
  .block-b{display:none;padding:0 15px 16px;border-top:1px solid var(--edge-soft)}
  .block.open .block-b{display:block}

  /* form fields */
  .field{margin-top:13px}
  .field label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:5px;text-transform:uppercase}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:1rem;color:var(--ink);background:var(--paper);
    border:1px solid var(--edge);border-radius:10px;padding:11px 12px;outline:0;-webkit-appearance:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--timber)}
  .field textarea{min-height:92px;resize:vertical;line-height:1.45}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media (max-width:520px){.grid2{grid-template-columns:1fr}}

  /* status toggle */
  .seg{display:flex;gap:8px;margin-top:14px}
  .seg button{flex:1;padding:11px;border-radius:11px;border:1.5px solid var(--edge);background:var(--paper);
    font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .seg button svg{width:15px;height:15px;stroke:currentColor;fill:none}
  .seg button.on.clear{border-color:var(--clear);background:var(--clear-bg);color:var(--clear)}
  .seg button.on.find{border-color:var(--find);background:var(--find-bg);color:var(--find)}
  .seg button.on.undet{border-color:var(--faint);background:var(--todo-bg);color:var(--muted)}
  .seg button.on.na{border-color:var(--na);background:var(--na-bg);color:var(--na)}
  .seg{gap:6px}
  .seg button{padding:10px 6px;font-size:.86rem;gap:5px}

  .findbody{display:none;margin-top:4px}
  .block.isfind .findbody{display:block}
  .subqs{margin-top:14px;display:flex;flex-direction:column;gap:13px}
  .subqlead{font-size:.8rem;color:var(--muted)}
  .subq-q{font-size:.92rem;line-height:1.35;margin-bottom:7px}
  .subqcam{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    border:1.5px solid var(--timber);background:var(--timber-soft);color:var(--timber);
    border-radius:10px;padding:10px;font-size:.86rem;font-weight:700;cursor:pointer}
  .subqcam:active{transform:scale(.98)}
  .subqcam svg{width:17px;height:17px;stroke:currentColor;fill:none}
  .subq .photos{margin:8px 0 10px}
  .ynu{display:flex;gap:6px}
  .ynu-b{flex:1;padding:11px 6px;border-radius:11px;border:1.5px solid var(--edge);background:var(--paper);
    color:var(--muted);font-size:.86rem;font-weight:600;cursor:pointer}
  .ynu-b.on.yes{border-color:var(--find);background:var(--find-bg);color:var(--find)}
  .ynu-b.on.no{border-color:var(--clear);background:var(--clear-bg);color:var(--clear)}
  .ynu-b.on.undet{border-color:var(--faint);background:var(--todo-bg);color:var(--muted)}
  .ynu-b.on.na{border-color:var(--na);background:var(--na-bg);color:var(--na)}
  .ynu{flex-wrap:wrap}.ynu-b{min-width:calc(50% - 3px)}
  /* N/A suggestion (8.9 on a slab with no subfloor) */
  .ht.na.suggest,.seg button.na.suggest{outline:2px dashed var(--na);outline-offset:1px}
  .nahint{margin-top:12px;padding:9px 11px;border-radius:10px;background:var(--na-bg);color:var(--na);font-size:.8rem;font-weight:600;line-height:1.35}
  /* add-from-library bar (top) */
  .liblink{margin-top:12px;width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--timber);background:var(--timber-soft);color:var(--timber);font-weight:700;font-size:.88rem;cursor:pointer;text-align:left}
  .liblink svg{width:18px;height:18px;stroke:currentColor;fill:none;flex:none}
  .liblink .lc{margin-left:auto;transition:transform .2s}
  .liblink.open .lc{transform:rotate(90deg)}
  .libwrap{margin-top:12px}
  .libtile .ic-cam{display:none !important}
  .libtile .ic-lib,.liblink .ic-lib{display:inline !important}

  /* mic */
  .notelabel{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mic{border:1px solid var(--timber);background:var(--timber-soft);color:var(--timber);border-radius:8px;padding:6px 12px;
    display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
  .mic:active{transform:scale(.95)}
  .mic svg{width:13px;height:13px;stroke:currentColor;fill:none}
  .mic.rec{background:var(--find);color:#fff;border-color:var(--find);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .fhint{font-size:.74rem;color:var(--clear);margin-top:7px;font-weight:600}

  /* quick-photo grid (top) */
  .qgwrap{background:var(--raised);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;margin-bottom:14px}
  .qgtitle{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:10px}
  .quickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .qgbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border:1px solid var(--edge);background:var(--paper);border-radius:11px;color:var(--timber);cursor:pointer}
  .qgbtn:active{transform:scale(.95)}
  .qgbtn svg{width:17px;height:17px;stroke:currentColor;fill:none}
  .qgcode{font-family:"Spline Sans Mono",monospace;font-size:.6rem;font-weight:700;color:var(--timber)}
  .qglabel{font-size:.66rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.15}
  .qgcount{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--timber);color:#fff;font-size:.6rem;font-weight:700;display:none;align-items:center;justify-content:center;font-family:"Spline Sans Mono",monospace;border:2px solid var(--raised)}
  .qgcount.on{display:flex}
  .qgbtn.has{border-color:var(--has);background:var(--has-bg)}

  /* one highlight colour: a section with photos / answered, or still needing its note (label only) */
  .needchip{display:none;align-items:center;gap:4px;font-family:"Spline Sans Mono",monospace;font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--has);background:var(--has-bg);border:1px solid var(--has);padding:3px 7px;border-radius:20px;flex:none}
  .block.has,.block.needs{border-color:var(--has)}
  .block.has>.block-h,.block.needs>.block-h{background:var(--has-bg)}

  /* yes/no segments + multi-select chips */
  .ynseg{display:flex;gap:8px}
  .yn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--edge);background:var(--paper);font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
  .yn.on{border-color:var(--timber);background:var(--timber-soft);color:var(--timber)}
  .chipset{display:flex;flex-wrap:wrap;gap:7px}
  .mchip{font-size:.82rem;padding:8px 11px;border-radius:9px;border:1.5px solid var(--edge);background:var(--paper);color:var(--ink);cursor:pointer}
  .mchip.on{border-color:var(--clear);background:var(--clear-bg);color:var(--clear);font-weight:600}
  .mchip.spchip.on{border-color:var(--has);background:var(--has-bg);color:var(--has)}
  .chipsel{display:flex;flex-wrap:wrap;gap:7px}
  .csbtn{font-size:.85rem;padding:9px 13px;border-radius:10px;border:1.5px solid var(--edge);background:var(--paper);color:var(--muted);font-weight:600;cursor:pointer}
  .csbtn:active{transform:scale(.97)}
  .csbtn.on{border-color:var(--timber);background:var(--timber-soft);color:var(--timber)}
  .subhead{margin:20px 2px 8px;font-weight:700;font-size:.95rem;color:var(--timber);border-top:1px solid var(--edge-soft);padding-top:16px}
  .obswrap{display:flex;flex-direction:column;gap:12px}
  .obsrow{border:1px solid var(--edge-soft);border-radius:11px;padding:11px 12px;background:var(--paper)}
  .obslabel{font-size:.82rem;font-weight:700;color:var(--ink);margin-bottom:7px}
  .obsnote{width:100%;font-family:inherit;font-size:.92rem;color:var(--ink);background:var(--raised);border:1px solid var(--edge);border-radius:9px;padding:9px 11px;outline:0}
  .obsnote:focus{border-color:var(--timber)}
  .qgsub{margin-top:14px}
  .qgbtn.compass{border-color:var(--timber);background:var(--timber-soft);color:var(--timber)}
  .qgbtn.compass .qglabel{color:var(--timber);font-weight:700}
  .qgbtn.compass.rec{opacity:.6}
  .pickwrap{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;margin:6px 0 16px}
  .pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:13px 14px;
    border:1.5px solid var(--edge);border-radius:11px;background:var(--paper);color:var(--ink);font-size:.95rem;font-weight:600;cursor:pointer}
  .pickrow:active{transform:scale(.98)}

  /* bank chips */
  .banklab{font-size:.72rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 7px}

  /* Findings + Species pop-up sheets (tap a line, tap another) */
  .fbtn{font-size:.85rem;font-weight:700;padding:9px 14px;border-radius:10px;border:1.5px solid var(--timber);background:var(--timber-soft);color:var(--timber);cursor:pointer}
  .fbtn:active{transform:scale(.97)}
  .findrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .sptags{display:flex;flex-wrap:wrap;gap:6px}
  .sptag{font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--has-bg);color:var(--has)}
  .sheet.tall{max-width:560px;max-height:88vh;display:flex;flex-direction:column;padding:18px}
  .sheet.tall .fscroll{overflow:auto;flex:1 1 auto;min-height:0;margin:0 -4px 12px;padding:0 4px;-webkit-overflow-scrolling:touch}
  .sheet .fsub{margin:0 0 12px;font-size:.85rem}
  .flab{font-size:.72rem;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 7px}
  .flines{display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;padding:12px 13px;border:1.5px solid var(--edge);border-radius:11px;background:var(--paper);color:var(--ink);font-size:.92rem;line-height:1.35;cursor:pointer}
  .frow:active{transform:scale(.99)}
  .frow.on{border-color:var(--timber);background:var(--timber-soft)}
  .ftick{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--edge);background:var(--raised);margin-top:1px;position:relative}
  .frow.on .ftick{background:var(--timber);border-color:var(--timber)}
  .frow.on .ftick:after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .frow .ph{background:var(--place-bg);color:var(--place);border-radius:4px;padding:0 3px;font-family:"Spline Sans Mono",monospace;font-size:.85em}
  .mchip.floc.on{border-color:var(--timber);background:var(--timber-soft);color:var(--timber);font-weight:600}
  .fairow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px}
  .fkey{display:flex;gap:8px;margin:0 0 12px}
  .fkey[hidden]{display:none}
  .fkey input{flex:1;min-width:0;font-family:inherit;font-size:.9rem;border:1px solid var(--edge);border-radius:9px;padding:9px 10px;background:var(--paper);color:var(--ink)}
  .fnote{font-size:.76rem;color:var(--muted)}
  .sheet.tall .acts{flex:none}
  /* "rest are clear" shortcut */
  .restclear{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 4px;padding:13px;border-radius:12px;border:1.5px dashed var(--clear);background:var(--clear-bg);color:var(--clear);font-weight:700;font-size:.92rem;cursor:pointer}
  .restclear:active{transform:scale(.99)}
  /* additional tests / moisture meter card: always open, stands out */
  .testscard{border-left:4px solid var(--timber)}
  .testscard>.block-h{cursor:default}
  .testscard .chev{display:none}
  .mchip.tchip.on{border-color:var(--timber);background:var(--timber-soft);color:var(--timber);font-weight:600}
  /* suggested answer (Conclusion), same idea as the 8.9 N/A hint */
  .yn.suggest:not(.on),.csbtn.suggest:not(.on){outline:2px dashed var(--timber);outline-offset:1px}

  /* photos */
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;margin-top:14px}
  .thumb{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:var(--sunk);border:1px solid var(--edge)}

  .footbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raised);border-top:1px solid var(--edge);

  .footinfo{flex:1;font-size:.76rem;color:var(--muted)}
  .footinfo b{color:var(--ink)}
  .btn{font-weight:700;font-size:.92rem;border-radius:11px;padding:12px 18px;cursor:pointer;border:1px solid transparent}

  .btn.ghost{background:transparent;border-color:var(--edge);color:var(--muted);font-weight:600;padding:12px 14px}
  .btn:disabled{opacity:.5}

  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);
    font-size:.82rem;font-weight:600;padding:10px 17px;border-radius:22px;opacity:0;pointer-events:none;transition:.2s;z-index:60;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .savedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--clear);margin-right:5px;vertical-align:middle}

  /* modal */
  .modal{position:fixed;inset:0;z-index:70;background:rgba(20,14,8,.5);display:none;align-items:center;justify-content:center;padding:20px}

  .sheet .acts{display:flex;gap:9px;justify-content:flex-end}

  .jobrow{display:flex;align-items:stretch;gap:8px}
  .jobrow.active .jobopen{border-color:var(--timber);box-shadow:inset 3px 0 0 var(--timber)}
  .jobopen{flex:1;text-align:left;background:var(--raised);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .jobaddr{font-weight:600;font-size:.92rem;color:var(--ink)}
  .jobmeta{font-size:.76rem;color:var(--muted)}
  .nowtag{font-size:.62rem;background:var(--timber-soft);color:var(--timber);border-radius:6px;padding:1px 6px;font-weight:700;margin-left:6px;vertical-align:middle}
  .jobdel{width:42px;flex:none;border:1px solid var(--edge);background:var(--raised);border-radius:10px;color:var(--muted);font-size:1.2rem;cursor:pointer}

.lpcmark{height:26px;width:26px;flex:none;align-self:center;display:block;}
  .thumb img{cursor:zoom-in}

  /* photo viewer (tap a thumbnail) */
  .lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;overflow:hidden}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-select:none}
  .lightbox.zoomed{display:block;overflow:auto;-webkit-overflow-scrolling:touch}
  .lightbox.zoomed img{max-width:none;max-height:none;width:250%;height:auto}
  .lbx,.lbnav{position:fixed;z-index:2;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .lbx{top:calc(env(safe-area-inset-top) + 12px);right:14px;width:44px;height:44px;font-size:1.7rem}
  .lbnav{top:50%;transform:translateY(-50%);width:44px;height:56px;border-radius:12px;font-size:2rem}
  .lbnav.prev{left:10px}.lbnav.next{right:10px}
  .lbnav[hidden]{display:none}
  .lbcap{position:fixed;left:0;right:0;bottom:0;z-index:2;text-align:center;color:#fff;font-size:.82rem;font-weight:600;
    padding:12px 70px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}

  /* review / read-through screen */
  .review{position:fixed;inset:0;z-index:55;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch;display:none}
  .review.show{display:block}

  .rvbar .wrap{display:flex;align-items:center;gap:10px}
  .rvbar .rvt{flex:1;font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.05rem;line-height:1.1}
  .rvbar .rvt small{display:block;font-family:"Public Sans";font-weight:500;font-size:.7rem;color:var(--muted);margin-top:2px}

  .rvcard{background:var(--raised);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:14px}

  .rvhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .rvhead .code{font-family:"Spline Sans Mono",monospace;font-weight:600;font-size:.82rem;color:var(--timber);flex:none;min-width:34px}
  .rvhead .name{flex:1;font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.04rem}
  .rvh2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.15rem;margin:0 0 4px}
  .rvsub{font-size:.8rem;color:var(--muted);margin-bottom:10px}
  .rvtable{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:6px 12px;font-size:.88rem}
  .rvtable dt{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.02em;padding-top:2px}

  .rvraw{font-size:.92rem;white-space:pre-wrap;background:var(--paper);border:1px solid var(--edge-soft);border-radius:10px;padding:9px 11px}
  .rvraw.empty{color:var(--faint);font-style:italic}
  .rvq{font-size:.86rem;margin:12px 0 4px}
  .rvans{display:inline-block;font-family:"Spline Sans Mono",monospace;font-size:.66rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:12px;margin-left:6px;background:var(--todo-bg);color:var(--muted)}

  .rvans.no{background:var(--clear-bg);color:var(--clear)}
  .rvfinal{width:100%;font-family:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--edge);border-radius:10px;padding:10px 12px;outline:0;min-height:74px;resize:vertical;line-height:1.45}
  .rvfinal:focus{border-color:var(--timber)}
  .rvfinal.filled{border-color:var(--has);background:var(--has-bg)}
  .rvmini{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:8px;border:1px solid var(--timber);background:var(--timber-soft);color:var(--timber);cursor:pointer;text-transform:none;letter-spacing:0}
  .rvmini.ghost{background:transparent;border-color:var(--edge);color:var(--muted)}
  .rvmini:disabled{opacity:.5}
  .rvtodo{border-color:var(--has)}
  .rvtodo .pickrow{padding:10px 12px;font-size:.88rem}
  .rvai{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
  .rvai input{flex:1;min-width:170px;font-family:inherit;font-size:.9rem;border:1px solid var(--edge);border-radius:9px;padding:8px 10px;background:var(--paper);color:var(--ink)}
  .rvph{margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div style="display:flex;align-items:center;gap:10px"><img class="lpcmark" src="logo/lpc-badge.png" alt="Lighthouse Pest Control" width="26" height="26"><div class="htitle">Inspection Capture<small id="hsub">New regular termite inspection</small></div></div>
      <div class="prog"><span id="pcount">0/14</span><span class="bar"><i id="pbar"></i></span></div>
    </div>

      <nav class="jump" id="jump"></nav>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="footbar">
  <div class="wrap">
    <div class="footinfo"><span class="savedot"></span><span id="saveinfo">Saved on this device</span></div>
    <button class="btn ghost" id="jobsBtn">Jobs</button>
    <button class="btn ghost" id="newBtn">New</button>
    <button class="btn primary" id="finishBtn">Finish</button>

</div>

<div class="review" id="review">

    <button class="btn primary" id="rvSend" type="button">Send to Mitch</button>

</div>

<div class="lightbox" id="lightbox">

</div>

<div id="toast"></div>

</div>

function dbGet(k){return new Promise((res)=>{try{const t=db.transaction("kv","readonly").objectStore("kv").get(k);
  t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)}catch(e){res(null)}});}
function dbSet(k,v){return new Promise((res)=>{try{const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k);

function dbDel(k){return new Promise((res)=>{try{const t=db.transaction("kv","readwrite").objectStore("kv").delete(k);

/* ---------- photo handling: shrink on capture ---------- */
async function shrink(file,max=1600,q=0.72){
  // createImageBitmap with imageOrientation:'from-image' bakes in the photo's
  // EXIF rotation before we ever touch pixels - the old new Image()+canvas
  // path below draws raw sensor pixels and ignores EXIF, so portrait phone
  // photos could come out rotated 90°/upside-down in the saved data-URL even
  // though they looked right in the camera preview. Supported on iOS Safari
  // 15+; falls back to the old method (still no rotation fix) if it throws.
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    let w=bmp.width,h=bmp.height;
    if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(bmp,0,0,w,h);
    bmp.close();
    return c.toDataURL("image/jpeg",q);
  }catch(e){
    return new Promise((res)=>{
      const img=new Image();const url=URL.createObjectURL(file);
      img.onload=()=>{
        let{width:w,height:h}=img;
        if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg",q));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);res(null)};
      img.src=url;
    });
  }
}

// quick-photo tile: show its count and the one highlight colour when it has photos
function setTile(id,n){
  const c=document.getElementById("qgc-"+id);if(c){c.textContent=n;c.classList.toggle("on",n>0);}
  const b=document.getElementById("qgb-"+id);if(b)b.classList.toggle("has",n>0);
  const lc=document.getElementById("lgc-"+id);if(lc){lc.textContent=n;lc.classList.toggle("on",n>0);}
  const lb=document.getElementById("lgb-"+id);if(lb)lb.classList.toggle("has",n>0);
}
function photoBucket(code){
  if(code&&code.indexOf("SUBQ::")===0){const p=code.slice(6).split("::");const s=sec(p[0]);s.subqPhotos=s.subqPhotos||{};s.subqPhotos[+p[1]]=s.subqPhotos[+p[1]]||[];return s.subqPhotos[+p[1]];}
  if(code&&code.indexOf("OBS::")===0){const a=code.slice(5);const o=STATE.customer.obs=STATE.customer.obs||{};o[a]=o[a]||{note:"",photos:[]};return o[a].photos;}
  if(code==="INACC"){const i=STATE.customer.inacc=STATE.customer.inacc||{yn:"",note:"",photos:[]};return i.photos;}
  if(code==="ANNEX"){const a=STATE.customer.annex=STATE.customer.annex||{note:"",photos:[]};return a.photos;}
  if(code==="CMT"){const a=STATE.customer.cmts=STATE.customer.cmts||{note:"",photos:[]};return a.photos;}
  return sec(code).photos;
}
function renderSubqPhotos(code){
  const it=ITEMS.find(i=>i.code===code);if(!it||!it.subQs)return;

  it.subQs.forEach((q,i)=>{

    (s.subqPhotos[i]||[]).forEach((durl,j)=>{
      const d=document.createElement("div");d.className="thumb";
      d.innerHTML=`<img src="${durl}"><button class="x" data-delsubq="${escv(code)}::${i}::${j}">&times;</button>`;host.appendChild(d);
    });
    const n=(s.subqPhotos[i]||[]).length;
    host.style.display=n?"grid":"none";
    setTile("SUBQ-"+slug(code)+"-"+i,n);

// one highlight for a section that has photos, an answer, a species or a note
function isTouched(code){
  const s=STATE.sections[code];
  return photoCount(code)>0||!!(s&&(s.status||(s.note||"").trim()||(s.species&&s.species.length)));
}
function buildJump(){
  const j=document.getElementById("jump");j.innerHTML="";
  ITEMS.forEach(it=>{
    const a=document.createElement("button");a.className="jchip"+(isTouched(it.code)?" has":"");
    a.dataset.code=it.code;a.textContent=it.code;a.onclick=()=>openTo(it.code);j.appendChild(a);
  });
}
function refreshChip(code){
  const c=document.querySelector('#jump [data-code="'+code+'"]');
  if(c)c.classList.toggle("has",isTouched(code));
}

function updateProgress(){
  const done=ITEMS.filter(it=>{const s=STATE.sections[it.code];return it.always?(s&&s.note):(s&&s.status)}).length;
  document.getElementById("pcount").textContent=done+"/"+ITEMS.length;

/* ---------- helpers ---------- */
function todayStr(){const d=new Date();const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return d.getDate()+" "+m[d.getMonth()]+" "+d.getFullYear();}
function escv(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function phHtml(s){return escv(s).replace(/(\[[^\]]+\])/g,'<span class="ph">$1</span>')}
function opts(arr,sel){return arr.map(o=>`<option ${o===sel?'selected':''} value="${escv(o)}">${escv(o||'—')}</option>`).join("")}
function openTo(code){const b=document.getElementById("b-"+code);if(!b)return;

function subStatus(code){
  const it=ITEMS.find(i=>i.code===code);if(!it||!it.subQs)return sec(code).status;
  const ans=sec(code).subq||{};const vals=it.subQs.map((q,i)=>ans[i]).filter(Boolean);
  if(vals.includes("yes"))return "find";
  if(vals.includes("undet"))return "undet";
  if(vals.length===it.subQs.length)return vals.every(v=>v==="na")?"na":"clear";
  return null;
}
function toggleSubqFind(code,idx,val){
  const ff=document.getElementById("subqfind-"+code+"-"+idx);if(!ff)return;
  const show=(val==="yes"||val==="undet");
  ff.style.display=show?"block":"none";
  const ta=ff.querySelector("[data-subqnote]");
  if(!show){if(ta)ta.value="";const s=sec(code);if(s.subqNotes)s.subqNotes[idx]="";}
  else if(ta){setTimeout(()=>{try{ta.focus()}catch(e){}},60);}
}
function setStatus(code,val,expand){
  sec(code).status=val;
  const blk=document.getElementById("b-"+code);
  if(blk){
    blk.classList.toggle("isfind",val==="find"||val==="undet");
    blk.querySelectorAll("[data-status]").forEach(b=>b.classList.toggle("on",b.dataset.status===val));
    blk.querySelectorAll("[data-hstatus]").forEach(b=>b.classList.toggle("on",b.dataset.hstatus===val));
    if(expand&&val==="find")blk.classList.add("open");
  }
  refreshPill(code);updateHeaderCount(code);scheduleSave();updateProgress();buildJump();
}
function needsComment(code){
  if(code==="COVER")return false;
  const s=sec(code);const it=ITEMS.find(i=>i.code===code);
  if(it&&it.subQs){const ans=s.subq||{},notes=s.subqNotes||{};
    return it.subQs.some((q,i)=>(ans[i]==="yes"||ans[i]==="undet")&&!((notes[i]||"").trim()));}
  return photoCount(code)>0&&!((s.note||"").trim());
}
function updateNeed(code){
  const blk=document.getElementById("b-"+code);if(!blk)return;
  const need=needsComment(code);
  blk.classList.toggle("needs",need);
  blk.classList.toggle("has",isTouched(code));
  const chip=blk.querySelector(".needchip");if(chip)chip.style.display=need?"inline-flex":"none";
}
function photoCount(code){const s=sec(code);let n=(s.photos||[]).length;if(s.subqPhotos)for(const k in s.subqPhotos)n+=(s.subqPhotos[k]||[]).length;return n;}
function updateHeaderCount(code){
  const n=photoCount(code);
  const hc=document.getElementById("hcount-"+code);
  if(hc){hc.textContent=n;hc.classList.toggle("on",n>0);}
  setTile(code,n);
  updateNeed(code);
  refreshChip(code);
}
function refreshPill(code){
  const el=document.getElementById("pill-"+code);if(!el)return;
  const isExtra=EXTRAS.some(x=>x.code===code);
  let pc,pl;
  if(isExtra){const s=sec(code);const has=s.note||s.photos.length;pc=has?"clear":"todo";pl=has?"Noted":"To do"}
  else{[pc,pl]=pill(code)}
  el.className="pill "+pc;el.textContent=pl;
}

/* photo input */
async function onFiles(e){
  const files=[...e.target.files];e.target.value="";
  if(!files.length||!activePhotoCode)return;
  const code=activePhotoCode;toast("Processing photo…");
  const bucket=photoBucket(code);
  for(const f of files){
    const durl=await shrink(f);
    if(durl) bucket.push(durl);
  }
  if(code.indexOf("SUBQ::")===0){
    // a photo on a specific question = that question is Yes
    const p=code.slice(6).split("::");const c=p[0];const idx=+p[1];
    const s=sec(c);s.subq=s.subq||{};
    if(s.subq[idx]!=="yes"){s.subq[idx]="yes";
      const blk=document.getElementById("b-"+c);
      if(blk)blk.querySelectorAll(`[data-subq="${idx}"]`).forEach(b=>b.classList.toggle("on",b.dataset.subv==="yes"));
    }
    toggleSubqFind(c,idx,"yes");
    renderSubqPhotos(c);setStatus(c,subStatus(c),false);updateHeaderCount(c);refreshPill(c);
  }
  else if(code.indexOf("OBS::")===0){renderObsArea(code.slice(5));syncObstructions();updateAccessCount();}
  else if(code==="INACC"){renderInacc();STATE.customer.inaccessible="Yes";syncYn("inaccessible");updateAccessCount();}
  else if(code==="ANNEX"){renderAnnex();STATE.customer.annexures="Yes";syncYn("annexures");}
  else if(code==="CMT"){renderComments();STATE.customer.comments="Yes";syncYn("comments");}
  else{
    const it=ITEMS.find(x=>x.code===code&&!x.always);
    if(it&&!sec(code).status){
      // a photo on an untouched significant item implies a finding — flip it automatically
      setStatus(code,"find",false);
    }
    renderPhotos(code);updateHeaderCount(code);refreshPill(code);
  }
  scheduleSave();
  toast(files.length+" photo"+(files.length>1?"s":"")+" added");
}
document.getElementById("fileInput").addEventListener("change",onFiles);
document.getElementById("cameraInput").addEventListener("change",onFiles);

/* ---------- location (GPS) ---------- */
function getLocation(btn){
  if(!navigator.geolocation){toast("Location isn't available here");return}
  btn.classList.add("rec");toast("Getting location…");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy:acc}=pos.coords;
    STATE.customer.geo={lat:+lat.toFixed(6),lng:+lng.toFixed(6),acc:Math.round(acc)};
    const h=document.getElementById("geo-hint");
    if(h){h.style.display="block";h.textContent=`📍 Location captured (±${Math.round(acc)}m)`;}
    btn.classList.remove("rec");scheduleSave();toast("Location captured");
    await reverseGeo(lat,lng);
  },err=>{btn.classList.remove("rec");toast(err&&err.code===1?"Allow location access to use Locate":"Couldn't get location — try again")},
  {enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

/* ---------- compass (orientation) ---------- */
function compassPoint(deg){
  const dirs=["North","North East","East","South East","South","South West","West","North West"];
  return dirs[Math.round(((deg%360)/45))%8];
}

function toggleMic(btn){
  const ta=micField(btn);if(!ta)return;
  if(recBtn===btn&&recog){stopRec();return}
  stopRec();
  // In-app speech only works top-level (real website); inside the sandboxed artifact use the keyboard mic
  if(SR&&!INFRAME){startSpeech(btn,ta);return;}
  // No in-app speech engine: open the keyboard so its own mic key can be used
  ta.focus();try{ta.click();}catch(e){}
  toast("Keyboard up — tap the 🎤 key on it. No 🎤? Settings ▸ General ▸ Keyboard ▸ Enable Dictation");
}
function startSpeech(btn,ta){
  try{recog=new SR();}catch(e){recog=null;ta.focus();return;}
  recog.lang="en-AU";recog.continuous=true;recog.interimResults=true;
  recBtn=btn;btn.classList.add("rec");
  let base=ta.value?ta.value.replace(/\s+$/,"")+" ":"";
  recog.onresult=ev=>{
    let fin="",intr="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else intr+=r[0].transcript}
    if(fin)base=(base+fin+" ").replace(/\s+/g," ");
    ta.value=(base+intr).trim();commitField(ta);
  };
  recog.onend=()=>{btn.classList.remove("rec");commitField(ta);recog=null;recBtn=null};
  recog.onerror=ev=>{
    btn.classList.remove("rec");recog=null;recBtn=null;
    const c=ev&&ev.error;
    if(c==="not-allowed"||c==="service-not-allowed"){ta.focus();toast("Mic blocked — use the keyboard 🎤 key instead");}
    else if(c==="no-speech"){toast("Didn't catch that — tap Speak and try again");}
    else{ta.focus();toast("Use the keyboard 🎤 key to dictate");}
  };
  try{recog.start();toast("Listening… tap Speak again to stop");}
  catch(e){btn.classList.remove("rec");recog=null;recBtn=null;ta.focus();}
}

async function buildPacket(){
  STATE.customer.obstructions=anyObsContent()?"Yes":"No";
  // Export a copy with number + street folded into address (keeps STATE clean so a
  // re-export never doubles the number); streetno is also kept for reference.
  const cust=Object.assign({},STATE.customer);
  const _no=(cust.streetno||"").trim();
  if(_no)cust.address=[_no,(cust.address||"").trim()].filter(Boolean).join(" ");
  const pp=isPP();
  if(pp)cust.scope=cust.scope||PP_SCOPE;
  const out={meta:{app:"LPC Inspection Capture",
      type:pp?"RSA Pre-Purchase Timber Pest Inspection":"RSA Regular Visual Timber Pest Inspection",
      reportType:pp?"prepurchase":"regular",version:2,jobId:STATE.id,reviewedAt:STATE.reviewedAt||null},
    customer:cust,sections:[]};
  const list=[COVER].concat(ITEMS,EXTRAS);
  for(const it of list){
    const s=STATE.sections[it.code];if(!s)continue;
    const photos=(s.photos||[]).filter(Boolean);
    const species=(s.species||[]).filter(Boolean);
    if(s.status||s.note||photos.length||s.subq||s.subqPhotos||s.subqNotes||species.length){
      const rec={code:it.code,title:itemTitle(it),status:s.status||(ITEMS.some(x=>x.code===it.code)?"clear":"note"),note:s.note||"",tone:(s.tone&&s.tone!=="Use report tone")?s.tone:"",photos};
      if(species.length){rec.species=species;if(species.includes("Other")&&(s.speciesOther||"").trim())rec.speciesOther=s.speciesOther.trim();}
      if(it.subQs)rec.subq=it.subQs.map((q,i)=>({q,a:(s.subq&&s.subq[i])||null,note:(s.subqNotes&&s.subqNotes[i])||"",photos:((s.subqPhotos&&s.subqPhotos[i])||[]).filter(Boolean)}));
      out.sections.push(rec);
    }
  }
  // approved report wording (keyed by field). Present only when someone wrote or polished some; Mira build uses it as is.
  const fw=cleanFinal();
  if(Object.keys(fw).length){out.final=fw;out.meta.wordingFinal=true;}
  return out;
}

function validateComplete(){
  const miss=[];const c=STATE.customer;
  if(!(c.address||"").trim())miss.push({t:"Property address",go:"DET"});
  if(!(c.client||"").trim())miss.push({t:"Client name",go:"DET"});
  ITEMS.forEach(it=>{const s=STATE.sections[it.code];
    if(it.always){if(!(s&&(s.note||"").trim()))miss.push({t:it.code+" "+it.title,go:it.code});return;}
    if(it.subQs){const ans=(s&&s.subq)||{};const notes=(s&&s.subqNotes)||{};
      const un=it.subQs.filter((q,i)=>!ans[i]).length;
      if(un)miss.push({t:it.code+" "+it.title+" — "+un+" question"+(un>1?"s":"")+" unanswered",go:it.code});
      it.subQs.forEach((q,i)=>{if((ans[i]==="yes"||ans[i]==="undet")&&!((notes[i]||"").trim()))miss.push({t:it.code+" Q"+(i+1)+" — needs findings written in",go:it.code});});
      return;}
    if(!(s&&s.status)){miss.push({t:it.code+" "+it.title+" — not answered",go:it.code});return;}
    if((s.status==="find"||s.status==="undet")&&!((s.note||"").trim()))miss.push({t:it.code+" "+it.title+" — needs a note",go:it.code});
  });
  if(!c.addtests)miss.push({t:"Moisture meter and other tests — did you use any?",go:"TESTS"});
  if(!c.inaccessible)miss.push({t:"Accessibility — any inaccessible areas?",go:"ACCESS"});
  const stp=c.stmp||{};
  if(!stp.issued)miss.push({t:"8.2 Subterranean termite management proposal — not answered",go:"8.2"});
  else if(stp.issued==="yes"&&!stp.updated)miss.push({t:"8.2 — is an updated proposal required?",go:"8.2"});
  else if(stp.issued==="no"&&!stp.rec)miss.push({t:"8.2 — choose the recommendation",go:"8.2"});
  if(!((c.areas||[]).length))miss.push({t:"Accessibility — areas inspected",go:"ACCESS"});
  if(!c.risk)miss.push({t:"Accessibility — undetected risk",go:"ACCESS"});
  if(!c.treatment)miss.push({t:"Conclusion — treatment required?",go:"CONC"});
  if(!c.conducive)miss.push({t:"Conclusion — remove conducive conditions?",go:"CONC"});
  if(!c.nextinsp)miss.push({t:"Conclusion — next inspection interval",go:"CONC"});
  return miss;
}

async function doExport(){

  let packet,json,sizeMB,nPhotos,nFind;
  try{

    sizeMB=(new Blob([json]).size/1048576).toFixed(1);
    nPhotos=packet.sections.reduce((a,s)=>a+s.photos.length+((s.subq||[]).reduce((b,q)=>b+((q.photos||[]).length),0)),0);
    nFind=packet.sections.filter(s=>s.status==="find").length;
  }catch(err){toast("Couldn't build the packet — tell Claude");return;}

  sheet.innerHTML=`<h3>Export this inspection</h3>

    <div class="acts"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mExport">Save / Share packet</button></div>`;
  modal.classList.add("show");
  document.getElementById("mCancel").onclick=closeModal;
  document.getElementById("mExport").onclick=async()=>{
    const btn=document.getElementById("mExport");btn.disabled=true;btn.textContent="Saving…";
    const fname=`inspection_${addr}.json`;
    const blob=new Blob([json],{type:"application/json"});
    const resetBtn=()=>{btn.disabled=false;btn.textContent="Save / Share packet";};
    try{
      const dl=await (window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null));
      if(dl){await dl.save({filename:fname,data:json});toast("Packet saved — AirDrop or email it");closeModal();return;}
      // real website on iPhone/iPad: share the file (Mail it to yourself / Save to Files)
      let file=null;try{file=new File([blob],fname,{type:"application/json"});}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:fname});toast("Packet shared");closeModal();return;}
        catch(err){if(err&&err.name==="AbortError"){toast("Share cancelled");resetBtn();return;}}
      }
      // desktop / no share: download the file
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);

      toast("Packet downloaded");closeModal();

const review=document.getElementById("review"),rvbody=document.getElementById("rvbody");
const rvRaw={},rvPrev={};   // rvRaw[key]={raw,ctx} rebuilt each time Review opens; rvPrev = undo for Polish

  const sp=(s.species||[]).map(x=>x==="Other"&&s.speciesOther?"Other: "+s.speciesOther:x);
  let h=`<div class="rvcard${isTouched(code)?' has':''}" id="rv-${escv(code)}"><div class="rvhead"><span class="code">${escv(code)}</span><span class="name">${escv(title)}</span><span class="pill ${pc}">${pl}</span></div>`;
  if(sp.length)h+=`<div class="rvlab"><span>${code==="8.8"?"Borer type":"Termite species"}</span></div><div style="font-size:.92rem">${sp.map(escv).join(" · ")}</div>`;

/* ---------- AI Polish (optional; needs the user's own Anthropic API key, kept on this device only) ----------
   Calls the Messages API straight from the browser with plain fetch: no third-party script on a page that holds a key.
   Sends ONLY the note text + section name/status/species/tone + that section's house wording lines. Never client details or photos. */
function aiKey(){try{return localStorage.getItem("lpc_ai_key")||"";}catch(e){return "";}}
function aiReady(){return !!aiKey();}
const AI_SYSTEM=`You rewrite a timber pest inspector's rough field notes into wording for a visual timber pest inspection report (Australian, AS 3660 / AS 4349.3 style) for a pest control business on the NSW Northern Rivers.
Rules:
- Australian English. Never use em dashes or en dashes; use full stops, commas or brackets.
- Plain, direct, professional and measured. No scare wording, no sales language, no jargon a tradie wouldn't say.
- Use only what is in the inspector's note and the details given. Never add or guess a finding, location, measurement, date, species, cause or recommendation that is not there.
- Fix obvious speech-to-text slips only when the meaning is clear from the note and the section. If a word or phrase is unclear, keep the inspector's words and put [CHECK: what is unclear] straight after it.
- Keep any [SQUARE BRACKET] placeholders exactly as written, unless the inspector's own words in the note say what goes there.
- Follow the tone instruction given. The house wording lines are examples of the style, not text to copy in.
- The note may already hold ready-made house sentences the inspector tapped in, with [SQUARE BRACKET] gaps, plus the inspector's own words (for example where it was). Join them into one clear paragraph, fill a gap only from the inspector's own words, leave it in brackets if the note doesn't say, and don't say the same thing twice.
- Output only the report wording as one short paragraph (or a few short sentences). No heading, no quotation marks, no commentary.`;
// one call to the AI for any note (read-through Polish and the Findings sheet's Tidy): returns the wording, or "" after telling the user what went wrong
async function aiCall(x,raw){
  const k=aiKey();if(!k){toast("Paste an API key first");return "";}
  x=x||{};
  const msg=[`Section: ${x.label||"note"}`,x.status?`Status: ${x.status}`:"",(x.species&&x.species.length)?`Species selected by the inspector: ${x.species.join(", ")}`:"",`Report type: ${isPP()?"Pre-purchase (AS 4349.3)":"Regular (AS 3660)"}`,`Tone: ${x.tone||"Measured (standard)"}`,
    (x.bank&&x.bank.length)?"House wording examples for this section:\n"+x.bank.map(l=>"- "+l).join("\n"):"","Inspector's rough note:\n\"\"\"\n"+(raw||"").trim()+"\n\"\"\""].filter(Boolean).join("\n");
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:2000,fallbacks:"default",output_config:{effort:"low"},system:AI_SYSTEM,messages:[{role:"user",content:msg}]})});
  }catch(e){toast("Couldn't reach the AI. No signal?",3200);return "";}
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){
    if(res.status===401)toast("The key was rejected. Remove it and paste it again",3600);
    else if(res.status===429)toast("The AI is busy or over its limit. Try again soon",3200);
    else toast("AI error: "+((data&&data.error&&data.error.message)||res.status),4200);
    return "";}
  if(data.stop_reason==="refusal"){toast("The AI declined this one. Write it by hand",3200);return "";}
  if(data.stop_reason==="max_tokens"){toast("The AI ran out of room. Try again",3200);return "";}
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!text){toast("The AI sent nothing back",3000);return "";}
  return text;
}
async function aiPolish(key,quiet){
  const r=rvRaw[key];
  if(!r||!vtxt(r.raw)){if(!quiet)toast("Nothing captured to polish");return false;}
  const text=await aiCall(r.ctx,r.raw);
  if(!text)return false;
  const ta=rvTa(key);if(!ta)return false;
  rvPrev[key]=ta.value;ta.value=text;setFinal(key,text);
  const ub=[...rvbody.querySelectorAll("[data-undo]")].find(b=>b.dataset.undo===key);if(ub)ub.hidden=false;
  return true;
}
async function aiPolishAll(){
  const keys=Object.keys(rvRaw).filter(k=>vtxt(rvRaw[k].raw)&&!vtxt(fin()[k]));
  if(!keys.length){toast("Nothing left to polish. Boxes you've filled are skipped");return}
  if(!confirm("Polish "+keys.length+" section"+(keys.length>1?"s":"")+" with AI? Boxes that already have wording are skipped, and you can Undo each one."))return;
  let ok=0;
  for(let i=0;i<keys.length;i++){toast("Polishing "+(i+1)+" of "+keys.length+"…",60000);
    if(await aiPolish(keys[i],true))ok++;else break;}
  toast(ok+" of "+keys.length+" polished. Read each one before you send",3200);
}

/* ---------- import a packet (the partner to Finish & Export): open a job someone else exported, or a polished copy ---------- */
function stateFromPacket(p){
  const cust=Object.assign({},p.customer);
  const no=vtxt(cust.streetno),addr=vtxt(cust.address);
  if(no&&addr.indexOf(no+" ")===0)cust.address=addr.slice(no.length+1).trim();   // buildPacket folds the number into address; unfold it
  if(!cust.rtype)cust.rtype=p.meta.reportType==="prepurchase"?"prepurchase":"regular";
  const secs={};
  (p.sections||[]).forEach(r=>{
    if(!r||!r.code)return;
    const s={status:(r.status==="note"||!r.status)?null:r.status,note:r.note||"",photos:(r.photos||[]).filter(Boolean)};
    if(r.tone)s.tone=r.tone;
    if(r.species&&r.species.length){s.species=r.species.slice();if(r.speciesOther)s.speciesOther=r.speciesOther;}
    if(r.subq){s.subq={};s.subqNotes={};s.subqPhotos={};
      r.subq.forEach((q,i)=>{if(q.a)s.subq[i]=q.a;if(q.note)s.subqNotes[i]=q.note;s.subqPhotos[i]=(q.photos||[]).filter(Boolean);});}
    secs[r.code]=s;
  });
  const st={customer:cust,sections:secs,final:Object.assign({},p.final||{})};
  if(p.meta.reviewedAt)st.reviewedAt=p.meta.reviewedAt;
  return st;
}

async function importPacket(p){

/* ---------- Findings sheet + Species sheet (tap a line, tap another) ---------- */
let FS=null;   // the open sheet: {kind:"sec"|"sub"|"obs"|"inacc"|"species", code, idx, area, title, lines, prev}
function fCfg(){
  if(FS.kind==="sec")return FIND[FS.code]||{};
  if(FS.kind==="sub")return {lines:((FIND[FS.code]||{}).sub||[])[FS.idx]||[]};
  if(FS.kind==="obs")return {lines:FIND_OBS[FS.area]||[]};
  return {lines:FIND_INACC};
}
function fEl(){
  if(FS.kind==="sec"||FS.kind==="sub"){const b=document.getElementById("b-"+FS.code);if(!b)return null;
    return FS.kind==="sec"?b.querySelector("[data-note]"):b.querySelector('[data-subqnote="'+FS.idx+'"]');}
  if(FS.kind==="obs")return main.querySelector('[data-obsnote="'+FS.area+'"]');
  return main.querySelector("[data-inaccnote]");
}
// write into the real note box and let the normal input handler save it, tick the pill, update counts
function fSet(el,v){el.value=v;el.dispatchEvent(new Event("input",{bubbles:true}));}
function fMarkFind(){
  if(FS.kind!=="sec")return;
  const it=ITEMS.find(i=>i.code===FS.code);if(!it||it.always)return;
  const s=sec(FS.code);if(s.status!=="find"&&s.status!=="undet")setStatus(FS.code,"find",false);
}
function openFindings(kind,a,b){
  FS={kind,code:(kind==="sec"||kind==="sub")?a:null,idx:kind==="sub"?+b:null,area:kind==="obs"?a:null,prev:null};
  const el=fEl();if(!el){FS=null;return}
  const cfg=fCfg();
  const it=ITEMS.find(i=>i.code===FS.code);
  FS.title=kind==="sec"?(FS.code+" "+(it?itemTitle(it):"")):kind==="sub"?(FS.code+" question "+(FS.idx+1)):kind==="obs"?("Obstructed: "+FS.area):"Areas that could not be accessed";
  if(kind==="sec"){const s=sec(FS.code);if(s.locText&&el.value.indexOf(s.locText)<0){s.locSel=[];s.locText="";}}
  FS.lines=(cfg.lines||[]).map(fx);
  const sel=(kind==="sec"&&sec(FS.code).locSel)||[];
  let h=`<h3>${escv(FS.title)}</h3><p class="fsub">Tap as many as you need, one after another. Tap one again to take it off.</p><div class="fscroll">`;
  if(cfg.locs)h+=`<div class="flab">${escv(cfg.locs.label)}</div><div class="chipset">${cfg.locs.items.map((x,i)=>`<button type="button" class="mchip floc ${sel.includes(i)?'on':''}" data-floc="${i}">${escv(x)}</button>`).join("")}</div>`;
  if(FS.lines.length)h+=`${cfg.locs?'<div class="flab">Ready-made lines</div>':''}<div class="flines">${FS.lines.map((l,i)=>`<button type="button" class="frow" data-fline="${i}"><span class="ftick"></span><span class="ftxt">${phHtml(l)}</span></button>`).join("")}</div>`;
  h+=`</div><div id="fai"></div><div class="acts"><button class="btn primary" type="button" data-fdone id="fdone">Done</button></div>`;
  sheet.innerHTML=h;sheet.classList.add("tall");modal.classList.add("show");
  renderFAI();fSync();
}
function fSync(){
  if(!FS||FS.kind==="species")return;
  const el=fEl();const v=el?el.value:"";
  sheet.querySelectorAll("[data-fline]").forEach(b=>b.classList.toggle("on",v.indexOf(FS.lines[+b.dataset.fline])>=0));
  const n=sheet.querySelectorAll("[data-fline].on,[data-floc].on").length;
  const d=document.getElementById("fdone");if(d)d.textContent=n?"Done, "+n+" added":"Done";
}
function fToggleLine(i){
  const el=fEl();if(!el)return;const txt=FS.lines[i];let v=el.value;const at=v.indexOf(txt);
  if(at>=0)v=(v.slice(0,at).replace(/[ \t]+$/,"")+" "+v.slice(at+txt.length).replace(/^[ \t]+/,"")).trim();
  else{v=(v.trim()?v.trim()+" ":"")+txt;fMarkFind();}
  fSet(el,v);fSync();
}
function fToggleLoc(i){
  const el=fEl(),cfg=fCfg(),s=sec(FS.code);if(!el)return;
  s.locSel=s.locSel||[];const k=s.locSel.indexOf(i);
  if(k>=0)s.locSel.splice(k,1);else s.locSel.push(i);
  const items=s.locSel.map(j=>cfg.locs.items[j]);
  const list=items.length>1?items.slice(0,-1).join(", ")+" and "+items[items.length-1]:(items[0]||"");
  const nt=items.length?cfg.locs.lead+" "+list+(cfg.locs.tail||"."):"";
  let v=el.value;const old=s.locText||"";
  if(old&&v.indexOf(old)>=0)v=v.replace(old,()=>nt);else if(nt)v=(v.trim()?v.trim()+" ":"")+nt;
  v=v.replace(/ {2,}/g," ").trim();
  s.locText=nt;
  if(nt)fMarkFind();
  fSet(el,v);
  sheet.querySelectorAll("[data-floc]").forEach(b=>b.classList.toggle("on",s.locSel.includes(+b.dataset.floc)));
  fSync();
}
/* AI Tidy: joins the picked lines + Mitch's own words into one paragraph (same AI call as the read-through Polish) */
function renderFAI(){
  const h=document.getElementById("fai");if(!h)return;
  if(aiReady())h.innerHTML=`<div class="fairow"><button class="btn ghost" type="button" data-ftidy>Tidy with AI</button><button class="btn ghost" type="button" data-fundo hidden>Undo</button><span class="fnote">Joins your picked lines and your own words into one paragraph.</span></div>`;
  else h.innerHTML=`<div class="fairow"><button class="btn ghost" type="button" data-fsetup>AI is off. Set up</button></div><div class="fkey" id="fkey" hidden><input type="password" id="fKeyIn" placeholder="Paste Anthropic API key" autocomplete="off"><button class="btn ghost" type="button" data-fkeysave>Save key</button></div><div class="fnote" id="fkeynote" hidden style="margin:-4px 0 12px">The key stays on this device only. It is never put in the packet.</div>`;
}
async function fTidy(btn){
  const el=fEl();if(!el||!el.value.trim()){toast("Pick a line or write a note first");return}
  const old=btn.textContent;btn.disabled=true;btn.textContent="Tidying…";
  const hasSec=FS.kind==="sec"||FS.kind==="sub";const s=hasSec?sec(FS.code):null;
  const ctx={label:FS.title,status:"Finding",species:(FS.kind==="sec"&&s)?spLabel(s):[],tone:rvTone(s||undefined),bank:hasSec?(BANK[FS.code]||[]):[]};
  const text=await aiCall(ctx,el.value);
  btn.disabled=false;btn.textContent=old;
  if(!text||!FS)return;
  FS.prev={v:el.value,sel:s&&s.locSel?s.locSel.slice():null,txt:s?s.locText:""};
  if(s&&FS.kind==="sec"){s.locSel=[];s.locText="";sheet.querySelectorAll("[data-floc]").forEach(b=>b.classList.remove("on"));}
  fSet(el,text);fSync();
  const u=sheet.querySelector("[data-fundo]");if(u)u.hidden=false;
  toast("Tidied. Read it before you send",2400);
}
function fUndo(){
  const el=fEl();if(!el||!FS.prev)return;
  const s=(FS.kind==="sec")?sec(FS.code):null;
  fSet(el,FS.prev.v);
  if(s){s.locSel=FS.prev.sel||[];s.locText=FS.prev.txt||"";sheet.querySelectorAll("[data-floc]").forEach(b=>b.classList.toggle("on",s.locSel.includes(+b.dataset.floc)));}
  FS.prev=null;const u=sheet.querySelector("[data-fundo]");if(u)u.hidden=true;fSync();
}
/* Species: one button, opens a pick-list (replaces the row of chips on the main page) */
function openSpecies(code){
  const list=SPECIES_BY_CODE[code];if(!list)return;
  FS={kind:"species",code};
  const s=sec(code);
  sheet.innerHTML=`<h3>${code==="8.8"?"Borer type":"Termite species"}</h3><p class="fsub">Tap all that apply.</p><div class="fscroll"><div class="flines">${list.map((sp,i)=>`<button type="button" class="frow ${(s.species||[]).includes(sp)?'on':''}" data-sp="${i}"><span class="ftick"></span><span class="ftxt">${escv(sp)}</span></button>`).join("")}</div>
    <input class="obsnote" id="spOther" placeholder="Type the other species" value="${escv(s.speciesOther)}" style="margin-top:10px;display:${(s.species||[]).includes('Other')?'block':'none'}"></div>
    <div class="acts"><button class="btn primary" type="button" data-fdone id="fdone">Done</button></div>`;
  sheet.classList.add("tall");modal.classList.add("show");
}
function spTags(code){
  const s=sec(code);const t=document.getElementById("sptags-"+code);if(t)t.innerHTML=spTagsHtml(s);
}
sheet.addEventListener("click",async e=>{
  if(!FS)return;
  const b=e.target.closest("[data-fline],[data-floc],[data-fdone],[data-ftidy],[data-fundo],[data-fsetup],[data-fkeysave],[data-sp]");
  if(!b)return;
  if(b.dataset.fdone!==undefined){closeModal();return}
  if(b.dataset.fline!==undefined){fToggleLine(+b.dataset.fline);return}
  if(b.dataset.floc!==undefined){fToggleLoc(+b.dataset.floc);return}
  if(b.dataset.ftidy!==undefined){fTidy(b);return}
  if(b.dataset.fundo!==undefined){fUndo();return}
  if(b.dataset.fsetup!==undefined){const k=document.getElementById("fkey"),n=document.getElementById("fkeynote");if(k)k.hidden=false;if(n)n.hidden=false;const i=document.getElementById("fKeyIn");if(i)i.focus();return}
  if(b.dataset.fkeysave!==undefined){
    const v=(document.getElementById("fKeyIn").value||"").trim();if(!v){toast("Paste the key first");return}
    try{localStorage.setItem("lpc_ai_key",v);}catch(err){toast("Couldn't save the key on this device");return}
    renderFAI();toast("Key saved. Tidy with AI is on");return}
  if(b.dataset.sp!==undefined&&FS.kind==="species"){
    const code=FS.code,s=sec(code),v=SPECIES_BY_CODE[code][+b.dataset.sp];
    s.species=s.species||[];const i=s.species.indexOf(v);
    if(i>=0)s.species.splice(i,1);else s.species.push(v);
    b.classList.toggle("on",i<0);
    if(v==="Other"){const ol=document.getElementById("spOther");
      if(ol){ol.style.display=i<0?"block":"none";if(i<0)ol.focus();else{ol.value="";s.speciesOther="";}}}
    spTags(code);
    // a species picked on an untouched item implies a finding (same as adding a photo)
    if(i<0&&!s.status)setStatus(code,"find",true);else{updateHeaderCount(code);refreshPill(code);scheduleSave();}
  }
});
sheet.addEventListener("input",e=>{
  if(FS&&FS.kind==="species"&&e.target.id==="spOther"){sec(FS.code).speciesOther=e.target.value;spTags(FS.code);scheduleSave();}
});

/* ---------- "Rest are clear": one tap to mark every untouched 8.x section Clear ---------- */
function buildRestClear(){
  const d=document.createElement("div");
  d.innerHTML=`<button class="restclear" type="button" data-restclear>Nothing else found? Mark the rest as Clear</button>`;
  return d;
}
function restClearTargets(){
  const out=[];
  ITEMS.forEach(it=>{
    if(it.always)return;
    const s=STATE.sections[it.code]||{};
    if(it.subQs){const ans=s.subq||{};const un=it.subQs.map((q,i)=>i).filter(i=>!ans[i]);if(un.length)out.push({it,subs:un});return}
    if(s.status)return;
    if((s.note||"").trim()||(s.photos||[]).length||(s.species||[]).length)return;
    if(it.code==="8.9"&&slabNoSub()){out.push({it,skip:true});return}
    out.push({it});
  });
  return out;
}
function openRestClear(){
  const all=restClearTargets(),todo=all.filter(x=>!x.skip),skipped=all.filter(x=>x.skip);
  if(!todo.length){toast("Nothing left to mark. Everything has an answer or something on it",2800);return}
  sheet.innerHTML=`<h3>Mark the rest as Clear?</h3>
    <p style="font-size:.85rem">These haven't been touched, so they'll be set to Clear (no evidence found). Anything you've answered or added to is left alone.</p>
    <div class="pickwrap" style="max-height:40vh">${todo.map(x=>`<div class="pickrow" style="cursor:default"><span>${escv(x.it.code+" "+itemTitle(x.it))}${x.subs?` (${x.subs.length} question${x.subs.length>1?'s':''} set to No)`:''}</span></div>`).join("")}</div>
    ${skipped.length?`<p style="font-size:.82rem">8.9 is left for you: slab floor and no subfloor, so N/A may be the right answer.</p>`:''}
    <div class="acts"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mRestGo">Mark ${todo.length} as Clear</button></div>`;
  modal.classList.add("show");
  document.getElementById("mCancel").onclick=closeModal;
  document.getElementById("mRestGo").onclick=()=>{
    todo.forEach(x=>{const code=x.it.code;
      if(x.subs){const s=sec(code);s.subq=s.subq||{};x.subs.forEach(i=>{s.subq[i]="no";});
        const blk=document.getElementById("b-"+code);
        if(blk)x.subs.forEach(i=>blk.querySelectorAll('[data-subq="'+i+'"]').forEach(b=>b.classList.toggle("on",b.dataset.subv==="no")));
        setStatus(code,subStatus(code),false);}
      else setStatus(code,"clear",false);
    });
    closeModal();toast(todo.length+" marked Clear",2200);
  };
}

/* ---------- Conclusion: dashed outline on the likely answer (you still tap) ---------- */
function refreshConcSuggest(){
  const S=STATE.sections||{};const st=c=>(S[c]||{}).status;
  const isF=c=>st(c)==="find"||st(c)==="undet";
  const mark=(sel,on)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle("suggest",!!on));
  const t=st("8.1")==="find"?"Yes":(st("8.1")==="clear"?"No":"");
  ["Yes","No"].forEach(v=>mark('[data-ynkey="treatment"] [data-yn="'+v+'"]',t===v));
  const cond=["8.9","8.10","8.11","8.12","8.13"];
  const cv=cond.some(isF)?"Yes":(cond.every(k=>st(k))?"No":"");
  ["Yes","No"].forEach(v=>mark('[data-ynkey="conducive"] [data-yn="'+v+'"]',cv===v));
  mark('[data-chipkey="nextinsp"] [data-cs="12 months"]',true);
}

/* ---------- boot ---------- */
(async function(){
  try{ await openDB(); }catch(e){ db=null; }
  let list=await loadJobsIndex();
  // migrate the old single-job "current" store into the jobs system, once
  const legacy=db?await dbGet("current"):null;
  if(legacy&&legacy.sections&&!list.length){
    legacy.id=legacy.id||genId();
    await dbSet("job::"+legacy.id,legacy);
    await dbSet("activeId",legacy.id);
    list=[jobMeta(legacy)];await saveJobsIndex(list);
    await dbDel("current");
  }
  const activeId=db?await dbGet("activeId"):null;
  let saved=activeId?await dbGet("job::"+activeId):null;
  if((!saved||!saved.sections)&&list.length){saved=await dbGet("job::"+list[0].id);}
  if(saved&&saved.sections){STATE=saved;}
  else{STATE={id:genId(),customer:newJobCustomer(),sections:{}};}
  if(!STATE.id)STATE.id=genId();
  if(!STATE.customer)STATE.customer={};
  if(!STATE.customer.date)STATE.customer.date=todayStr();
  if(db){await dbSet("job::"+STATE.id,STATE);await dbSet("activeId",STATE.id);await upsertJobMeta();}
  if(STATE.customer.address)document.getElementById("hsub").textContent=STATE.customer.address;
  applyPhotoSrc();
  render();
})();
</script>
