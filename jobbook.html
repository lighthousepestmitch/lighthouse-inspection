<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Book">
<meta name="theme-color" content="#0E4F54">
<title>Lighthouse Job Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface2:#EDF0EC; --raise:0 1px 2px rgba(20,32,30,.06),0 4px 14px rgba(20,32,30,.05);
  --ink:#14201E; --ink2:#4B5B57; --ink3:#7E8D88; --line:#DCE1DD; --line2:#C9D1CC;
  --deep:#0E4F54; --deepInk:#FFFFFF; --accent:#B4701F;
  --over:#A23C29; --overBg:#F8E8E3; --soon:#8C6314; --soonBg:#F8F0DC; --ok:#276B59; --okBg:#E2EFE9;
  --focus:#0E4F54;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#16211F; --surface2:#1E2B28; --raise:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --ink:#E9EEEB; --ink2:#9FB0AB; --ink3:#71837E; --line:#27342F; --line2:#33423D;
  --deep:#57B3BA; --deepInk:#08201F; --accent:#DDA05B;
  --over:#EE9179; --overBg:#2C1A16; --soon:#DCB162; --soonBg:#2B2416; --ok:#74C8A8; --okBg:#14261F;
  --focus:#57B3BA;
}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#16211F; --surface2:#1E2B28; --raise:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --ink:#E9EEEB; --ink2:#9FB0AB; --ink3:#71837E; --line:#27342F; --line2:#33423D;
  --deep:#57B3BA; --deepInk:#08201F; --accent:#DDA05B;
  --over:#EE9179; --overBg:#2C1A16; --soon:#DCB162; --soonBg:#2B2416; --ok:#74C8A8; --okBg:#14261F;
  --focus:#57B3BA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:calc(68px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;text-wrap:balance;margin:0}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--deep);color:var(--deepInk);
  padding:12px 0 0;box-shadow:var(--raise)}
.brand{display:flex;align-items:baseline;gap:9px;padding-bottom:10px}
.brand h1{font-size:19px;color:var(--deepInk);letter-spacing:-.01em}
.brand .sub{font-size:11px;opacity:.72;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.16);
  border-radius:10px 10px 0 0;overflow:hidden}
.stat{background:var(--deep);padding:9px 10px 11px;text-align:left}
.stat b{display:block;font-family:"Spline Sans Mono",monospace;font-size:21px;font-weight:600;
  line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.78;font-weight:600}
.stat.hot b{color:#FFC9B8}

/* tabs / nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
nav.bottom button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="true"]{color:var(--deep)}
nav.bottom .badge{position:absolute;transform:translate(13px,-4px);background:var(--over);color:#fff;
  font-size:9px;font-weight:700;padding:1px 4px;border-radius:7px;font-family:"Spline Sans Mono",monospace}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);
  background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* section head */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sechead h2{font-size:16px}
.sechead .n{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--ink3);font-weight:500}

/* rows */
.row{display:flex;gap:0;align-items:stretch;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;overflow:hidden;box-shadow:var(--raise);width:100%;text-align:left}
.row:hover{border-color:var(--line2)}
.rowhit{flex:1;min-width:0;display:flex;gap:11px;align-items:stretch;text-align:left;
  background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.rowhit:hover .nm{color:var(--deep)}
.stripe{flex:0 0 4px;background:var(--line2)}
.row.over .stripe{background:var(--over)} .row.soon .stripe{background:var(--soon)}
.row.ok .stripe{background:var(--ok)} .row.todo .stripe{background:var(--accent)}
.row.fresh .stripe{background:var(--over)} .row.stale .stripe{background:var(--ink3)}
.rowmain{flex:1;min-width:0;padding:10px 4px 10px 0;display:flex;gap:10px;align-items:center}
.rowtext{flex:1;min-width:0}
.rowtext .nm{font-weight:700;font-size:14.5px;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtext .pl{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtext .mt{font-size:11.5px;color:var(--ink3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;font-family:"Spline Sans Mono",monospace;font-size:11px;font-weight:600;
  padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.over{background:var(--overBg);color:var(--over)} .pill.soon{background:var(--soonBg);color:var(--soon)}
.pill.ok{background:var(--okBg);color:var(--ok)} .pill.todo{background:var(--soonBg);color:var(--accent)}
.pill.fresh{background:var(--overBg);color:var(--over)} .pill.stale{background:var(--surface2);color:var(--ink3)}
.acts{flex:0 0 auto;display:flex;gap:5px;padding:0 9px 0 4px;align-items:center}
@media(max-width:400px){.acts{gap:3px;padding:0 5px 0 2px}.iact{width:30px;height:30px}}
.iact{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);
  display:grid;place-items:center;color:var(--ink2)}
.iact svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iact:hover{color:var(--deep);border-color:var(--deep)}
.iact[disabled]{opacity:.32;cursor:default}

.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty h3{font-size:17px;color:var(--ink2);margin-bottom:5px}
.note{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin:12px 0}
.note b{color:var(--ink)}

/* search */
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink);font-size:15px;margin-top:12px}
.search::placeholder{color:var(--ink3)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,20,18,.42);display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet .panel{background:var(--bg);width:100%;max-width:880px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28)}
@media(min-width:720px){.sheet{align-items:center}.sheet .panel{border-radius:16px;max-height:86vh}}
.shhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px 16px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:2}
.shttl{flex:1;min-width:0}
.shhead h2{font-size:19px;line-height:1.2}
.shhead .sb{font-size:12.5px;color:var(--ink2);margin-top:2px}
.x{width:32px;height:32px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.shbody{padding:14px 16px 26px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv dt{flex:0 0 96px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:1px}
.kv dd{margin:0;flex:1;min-width:0;word-break:break-word}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{flex:1;min-width:112px;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);font-weight:600;font-size:13.5px;display:flex;align-items:center;
  justify-content:center;gap:7px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--deep);color:var(--deepInk);border-color:var(--deep)}
.btn.warn{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.ivgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;margin:10px 0}
.iv{padding:9px 6px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);
  font-size:12.5px;font-weight:600;text-align:center}
.iv[aria-pressed="true"]{background:var(--deep);color:var(--deepInk);border-color:var(--deep)}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.svc .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.svc .top b{font-size:14px}
.hist{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--line2);padding:2px 0 2px 11px;margin-bottom:11px}
.hist.warnrow{border-left-color:var(--soon);background:var(--soonBg);border-radius:0 8px 8px 0;padding:7px 10px 9px 11px}
.quote{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  margin:6px 0;font-size:13px;color:var(--ink);white-space:pre-wrap;line-height:1.5}
.subj{font-weight:700;color:var(--ink);margin-top:3px}
.reply{margin-top:8px;padding-left:10px;border-left:2px solid var(--ok)}
.hist.inrow{border-left-color:var(--ok)}
.hist.inrow .quote{background:var(--okBg);border-color:var(--ok)}
.lbl2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);
  font-weight:700;margin:12px 0 6px}
.daterow{display:flex;gap:8px;align-items:stretch}
.daterow .inp{flex:1;min-width:0}
.daterow .btn{flex:0 0 auto;min-width:0;padding:10px 14px}
.sel{appearance:none;-webkit-appearance:none;background-image:
  linear-gradient(45deg,transparent 50%,currentColor 50%),
  linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:34px;font-weight:600;cursor:pointer}
a.iact{text-decoration:none}
a.btn{text-decoration:none}
.copybox{display:flex;gap:8px;align-items:center;background:var(--surface2);
  border:1px solid var(--line2);border-radius:9px;padding:8px 8px 8px 12px;margin-bottom:8px}
.copylink{color:var(--deep);text-decoration:underline;text-underline-offset:3px;
  font-weight:600;font-size:16px!important;padding:3px 0;display:block}
.copylink:hover{color:var(--accent)}
.hint{font-size:11.5px;color:var(--ink3);margin:-4px 0 10px 2px}
.bignum{font-family:"Spline Sans Mono",monospace;font-size:21px;font-weight:600;color:var(--ink);
  letter-spacing:.01em;padding:10px 0 4px;-webkit-user-select:text;user-select:text;word-break:break-all}
.copyval{flex:1;min-width:0;font-family:"Spline Sans Mono",monospace;font-size:13px;
  color:var(--ink);word-break:break-word;white-space:pre-wrap;max-height:130px;overflow:auto;
  -webkit-user-select:text;user-select:text}
.copybox .btn{flex:0 0 auto;min-width:0;padding:8px 13px}
.diag{font-family:"Spline Sans Mono",monospace;font-size:11.5px;color:var(--ink2);
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.hist .hd{font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--ink3);font-weight:600}
.jline{margin-top:4px;line-height:1.4}
.jsvc{font-weight:700;color:var(--ink);font-size:12.5px}
.jdesc{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.msgbox{width:100%;min-height:118px;padding:11px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;
  margin:16px 0 7px}
.inp{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.banner{padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:12px;border:1px solid}
.banner.warn{background:var(--soonBg);border-color:var(--soon);color:var(--soon)}
.banner.ok{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.banner.bad{background:var(--overBg);border-color:var(--over);color:var(--over)}
.spin{width:19px;height:19px;border:2px solid var(--line2);border-top-color:var(--deep);
  border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.boot{display:grid;place-items:center;min-height:70vh;text-align:center;padding:24px;gap:10px;color:var(--ink2)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>Job Book</h1><span class="sub">Lighthouse Pest</span>
    </div>
    <div class="stats">
      <button class="stat hot" data-go="due" data-band="fresh"><b id="s-fresh">—</b><span>Ring today</span></button>
      <button class="stat" data-go="due" data-band="over"><b id="s-over">—</b><span>Well overdue</span></button>
      <button class="stat" data-go="todo"><b id="s-todo">—</b><span>Needs an interval</span></button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="boot"><div><span class="spin"></span></div><div>Opening your job book…</div></div>
</main>

<nav class="bottom" id="nav" hidden>
  <button data-go="due" aria-current="true"><svg viewBox="0 0 24 24"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>Due</button>
  <button data-go="clients"><svg viewBox="0 0 24 24"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7" r="3.5"/><path d="M17 11h4M19 9v4"/></svg>Clients</button>
  <button data-go="reviews"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Reviews</button>
  <button data-go="sync"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Setup</button>
</nav>
<div id="sheet"></div>

<script>
(function(){
"use strict";
const BUILD="2026-10-04f";
const $=s=>document.querySelector(s), el=(t,c,x)=>{const n=document.createElement(t);
  if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5;
const iso=d=>{const z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10);};
const TODAY=iso(new Date());
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d);};
const days=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const AU=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice=s=>{if(!s)return "—";const d=parse(s);return d.getDate()+" "+AU[d.getMonth()]+" "+d.getFullYear();};
const when=t=>{if(!t)return "—";const d=new Date(t);
  return d.getDate()+" "+AU[d.getMonth()]+" "+d.getFullYear()+", "+
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const SVG={phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
 msg:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.3 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.8A8.4 8.4 0 0 1 3.7 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 tick:'<path d="m5 13 4 4L19 7"/>',
 star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
 bin:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
 bell:'<path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>',
 note:'<path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>',
 l:'<path d="m15 6-6 6 6 6"/>', r:'<path d="m9 6 6 6-6 6"/>'};
const ico=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;

/* everyday words for what you actually do */
const PLAIN={"General Pest Treatment":"a cockroach, ant and spider treatment",
 "Cockroach Treatment":"a cockroach treatment","Cockroach & Ant Treatment":"a cockroach and ant treatment",
 "Ant Treatment":"an ant treatment","Spider Treatment":"a spider treatment",

/* how intervals are named and how long they are */
const INTERVAL_GROUPS=[
 {label:"Weeks",  items:[{k:"2 weeks",m:0.5},{k:"4 weeks",m:1},{k:"6 weeks",m:1.5},{k:"8 weeks",m:2}]},
 {label:"Months", items:[{k:"Quarterly",m:3},{k:"Biannual",m:6},{k:"9 months",m:9},{k:"Annual",m:12}]},
 {label:"Years",  items:[{k:"2 years",m:24},{k:"3 years",m:36},{k:"4 years",m:48},{k:"5 years",m:60}]},
 {label:"Neither",items:[{k:"One-off",m:null}]}];
const INTERVALS=INTERVAL_GROUPS.reduce((a,g)=>a.concat(g.items),[]);
const LEGACY={"3 months":"Quarterly","6 months":"Biannual","12 months":"Annual","1 year":"Annual",
 "one-off":"One-off","1 month":"Quarterly","2 months":"Quarterly"};
const normIv=v=>!v?null:(LEGACY[String(v).toLowerCase()]||LEGACY[v]||v);
const monthsOf=k=>{const i=INTERVALS.find(x=>x.k===normIv(k)); return i?i.m:null;};
function addMonths(d,m){ const x=parse(d); x.setDate(x.getDate()+Math.round(m*30.44)); return iso(x); }

async function loadAll(){

  S.settings=await g("settings");
  if(!S.settings){ boot("Couldn't load your clients",
    "The data files didn't come down. Check you're online and pull to reload."); return; }
  S.sync=await g("sync")||{lastSyncedDate:S.settings.seedDataEnds};
  S.asked=((await g("review_asks"))||{}).rows||{};   // review texts already sent, pulled off his Mac
  const m=Object.assign({clients:5,properties:3,jobs:4,due:3,replies:0},S.settings.manifest||{});
  const want=[]; for(const k of ["clients","properties","jobs","due","replies"])
    for(let i=0;i<m[k];i++) want.push([k,k+"_"+i]);
  const got=await Promise.all(want.map(([,f])=>g(f)));
  want.forEach(([k],i)=>{ const d=got[i]; if(!d)return;
    if(k==="due") S.due=S.due.concat(d.rows||[]);

    else Object.assign(S[k==="clients"?"clients":k==="properties"?"props":"jobs"],d.rows||{}); });
  /* Lapsed and cold clients come off the old QuickBooks list with no property, and
     everything (ring, text, contact log) hangs off a property. Give them one. */
  const has=new Set(Object.values(S.props).map(p=>p.c));
  for(const id in S.clients) if(!has.has(id)){ const c=S.clients[id];
    S.props[id+"::main"]={c:id,l:(c.a||[]).filter(Boolean).slice(0,2).join(", ")||"(no address)",n:0}; }
  const mine=STORE.read();
  S.ov=mine.ov||{}; S.bookings=mine.bookings||{}; S.gone=mine.gone||{}; S.reviewLink=mine.reviewLink||REVIEW_LINK;
  S.ready=true; $("#nav").hidden=false; render();
}

/* every write goes through here: updates memory first so the screen is never a lie,

function persist(){

/* ---------- model ---------- */
function lines(){
  const out=[];
  for(const d of S.due){
    const o=S.ov[d.p]||{}, so=(o.svc&&o.svc[d.s])||{};
    if(so.skip||S.gone[pOf(d.p).c]) continue;
    const interval=so.interval!==undefined?normIv(so.interval):normIv(d.iv);
    const lastDone=so.lastDone||d.ld;
    let nextDue;
    if(so.nextDue!==undefined) nextDue=so.nextDue;                       // hand-picked date wins
    else if(so.interval!==undefined) nextDue=lastDone&&monthsOf(interval)?addMonths(lastDone,monthsOf(interval)):null;
    else nextDue=d.nd;
    out.push({pid:d.p,svc:d.s,lastDone,interval,nextDue,src:d.src,manual:so.nextDue!==undefined});
  }
  return out;
}

  return n<=30?"soon":"ok"; }
function ago(l){ if(!l.nextDue) return "set it";
  const n=days(TODAY,l.nextDue);
  if(n<0){ const a=-n; return a>=365?Math.floor(a/365)+"y "+Math.floor(a%365/30)+"m":a>=60?Math.floor(a/30)+"m":a+"d"; }
  if(n===0) return "today"; return n<=30?n+"d":nice(l.nextDue); }

const isApple=/iPad|iPhone|iPod|Macintosh|Mac OS X/.test(navigator.userAgent);
/* Apple Messages wants sms:NUMBER&body=..., everything else uses ? */
const smsHref=(ph,body)=>"sms:"+String(ph).replace(/[^\d+]/g,"")+(isApple?"&":"?")+"body="+encodeURIComponent(body);
const mailHref=(em,subj,body)=>"mailto:"+em+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
/* This page runs in a sandbox with no allow-top-navigation, so location.href and a
   plain <a> click are silently swallowed. allow-popups is granted, so window.open is
   the only way out - and even that can be refused for sms:/tel:/mailto:. Every caller
   must handle a false return by offering copy-and-paste instead. */
function openExternal(href){
  // window.open returns null BOTH when the sandbox blocks it and when the OS quietly
  // hands the link to Messages/Mail. There is no way to tell those apart, so this
  // never reports success - callers always offer copy-and-paste as well.
  try{ window.open(href,"_blank","noopener"); }catch(e){}
  try{ const a=document.createElement("a"); a.href=href; a.target="_blank"; a.rel="noopener";
       document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=t;
       ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
       ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e){}
  return false;
}
/* One row: the value, a Copy button, and - when it's a number or address - the value
   itself as a real tappable link carrying the message. If the sandbox lets the tap
   through, Messages/Mail opens with the text already in it and there's nothing to paste.
   If it doesn't, Copy is right there. Either way something works. */
function copyRow(b,label,value,href,hint){
  b.appendChild(el("div","lbl2",label));
  const box=el("div","copybox");
  if(href){
    const a=document.createElement("a");
    a.className="copyval copylink"; a.href=href; a.target="_blank"; a.rel="noopener";
    a.textContent=value; box.appendChild(a);
  } else box.appendChild(el("div","copyval",value));
  const cb=el("button","btn"); cb.innerHTML=ico(SVG.tick)+"<span>Copy</span>";
  cb.onclick=async()=>{ const ok=await copyText(value);
    cb.querySelector("span").textContent=ok?"Copied":"Select it and copy";
    setTimeout(()=>{cb.querySelector("span").textContent="Copy";},2500); };
  box.appendChild(cb); b.appendChild(box);
  if(hint) b.appendChild(el("div","hint",hint));
}
function copyFallback(b,label,value,extraLabel,extraValue,extraHref,extraHint){
  copyRow(b,label,value,null);
  if(extraValue) copyRow(b,extraLabel,extraValue,extraHref,extraHint);
}

function groupLines(list){
  const map=new Map();
  list.forEach(l=>{ const k=l.pid+"|"+(l.nextDue||"none");
    if(!map.has(k)) map.set(k,{pid:l.pid,nextDue:l.nextDue,lastDone:l.lastDone,
                               interval:l.interval,manual:l.manual,svcs:[],lines:[]});
    const g=map.get(k); g.svcs.push(l.svc); g.lines.push(l);
    if(l.lastDone&&(!g.lastDone||l.lastDone>g.lastDone)) g.lastDone=l.lastDone; });
  return [...map.values()];
}
/* These are anchors, not buttons, on purpose. The page is sandboxed without
   allow-top-navigation, so JS asking to open Messages gets swallowed. A direct tap on a
   real link is the one thing with a chance of getting through. The onclick still runs
   (log it, open the panel) but never calls preventDefault, so the link fires too. */
function actionLink(href,svgp,title,after,enabled){
  if(!enabled){ const b=el("button","iact"); b.innerHTML=ico(svgp);
    b.title=title; b.setAttribute("aria-label",title); b.disabled=true; return b; }
  const a=document.createElement("a");
  a.className="iact"; a.href=href; a.target="_blank"; a.rel="noopener";
  a.innerHTML=ico(svgp); a.title=title; a.setAttribute("aria-label",title);
  a.onclick=e=>{ e.stopPropagation(); try{ after(); }catch(err){ reportErr(title,err); } };
  return a;
}
function actionBtns(l){
  const c=cOf(l.pid), acts=el("div","acts");
  const num=String(c.p||"").replace(/[^\d+]/g,"");
  const mk=(href,svgp,title,after,on)=>{
    if(!on){ const b=el("button","iact"); b.innerHTML=ico(svgp); b.title=title;
      b.setAttribute("aria-label",title); b.disabled=true; return b; }
    const a=document.createElement("a");
    a.className="iact"; a.href=href; a.innerHTML=ico(svgp);
    a.title=title; a.setAttribute("aria-label",title);
    a.onclick=e=>{ e.stopPropagation(); try{ after(); }catch(err){ reportErr(title,err); } };
    return a;
  };
  const msg=msgFor(l);
  acts.appendChild(mk("tel:"+num,SVG.phone,"Ring "+c.n,()=>afterRing(l),!!c.p));
  acts.appendChild(mk(smsHref(c.p,msg),SVG.msg,"Text "+c.n,()=>afterSend(l,"text",msg),!!c.p));
  acts.appendChild(mk(mailHref(c.e,"Lighthouse Pest Control",msg),SVG.mail,"Email "+c.n,
    ()=>afterSend(l,"email",msg),!!c.e));
  return acts;
}

/* ---------- sheets: a stack, so Back always works and nothing gets stuck ---------- */
function openSheet(spec){ S.stack.push(spec); drawSheet(); }
function closeSheet(all){ if(all) S.stack.length=0; else S.stack.pop(); drawSheet(); }
function replaceSheet(spec){ S.stack.pop(); S.stack.push(spec); drawSheet(); }
function drawSheet(){
  const host=$("#sheet");
  if(!S.stack.length){ host.innerHTML=""; document.body.style.overflow=""; return; }
  const spec=S.stack[S.stack.length-1], back=S.stack.length>1;
  host.innerHTML=`<div class="sheet"><div class="panel" role="dialog" aria-modal="true">
    <div class="shhead">
      ${back?`<button class="x" id="shback" aria-label="Back">${ico(SVG.l)}</button>`:""}
      <div class="shttl"><h2>${esc(spec.title)}</h2><div class="sb">${esc(spec.sub||"")}</div></div>
      <button class="x" id="shx" aria-label="Close">${ico(SVG.x)}</button>
    </div><div class="shbody" id="shbody"></div></div></div>`;
  document.body.style.overflow="hidden";
  $("#shx").onclick=()=>closeSheet(true);
  if(back) $("#shback").onclick=()=>closeSheet();
  const sh=host.querySelector(".sheet");
  sh.onclick=e=>{ if(e.target===sh) closeSheet(true); };
  try{ spec.build($("#shbody")); }
  catch(err){ $("#shbody").innerHTML=`<div class="banner bad">Something went wrong opening this. Close and try again.</div>`; }
  $("#shbody").scrollTop=0;

  if(firedWith){

    const entry={id:uid(),t:new Date().toISOString(),ch:channel,to,
                 subject:channel==="email"?"Lighthouse Pest Control":"",
                 msg:firedWith,svcs:(l.svcs||[l.svc]),st:"drafted"};

    openSheet(confirmSpec(l.pid,entry));

  }
  openSheet({title:(preset&&preset.title)||((channel==="email"?"Email ":"Text ")+c.n), sub:to, build:b=>{

      +"<span>Open in "+(channel==="email"?"Mail":"Messages")+"</span>";
    go.onclick=()=>{                       // no preventDefault - the link must still fire
      const entry={id:uid(),t:new Date().toISOString(),ch:channel,to,
                   subject:subj?subj.value:"",msg:ta.value,svcs:(l.svcs||[l.svc]),st:"drafted",
                   kind:preset?preset.kind:undefined};
      logContact(l.pid,entry);

/* ---------- property sheet ---------- */
function myLine(pid,svc){
  const all=lines().filter(l=>l.pid===pid);
  if(!all.length) return {pid,svc:svc||"pest control",svcs:[svc||"pest control"],lastDone:null,interval:null,nextDue:null};
  const seed=all.find(l=>l.svc===svc)||all[0];
  const near=all.filter(l=>l.nextDue&&seed.nextDue?Math.abs(days(l.nextDue,seed.nextDue))<=30:l.nextDue===seed.nextDue);
  const g=near.length?near:[seed];
  return {pid,svc:seed.svc,svcs:g.map(l=>l.svc),lines:g,
          lastDone:g.map(l=>l.lastDone).filter(Boolean).sort().pop()||seed.lastDone,
          interval:seed.interval,nextDue:seed.nextDue};
}

      main.appendChild(tx); hit.appendChild(main);
      hit.onclick=()=>openProp(pid);
      r.appendChild(hit); b.appendChild(r);
    });
    contactHistory(b,id,null);
    deleteBtn(b,id);
  }});
}
/* ---------- clients ---------- */
function viewClients(m){
  const s=el("input","search"); s.type="search"; s.placeholder="Search name, address, phone or email";
  s.value=S.q; s.oninput=()=>{S.q=s.value; renderClientList();}; m.appendChild(s);
  const chips=el("div","chips");
  [["active","Active"],["lapsed","Haven't seen in a while"],["barrier","Barriers"],
   ["cold","Cold list"],["*","Everyone"]]
   .concat(Object.keys(S.gone).length?[["gone","Deleted ("+Object.keys(S.gone).length+")"]]:[])
   .forEach(([k,lab])=>{
    const c=el("button","chip",lab); c.setAttribute("aria-pressed",String(S.grp===k));
    c.onclick=()=>{S.grp=k; render();}; chips.appendChild(c); });
  m.appendChild(chips);
  const host=el("div"); host.id="clist"; m.appendChild(host); renderClientList();
}
function renderClientList(){
  const host=$("#clist"); if(!host) return;
  const q=S.q.trim().toLowerCase();
  let ids=Object.keys(S.clients);
  if(S.grp==="gone") ids=ids.filter(i=>S.gone[i]);
  else { ids=ids.filter(i=>!S.gone[i]);
    if(S.grp!=="*") ids=ids.filter(i=>(S.clients[i].g||"active")===S.grp); }
  if(q) ids=ids.filter(i=>{const c=S.clients[i];
    return (c.n+" "+(c.e||"")+" "+(c.p||"")+" "+((c.a||[]).join(" "))).toLowerCase().includes(q);});
  ids.sort((a,b)=>S.clients[a].n.localeCompare(S.clients[b].n));
  host.innerHTML="";
  const h=el("div","sechead"); h.appendChild(el("h2",null,"Clients"));
  h.appendChild(el("span","n",ids.length+(ids.length===1?" person":" people"))); host.appendChild(h);
  if(!ids.length){ const e=el("div","empty"); e.innerHTML="<h3>Nobody found</h3><p>Try a different search.</p>"; host.appendChild(e); return; }
  ids.slice(0,300).forEach(id=>{
    const c=S.clients[id], pid=Object.keys(S.props).find(p=>S.props[p].c===id);
    const r=el("div","row ok"), hit=el("button","rowhit");
    hit.appendChild(el("div","stripe"));
    const main=el("div","rowmain"), tx=el("div","rowtext");
    tx.appendChild(el("div","nm",c.n));
    tx.appendChild(el("div","pl",(c.a&&c.a[0])?c.a.filter(Boolean).slice(0,2).join(", "):(c.e||"(no address)")));
    const bits=[]; if(c.ic) bits.push(c.ic+" invoice"+(c.ic===1?"":"s"));
    if(c.lt) bits.push(c.lt); if(c.ls) bits.push("last "+nice(c.ls));
    if(!c.p&&!c.e) bits.push("no phone or email on file");
    tx.appendChild(el("div","mt",bits.join(" · ")||"—"));
    main.appendChild(tx);
    main.appendChild(el("span","pill",{active:"Active",lapsed:"Lapsed",barrier:"Barrier",cold:"Cold"}[c.g||"active"]));
    hit.appendChild(main); hit.onclick=()=>openClient(id);
    r.appendChild(hit);
    if(pid) r.appendChild(actionBtns(myLine(pid)));
    host.appendChild(r);
  });
  if(ids.length>300) host.appendChild(el("div","note",`Showing 300 of ${ids.length}. Narrow it with the search box.`));
}


/* ---------- reviews tab ----------
   Its own list, nothing to do with the due/reminder system. Every client with a mobile,
   most recent job first, so he can ask the same day. "Asked" counts a text sent from here
   or one found in Messages on his Mac (review_asks.json, tools/import_review_asks.py). */
function clientAsked(id,pids){
  let best=S.asked[id]||"";
  pids.forEach(p=>{ const e=lastReviewAsk(p); if(e&&e.t.slice(0,10)>best) best=e.t.slice(0,10); });
  return best;
}
function viewReviews(m){
  const h=el("div","sechead"); h.appendChild(el("h2",null,"Google reviews"));
  m.appendChild(h);
  m.appendChild(el("div","note","Everyone with a mobile, most recent job first. Tap Ask and it opens Messages "
    +"with your review link in it. Texts you've already sent from your Mac show as asked."));
  const sb=el("input","search"); sb.type="search"; sb.placeholder="Search name or address";
  sb.value=S.rq; m.appendChild(sb);
  const host=el("div"); m.appendChild(host);
  const all=[];
  for(const id in S.clients){
    const c=S.clients[id]; if(S.gone[id]||!c.p) continue;
    const pids=Object.keys(S.props).filter(p=>S.props[p].c===id); if(!pids.length) continue;
    let last=null, pid=pids[0];
    pids.forEach(p=>(S.jobs[p]||[]).forEach(j=>{ if(j.d&&(!last||j.d>last.d)){ last=j; pid=p; } }));
    const asked=clientAsked(id,pids), skip=pids.some(reviewSkipped);
    all.push({id,c,pid,pids,last,ld:last?last.d:(c.ls||""),asked,skip});
  }
  all.sort((a,b)=>b.ld.localeCompare(a.ld)||a.c.n.localeCompare(b.c.n));
  const row=r=>{
    const p=pOf(r.pid), w=el("div","row "+(r.asked||r.skip?"ok":"soon")), hit=el("button","rowhit");
    w.style.flexWrap="wrap"; hit.style.flexBasis="100%";
    hit.appendChild(el("div","stripe"));
    const main=el("div","rowmain"), tx=el("div","rowtext");
    tx.appendChild(el("div","nm",r.c.n));
    tx.appendChild(el("div","pl",p.l||""));
    const what=r.last?[...new Set(r.last.s.map(x=>x.s))].join(", "):(r.c.lt||"");
    tx.appendChild(el("div","mt",(r.ld?"Last job "+nice(r.ld):"No job date")+(what?" · "+what:"")
      +(r.asked?" · asked "+nice(r.asked):r.skip?" · not asking":"")));
    main.appendChild(tx); hit.appendChild(main); hit.onclick=()=>openProp(r.pid);
    w.appendChild(hit);
    const acts=el("div","btns"); acts.style.cssText="padding:0 12px 12px;flex-basis:100%";
    if(!r.asked&&!r.skip){
      acts.appendChild(btn("Ask",SVG.star,"pri",()=>askReview(myLine(r.pid))));
      acts.appendChild(btn("Not this one",SVG.x,"",async()=>{
        await saveOv(r.pid,{noReview:true}); toast("Won't ask "+r.c.n+"."); }));
    } else if(r.skip){
      acts.appendChild(btn("Put back",null,"",async()=>{
        for(const p of r.pids) if(reviewSkipped(p)) S.ov[p]=Object.assign({},S.ov[p],{noReview:false});
        persist(); render(); }));
    } else acts.appendChild(btn("Ask again",SVG.star,"",()=>askReview(myLine(r.pid))));
    w.appendChild(acts);
    return w;
  };
  const draw=()=>{
    host.innerHTML="";
    const q=S.rq.trim().toLowerCase();
    const list=q?all.filter(r=>(r.c.n+" "+(pOf(r.pid).l||"")+" "+(r.c.a||[]).join(" ")).toLowerCase().includes(q)):all;
    const todo=list.filter(r=>!r.asked&&!r.skip), done=list.filter(r=>r.asked||r.skip);
    const cap=150;
    section(host,"Not asked yet",todo.length,todo.slice(0,cap).map(row),
      todo.length?"":"Nobody left to ask"+(q?" with that search.":"."),["person","people"]);
    if(todo.length>cap) host.appendChild(el("div","note",`Showing the ${cap} most recent of ${todo.length}. Search to find anyone else.`));
    if(done.length) section(host,"Asked or skipped",done.length,done.slice(0,cap).map(row),null,["person","people"]);
  };
  sb.oninput=()=>{ S.rq=sb.value; draw(); };
  draw();
}

function viewSync(m){
  const last=(S.sync&&S.sync.lastSyncedDate)||S.settings.seedDataEnds;
  m.appendChild(el("div","sechead")).appendChild(el("h2",null,"Keeping it current"));
  m.appendChild(el("div","note","Your client list and job history come from your Xero invoices, "
    +"up to "+nice(last)+". This page can't reach Xero on its own, so ask Claude to refresh it "
    +"and it'll pull in everything you've invoiced since."));
  const box=el("div","copybox");
  box.appendChild(el("div","copyval","refresh my job book from Xero"));
  const cb=el("button","btn"); cb.innerHTML=ico(SVG.tick)+"<span>Copy</span>";
  cb.onclick=async()=>{ const ok=await copyText("refresh my job book from Xero");
    cb.querySelector("span").textContent=ok?"Copied":"Select it and copy";
    setTimeout(()=>{cb.querySelector("span").textContent="Copy";},2500); };
  box.appendChild(cb); m.appendChild(box);
  m.appendChild(el("div","hint","Say that to Claude and it updates the whole thing."));

  m.appendChild(el("div","lbl","Your changes on this device"));
  const mine=STORE.read();
  const nOv=Object.keys(mine.ov||{}).length, nBk=Object.keys(mine.bookings||{}).length;
  m.appendChild(el("div","note",nOv||nBk
    ? nOv+" propert"+(nOv===1?"y":"ies")+" changed and "+nBk+" booking"+(nBk===1?"":"s")
      +", saved on this device. Back it up if you want it on your other one."
    : "Nothing changed on this device yet. Anything you set gets saved here."));
  const row=el("div","btns");
  row.appendChild(btn("Back up my changes",SVG.note,"",()=>{
    const blob=new Blob([JSON.stringify(STORE.read(),null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="jobbook-backup-"+TODAY+".json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }));
  const imp=el("input"); imp.type="file"; imp.accept="application/json"; imp.hidden=true;
  imp.onchange=async()=>{ const f=imp.files&&imp.files[0]; if(!f) return;
    try{ const o=JSON.parse(await f.text());
      S.ov=o.ov||{}; S.bookings=o.bookings||{}; S.gone=o.gone||{};
      S.reviewLink=o.reviewLink||S.reviewLink; persist(); render();
      toast("Brought your changes across."); }
    catch(e){ toast("That file didn't read properly.",true); } };
  row.appendChild(btn("Restore a backup",null,"",()=>imp.click()));
  m.appendChild(row); m.appendChild(imp);

  m.appendChild(el("div","lbl","If something's not working"));
  const dbtn=el("button","btn"); dbtn.style.maxWidth="200px";
  dbtn.innerHTML=ico(SVG.note)+"<span>Run a check</span>";
  const dout=el("div"); dout.id="diagout";
  dbtn.onclick=async()=>{
    dout.innerHTML=""; const L=[];
    L.push("build "+BUILD);
    L.push("data: "+Object.keys(S.clients).length+" clients, "+Object.keys(S.props).length
      +" properties, "+S.due.length+" due rows, "+Object.keys(S.replies).length+" with replies");
    L.push("saving to this device: "+(STORE.write(STORE.read())?"works":"BLOCKED"));
    L.push("clipboard: "+((navigator.clipboard&&navigator.clipboard.writeText)?"available":"not available"));
    L.push("last error: "+(LASTERR?LASTERR.where+" - "+LASTERR.msg:"none"));
    const box=el("div","diag",L.join("\n")); dout.appendChild(box);
    const cb2=el("button","btn"); cb2.style.maxWidth="180px"; cb2.style.marginTop="8px";
    cb2.innerHTML=ico(SVG.tick)+"<span>Copy this</span>";
    cb2.onclick=async()=>{ const ok=await copyText(L.join("\n"));
      cb2.querySelector("span").textContent=ok?"Copied":"Select it and copy"; };
    dout.appendChild(cb2);
  };
  m.appendChild(dbtn); m.appendChild(dout);
}

/* ---------- wiring ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(!b) return;
  S.stack.length=0; drawSheet();
  S.view=b.dataset.go;
  if(b.dataset.band!==undefined) S.band=b.dataset.band;
  else if(b.dataset.go==="due") S.band="";
  window.scrollTo(0,0); render();
});
window.addEventListener("error",ev=>{ try{ toast("Something glitched: "+(ev.message||"unknown"),true); }catch(_){} });
loadAll().catch(()=>boot("Something went wrong","Reload the page and it should come good."));
})();
</script>
