/* =====================================================================
   DATA: fetch, realtime, refetch
   ===================================================================== */
function currentRange(){
  if(S.isMaster&&S.view==="week"){const ws=weekStart(S.date);return {from:ws,to:addDays(ws,6)};}
  return {from:S.date,to:S.date};
}
function setJobs(rows){S.jobs=rows||[];S.byId={};S.jobs.forEach(function(j){S.byId[j.id]=j;});}
async function fetchJobs(silent){
  if(S.screen!=="cal")return;
  if(S.pending>0){scheduleRefetch(500);return;}
  const seq=++S.fetchSeq,range=currentRange();
  if(!silent){S.loaded=false;renderBody();}
  try{
    const r=await colRetry(function(){
      let q=S.sb.from("jobs").select(jobCols()).gte("job_date",range.from).lte("job_date",range.to)
        .order("job_date",{ascending:true}).order("start_time",{ascending:true,nullsFirst:false});
      if(!S.isMaster)q=q.eq("staff_id",S.me.id);
      return q;
    });
    if(seq!==S.fetchSeq)return;
    if(r.error)throw r.error;
    const rows=r.data||[];
    // Master only: the prices of these jobs (and, on a refresh, the usual prices) come from their own tables and are merged into the jobs in memory. A worker never asks.
    if(S.isMaster){await Promise.all([attachPrices(rows),silent?loadUsualPrices():null]);if(seq!==S.fetchSeq)return;}
    setJobs(rows);S.range=range;S.loaded=true;S.loadErr="";
    renderBody();
  }catch(e){
    if(seq!==S.fetchSeq)return;
    S.loadErr=friendly(e)+(S.loaded?" Showing what was loaded earlier.":"");
    if(!S.loaded&&!S.jobs.length)S.loaded=false;
    renderBody();
  }
}
/* ----- prices (master only; a worker never calls any of this) ----- */
// Fills j._price, j._lines and j._pOk on each job in rows from job_prices: ONE query for the jobs in view (in chunks of 100 ids). A job with no row has no price entered.
// If the table is missing prices are switched off (noPriceTables). If the answer fails for another reason the jobs are marked j._pOk=false: they show blank prices, and
// savePrices won't write over what it couldn't read.
async function attachPrices(rows){
  rows.forEach(function(j){setJobPrices(j,null,[],true);});
  if(!S.isMaster||S.noPriceTbl||!rows.length)return;
  const byJob={},ids=rows.map(function(j){byJob[j.id]=j;return j.id;});
  try{
    for(let i=0;i<ids.length;i+=100){
      const r=await S.sb.from("job_prices").select("job_id,price,lines").in("job_id",ids.slice(i,i+100));
      if(r.error){
        if(missingTable(r.error,"job_prices")){noPriceTables();return;}
        throw r.error;
      }
      (r.data||[]).forEach(function(x){
        const j=byJob[x.job_id];
        if(j)setJobPrices(j,x.price==null?null:Number(x.price),Array.isArray(x.lines)?x.lines.filter(function(l){return l&&typeof l==="object";}):[],true);
      });
    }
    S.priceFailNoted=false;
  }catch(e){
    rows.forEach(function(j){j._pOk=false;});
    console.warn("Prices didn't load.",e);
    if(!S.priceFailNoted){S.priceFailNoted=true;toast("The prices didn't load, so they show blank for now. "+friendly(e),true);}
  }
}
// Each service's usual price from service_prices, put on the service types in memory as t._usual (a number, or null for none).
async function loadUsualPrices(){
  if(!S.isMaster||S.noPriceTbl)return;
  try{
    const r=await S.sb.from("service_prices").select("service_type_id,default_price");
    if(r.error){
      if(missingTable(r.error,"service_prices")){noPriceTables();return;}
      throw r.error;
    }
    const m={};(r.data||[]).forEach(function(x){m[x.service_type_id]=x.default_price==null?null:Number(x.default_price);});
    S.types.forEach(function(t){t._usual=Object.prototype.hasOwnProperty.call(m,t.id)?m[t.id]:null;});
    S.usualFail=false;
  }catch(e){S.usualFail=true;console.warn("The usual prices didn't load.",e);}
}
function scheduleRefetch(delay){clearTimeout(S.refetchT);S.refetchT=setTimeout(function(){fetchJobs(true);},delay==null?400:delay);}
function subscribe(){
  if(S.channel){try{S.sb.removeChannel(S.channel);}catch(e){}S.channel=null;}
  try{
    S.channel=S.sb.channel("lpc-calendar")
      .on("postgres_changes",{event:"*",schema:"public",table:"jobs"},function(){scheduleRefetch();})
      .on("postgres_changes",{event:"*",schema:"public",table:"job_photos"},function(){if(SH&&SH.jobId)loadPhotos();})
      .subscribe(function(status){S.live=status;updateLive();});
  }catch(e){S.live="";updateLive();}
  subscribePrices();
}
// Master only: a price changed on another device shows without waiting for the next refresh. A channel of its own, so that if the database doesn't send changes for
// these tables (or they aren't there yet) the calendar's own live updates are not affected: a channel that can't subscribe at all (the tables aren't sent) is dropped,
// quietly. A slow join or a dropped connection is left alone, like the jobs channel: supabase-js tries it again by itself.
function subscribePrices(){
  if(S.priceChan){try{S.sb.removeChannel(S.priceChan);}catch(e){}S.priceChan=null;}
  if(!S.isMaster||S.noPriceTbl)return;
  try{
    const ch=S.sb.channel("lpc-prices")
      .on("postgres_changes",{event:"*",schema:"public",table:"job_prices"},function(){scheduleRefetch();})
      .on("postgres_changes",{event:"*",schema:"public",table:"service_prices"},function(){scheduleRefetch();})
      .subscribe(function(status,err){
        if(status==="CHANNEL_ERROR"&&/unable to subscribe|mismatch between server and client|does not exist|not found|publication/i.test(String((err&&err.message)||err||""))){
          if(S.priceChan===ch){try{S.sb.removeChannel(ch);}catch(e){}S.priceChan=null;}
        }
      });
    S.priceChan=ch;
  }catch(e){S.priceChan=null;}
}
function updateLive(){
  // the Live tag (master) is in the top bar
  const on=S.live==="SUBSCRIBED";
  $$all(".live").forEach(function(l){
    l.className="live"+(on?" on":"");l.textContent=on?"Live":"Not live";
    l.title=on?"Changes from other people show up by themselves.":"Changes show up when you come back to this page.";
  });

function startPoll(){
  clearInterval(S.pollT);
  S.pollT=setInterval(function(){if(document.visibilityState==="visible"&&S.screen==="cal")scheduleRefetch(0);},120000);

function weekLabel(){const ws=weekStart(S.date),we=addDays(ws,5),y1=parseYmd(ws).getFullYear(),y2=parseYmd(we).getFullYear();return dayShort(ws)+(y1!==y2?" "+y1:"")+" to "+dayShort(we)+" "+y2;}

function renderBody(){

  S.dirtyRender=false;

  const old=byId("gw");const sl=old?old.scrollLeft:0,stp=old?old.scrollTop:0;
  const ot=$(".tray"),tst=ot?ot.scrollTop:0,tsl=ot?ot.scrollLeft:0;

    const want=fitPpm(gw);
    if(Math.abs(want-S.ppm)>0.002){S.ppm=want;cb.innerHTML=bodyHtml();gw=byId("gw");}
    sizeGrid(gw);
    if(S.scrollToWork&&S.loaded){S.scrollToWork=false;gw.scrollTop=workScroll();gw.scrollLeft=0;}
    else{gw.scrollLeft=sl;gw.scrollTop=stp;}

/* ---------- fitting the grid to the screen ----------
   Pixels per minute = the height left on the screen under the top bar, toolbar, Unassigned row and the grid's own header (names, No time yet),
   divided by the hours shown (7am to 5pm unless a job is outside that). Never under PPM_FLOOR: below that the grid scrolls inside its frame
   (the names stay put) instead of squashing the cards. Worked out again on every render, and on a resize or turning the phone. */
// The + button (master) floats 16px in from the bottom right and is 60px across. From 720px up the page does not scroll, so a grid that runs
// under it could never be uncovered: end that grid above it. (On a phone the page scrolls on past the grid, see body.is-master main, and the
// grid needs every pixel it can get, so it stays as it is.)
const FAB_ROOM=80;
// The height the calendar has to fit in: the window, less the booking bar docked at the foot of it (when it is open).
function viewH(){return window.innerHeight-(S.barH||0);}
function gapUnderGrid(gw){
  if(isNarrow())return 6;      // the .dayline padding under the grid
  if(!S.barH&&S.isMaster&&gw&&gw.getBoundingClientRect().right>(document.documentElement.clientWidth||window.innerWidth)-76)return FAB_ROOM;      // (the + is hidden while the bar is open)
  return 14;
}
function fitPpm(gw){
  const head=gw.querySelector(".gtop"),hh=head?head.offsetHeight:0;
  const top=gw.getBoundingClientRect().top+(window.pageYOffset||0);
  const bar=Math.max(0,gw.offsetHeight-gw.clientHeight-2);      // a sideways scroll bar (lots of people on a small screen)
  const span=Math.max(60,S.grid.ge-S.grid.gs);
  const room=viewH()-top-hh-bar-2-gapUnderGrid(gw);
  return Math.max(S.barH?PPM_FLOOR_BAR:PPM_FLOOR,Math.min(PPM_MAX,Math.floor(room/span*1000)/1000));
}
function sizeGrid(gw){
  const top=gw.getBoundingClientRect().top+(window.pageYOffset||0);
  const room=Math.max(S.barH?120:180,Math.floor(viewH()-top-gapUnderGrid(gw)));      // 180: a phone on its side still gets a usable frame (120 with the booking bar open: the frame must not run under it)
  gw.style.height="";
  // it fits: the frame is just as tall as the grid. The floor was hit: the frame fills the screen and the grid scrolls inside it.
  if(gw.offsetHeight>room+1)gw.style.height=room+"px";
  S.gridScrolls=!!gw.style.height;      // tick() only scrolls the grid up and down when there is something to scroll
  // the Unassigned list beside the day grid (computer) is no taller than the grid
  const tr=$(".dayline>.tray");
  if(tr){let side=false;try{side=!window.matchMedia("(max-width:900px)").matches&&!tr.classList.contains("row");}catch(e){}tr.style.maxHeight=side?Math.max(240,gw.offsetHeight)+"px":"";}
}
// Only used when the floor was hit and the grid scrolls: start it near the work (now, or the first job), not at the top.
function workScroll(){
  const g=S.grid;let t=WORK_START;
  if(S.view==="day"){
    const jobs=visibleJobs().filter(function(j){return j.job_date===S.date&&tmToMin(j.start_time)!=null;});
    if(S.date===todayYmd()){const n=new Date();t=n.getHours()*60+n.getMinutes()-60;}
    else if(jobs.length){t=Math.min.apply(null,jobs.map(function(j){return tmToMin(j.start_time);}))-30;}
  }else{
    const ws=weekStart(S.date),td=todayYmd();
    if(td>=ws&&td<=addDays(ws,6)){const n=new Date();t=n.getHours()*60+n.getMinutes()-60;}
  }
  return Math.max(0,(t-g.gs)*g.ppm);
}
function onWinResize(){
  if(S.screen!=="cal"||!S.isMaster)return;

/* ---------- day totals: "5 jobs · 7 h" (timed and no-time jobs, cancelled ones left out) ---------- */
function dayTot(list){
  let n=0,min=0;
  list.forEach(function(j){if(j.status==="cancelled")return;n++;min+=Math.max(0,+j.duration_min||0);});
  return {n:n,min:min};
}
function hrsTxt(min){return String(min%15===0?Math.round(min/15)/4:Math.round(min/6)/10);}      // 7, 7.5, 7.25 (a length off the quarter hours, like 1 hr 20, in tenths: 1.3)
// short: 0 = "5 jobs · 7 h", 1 (or true) = "5 · 7h", 2 = "5·7h" (a day column of the week on a phone)
function totTxt(t,short){
  if(!t.n)return "";
  if(short===2)return t.n+"·"+hrsTxt(t.min)+"h";
  return short?t.n+" · "+hrsTxt(t.min)+"h":t.n+(t.n===1?" job":" jobs")+" · "+hrsTxt(t.min)+" h";
}
function totHtml(list,short,who){
  const t=dayTot(list);if(!t.n)return "";
  return '<span class="tot" title="'+esc((who?who+": ":"")+totTxt(t,false))+'">'+esc(totTxt(t,short))+'</span>';
}

/* ---------- the time grid (day and week views share it) ---------- */
function isTimed(j){return tmToMin(j.start_time)!=null;}
// The hours shown: 7am to 5pm, stretched (to the hour) to take in any job that starts earlier or runs later.
function gridSpan(list){
  let gs=WORK_START,ge=WORK_END;
  list.forEach(function(j){
    const s=tmToMin(j.start_time);if(s==null)return;
    gs=Math.min(gs,Math.floor(s/60)*60);ge=Math.max(ge,Math.ceil((s+Math.max(+j.duration_min||0,SNAP))/60)*60);
  });
  return {gs:Math.max(0,gs),ge:Math.min(ge,24*60)};
}
// About how wide the grid's columns are in total (px), worked out from the window so the HTML can be built in one go.
function gridWidth(){
  const w=document.documentElement.clientWidth||window.innerWidth||1000,narrow=isNarrow();
  const side=(S.view!=="week"&&w>900)?242:0;      // the Unassigned list beside the day grid on a computer
  return Math.max(120,w-(narrow?16:28)-2-(narrow?36:46)-side);
}
function gutHtml(g,hpx){
  let labels="";
  for(let m=g.gs;m<g.ge;m+=60)labels+='<div class="hl" style="top:'+((m-g.gs)*g.ppm)+'px">'+esc(hourLabel(m))+'</div>';
  return '<div class="gut" style="height:'+hpx+'px">'+labels+'</div>';
}
function nowLineHtml(d,g){
  if(d!==todayYmd())return "";
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  return (m>=g.gs&&m<g.ge)?'<div class="now" style="top:'+((m-g.gs)*g.ppm)+'px"></div>':"";
}
// one person's timed jobs for one day, at their start time and as tall as they are long. Jobs that overlap sit side by side.
function laneCardsHtml(list,g,laneW){
  const items=list.filter(isTimed).map(function(j){
    const s=tmToMin(j.start_time),d=Math.max(+j.duration_min||0,1);
    return {j:j,s:s,d:d,e:s+Math.max(d,SNAP)};
  });
  lanes(items);
  return items.map(function(it){
    const top=(it.s-g.gs)*g.ppm,h=Math.max(it.d*g.ppm-2,16),w=100/it.lanes,gap=laneW/it.lanes<44?1:3;      // the tightest lanes keep every pixel
    return gridCardHtml(it.j,it.s,it.d,cardFit(h,laneW/it.lanes-gap),"top:"+top+"px;height:"+h+"px;left:"+(it.lane*w)+"%;width:calc("+w+"% - "+gap+"px)");
  }).join("");
}

/* ---------- day view ---------- */
function lanes(list){
  list.sort(function(a,b){return a.s-b.s||a.e-b.e;});
  let cluster=[],end=-1;
  function close(){let n=1;cluster.forEach(function(x){n=Math.max(n,x.lane+1);});cluster.forEach(function(x){x.lanes=n;});cluster=[];}
  list.forEach(function(it){
    if(cluster.length&&it.s>=end){close();end=-1;}
    const used=cluster.filter(function(c){return c.e>it.s;}).map(function(c){return c.lane;});
    let l=0;while(used.indexOf(l)>=0)l++;
    it.lane=l;cluster.push(it);end=Math.max(end,it.e);
  });
  if(cluster.length)close();
  return list;
}
// The "who to show" buttons (Both | Mitch | ...): the week view always, the day view on a phone. Two or more people only.

/* ---------- week view: a time grid, Mon to Sat (Sunday too if it has jobs or is the day picked), one lane per person ---------- */
function weekDays(){
  const ws=weekStart(S.date),days=[];
  for(let i=0;i<6;i++)days.push(addDays(ws,i));
  const sun=addDays(ws,6);
  if(S.date===sun||visibleJobs().some(function(j){return j.job_date===sun;}))days.push(sun);
  return days;
}

/* =====================================================================
   DRIVE TIMES BETWEEN JOBS
   For each person's day: their timed jobs that are not cancelled, in start order. For each pair in a row where both jobs have an address, how long
   the drive from the first to the second takes. The answers come from the Google Routes API (computeRoutes, on the same browser key as the address
   lookup), asked with the two ADDRESS TEXTS as they are saved on the jobs. Why it is built this way:
   - Google's terms only let us keep what its APIs give back for 30 days at most. So the page stores no map position anywhere (the database gets none),
     and every drive time is kept here and in localStorage with the time it was saved, then dropped after 30 days and asked for again.
   - The free public demo server of the Open Source Routing Machine project, which this used to ask, is not for business use, so it is not used at all any more.
   It is used gently: ONE request at a time, each at least DRIVE_GAP_MS after the one before, only for pairs that are on the screen, and every pair
   once (a pair that is saved is not asked again until it is 30 days old). Three failures in a row (no signal, an error on Google's side) stop it for
   two minutes. Google saying over quota (429) stops it for ten minutes. Google saying no (403: the Routes API isn't switched on for the key yet, or
   the key isn't allowed on this page) stops it for the rest of the session, quietly: one line in the browser's console, nothing on the screen.
   Where it shows: day and week grids, a small chip in the gap between the two cards (or, with no gap to sit in, on the first line of the
   second card, to the right of its time), or, when there is no room for a chip, a red bar on the card's top edge for a short gap and
   otherwise just the second card's tooltip; the technician's list, a line between the two cards.
   It goes red when the gap between the jobs is shorter than the drive. A job with no address, or a pair Google has no answer for, shows nothing at all:
   no guessing and no error messages. Three kinds of answer are treated as "no answer" and kept that way for a day (so they are not asked again on every
   page load): no route, an address Google can't find (400 or 404), and a route over 250 km or 4 hours (a street of that name in the wrong town or state;
   an address with no state or postcode also has ", NSW" added to what is sent, to stop most of those). An answer under 100 m means the two addresses are one
   place written two ways: nothing is drawn for it. The saved answers are wiped from the device on a log out (their keys are client addresses), and anything
   past its time is removed from localStorage when the page loads, not just from memory. "Google Maps" is credited in words under the drive times (driveCredit).
   The labels are put in AFTER the page has been drawn: renderBody only asks for them (driveSoon) and they are worked out on the next animation
   frame, all the reading first (card widths) and then all the writing (one fragment per column), so a redraw never pays for them. They are left
   alone while a card is being pressed or dragged. When an answer comes back only the pair(s) it belongs to get a label, nothing else is
   rebuilt. The calls to Google run on their own timer in the background.
   ===================================================================== */
const ROUTES_URL="https://routes.googleapis.com/directions/v2:computeRoutes";
const DRIVE_KEY="lpc_drive_v2",DRIVE_OLD_KEY="lpc_drive_v1";      // v1 held answers keyed by map positions and kept for 60 days: it is deleted the first time this runs
const DRIVE_CAP=500,DRIVE_KEEP_MS=30*24*3600*1000,DRIVE_GAP_MS=300;      // most answers kept, how long (Google's 30 days), and the least time between two requests
const DRIVE_NOANS_MS=24*3600*1000;      // a "Google has no answer for this pair" note is kept a day, then the pair is asked again
const DRIVE_SAME_M=100;      // an answer under 100 m means the two addresses are one place written two ways: no label, and no more asking
const DRIVE_MAX_M=250000,DRIVE_MAX_S=4*3600;      // an answer over 250 km or 4 hours is not believed (a street of that name in another state): it is kept as "no answer"
const D={mem:null,q:[],active:0,busy:{},want:{},fail:{},bad:0,pause:0,stop:false,warned:false,saveT:0,wakeT:0,rafT:0,fbT:0,next:0,pumpT:0,dirty:false,gen:0};      // gen: counts log-outs, so a request that was out at the time can't save its answer for the next person
// the address text a job's drive is worked out from: what is saved on the job, trimmed. Blank = no drive time to or from that job.
function driveAddr(j){return j?trim(j.address):"";}
// A pair's key: the two addresses tidied up (case, spaces, commas) and in order. A newline can't be in a tidied address, so two addresses can never run together into another pair's key.
function driveKey(a,b){return normAddr(a)+"\n"+normAddr(b);}
function driveNum(x){return typeof x==="number"&&isFinite(x);}
function driveFresh(t,now,keep){return t<=now+3600000&&now-t<keep;}      // saved less than `keep` ago (and not in the future: a clock that was wrong)
// A saved entry is {s: seconds, m: metres, t: when it was saved}. s and m of -1 (a "no answer" note) means Google had no usable answer for the pair.
function driveAlive(x,now){return driveFresh(x.t,now,x.s<0?DRIVE_NOANS_MS:DRIVE_KEEP_MS);}
// Does this entry give a label? Not for "no answer", and not for two addresses that turn out to be one place (Google puts both at one point and says about 0 m).
function driveShows(x){return x.s>=0&&x.m>=DRIVE_SAME_M;}
function driveLoad(){
  if(D.mem)return;
  D.mem=new Map();
  try{localStorage.removeItem(DRIVE_OLD_KEY);}catch(e){}
  let total=0,bad=false;
  try{
    const o=JSON.parse(localStorage.getItem(DRIVE_KEY)||"{}")||{},now=Date.now();
    Object.keys(o).forEach(function(k){
      total++;
      const v=o[k];
      if(Array.isArray(v)&&driveNum(v[0])&&driveNum(v[1])&&driveNum(v[2])&&((v[0]>=0&&v[1]>=0)||(v[0]===-1&&v[1]===-1))){
        const x={s:v[0],m:v[1],t:v[2]};
        if(driveAlive(x,now))D.mem.set(k,x);
      }
    });
  }catch(e){bad=true;}
  driveTrim();
  if(bad||D.mem.size!==total)driveSave();      // something was dropped (too old, junk, over the cap): it goes from the device too, not only from memory
}
function driveTrim(){
  const now=Date.now();
  D.mem.forEach(function(x,kk){if(!driveAlive(x,now))D.mem.delete(kk);});      // time is up: it is asked for again the next time it is on the screen
  while(D.mem.size>DRIVE_CAP){      // over the cap: the oldest answer goes
    let oldK=null,oldT=Infinity;
    D.mem.forEach(function(x,kk){if(x.t<oldT){oldT=x.t;oldK=kk;}});
    if(oldK==null)break;D.mem.delete(oldK);
  }
}
// a saved answer (or "no answer" note), or null if there is none or it is out of date (an old one is dropped on the spot, and from the device a moment later)
function driveGet(k){
  const x=D.mem.get(k);
  if(!x)return null;
  if(!driveAlive(x,Date.now())){D.mem.delete(k);driveSaveSoon();return null;}
  return x;
}
// the only writer of lpc_drive_v2
function driveSave(){
  clearTimeout(D.saveT);D.saveT=0;
  if(!D.mem)return;
  try{const o={};D.mem.forEach(function(x,kk){o[kk]=[x.s,x.m,x.t];});localStorage.setItem(DRIVE_KEY,JSON.stringify(o));}catch(e){}
}
function driveSaveSoon(){clearTimeout(D.saveT);D.saveT=setTimeout(driveSave,800);}
function driveStore(k,v){
  if(!D.mem)return;      // logged out while the request was out: the answer is thrown away, not saved
  D.mem.set(k,v);driveTrim();driveSaveSoon();
}
function driveNoAnswer(k){driveStore(k,{s:-1,m:-1,t:Date.now()});}
// Logged out (or the login ran out, or someone else logged in): the saved drive times go from this device. Their keys are client addresses.
function driveWipe(){
  clearTimeout(D.saveT);D.saveT=0;D.gen++;D.mem=null;D.fail={};
  try{localStorage.removeItem(DRIVE_KEY);localStorage.removeItem(DRIVE_OLD_KEY);}catch(e){}
}
// Start time, then length, then id: one fixed order for jobs that start together, used by the grid pairs and by the technician's list.
function driveOrder(a,b){
  const x=tmToMin(a.start_time),y=tmToMin(b.start_time);
  return ((x||0)-(y||0))||(Math.max(+a.duration_min||0,0)-Math.max(+b.duration_min||0,0))||(a.id<b.id?-1:a.id>b.id?1:0);

// The pairs for what is on the screen, read from the cards that were drawn (so it is always exactly what is showing, whoever is picked):

function drivePairs(){

  const groups=[];
  if(S.isMaster){
    cb.querySelectorAll(".col").forEach(function(col){groups.push({col:col,els:Array.prototype.slice.call(col.querySelectorAll(".jc[data-job]"))});});
  }else{
    groups.push({col:null,els:Array.prototype.slice.call(cb.querySelectorAll(".tcard"))});
  }

    const items=[];

    if(g.col)items.sort(function(x,y){return driveOrder(x.j,y.j);});

// Asks for the labels to be drawn, once, after the page has been drawn (renderBody calls this and does none of the work). They go in on the next

function driveSoon(){
  if(D.rafT||D.fbT)return;
  const run=function(){
    if(D.rafT){try{cancelAnimationFrame(D.rafT);}catch(e){}D.rafT=0;}
    clearTimeout(D.fbT);D.fbT=0;
    try{driveRefresh();}catch(e){}

  if("requestAnimationFrame" in window){try{D.rafT=requestAnimationFrame(run);}catch(e){D.rafT=0;}}
  D.fbT=setTimeout(run,250);

// Draws what is known, and asks for what isn't. Safe to run as often as you like: it clears its own labels first.
// Two steps, so the page is laid out once and not once per label: all the reading first (every card's width), then all the writing.
function driveRefresh(){
  const cb=byId("cb");if(!cb)return;
  if(S.dragging||S.pressing){D.dirty=true;return;}      // a card is being pressed or dragged: leave the page alone, the release picks this up
  D.dirty=false;
  driveLoad();
  const pairs=drivePairs(),now=Date.now(),todo=[];
  D.q=[];D.want={};
  // 1. reading (and working out what to ask Google for)
  pairs.forEach(function(p){
    const hit=driveGet(p.key);
    if(hit){      // known: drawn if it gives a label; a "no answer" note, or two addresses that are one place, draws nothing and is not asked again
      if(driveShows(hit)){const geo=p.col?driveGeom(p):null;todo.push({p:p,hit:hit,geo:geo,m:driveMeasure(p,geo)});}
      return;
    }
    const first=!D.want[p.key];D.want[p.key]=1;      // each pair once, however many times it is on the screen
    if(first&&!D.busy[p.key]&&!(D.fail[p.key]>now))D.q.push({k:p.key,a:p.aa,b:p.bb});
  });
  // 2. writing
  cb.querySelectorAll(".drv,.tdrv").forEach(function(n){if(n.parentNode)n.parentNode.removeChild(n);});
  driveWrite(todo);

// One answer has just come in: label the pair(s) it belongs to and touch nothing else.
function drivePatch(key){
  if(S.dragging||S.pressing){D.dirty=true;return;}
  const cb=byId("cb"),hit=D.mem&&driveGet(key);
  if(!cb||!hit||!driveShows(hit))return;
  const todo=[],ids={};
  drivePairs().forEach(function(p){
    if(p.key!==key)return;
    const geo=p.col?driveGeom(p):null;
    todo.push({p:p,hit:hit,geo:geo,m:driveMeasure(p,geo)});ids[p.b.j.id]=1;
  });
  if(!todo.length)return;

// The timer-driven queue: ONE request at a time, each starting at least DRIVE_GAP_MS after the one before it started. A finished request, a new
// queue (driveRefresh) or the wake-up after a pause sets it going, and it keeps itself going: it does not wait for the page to be redrawn.
function drivePump(){
  if(D.stop||D.active||D.pumpT||!D.q.length)return;
  if(!gKey()){D.q=[];return;}      // no key in lpc-config.js: nothing to ask with (the answers already saved still show)
  const now=Date.now();
  if(now<D.pause)return;      // paused (failures in a row, or over quota): the wake-up timer starts it again
  if(now<D.next){D.pumpT=setTimeout(function(){D.pumpT=0;drivePump();},D.next-now);return;}
  const it=D.q.shift();
  D.busy[it.k]=1;D.active++;D.next=now+DRIVE_GAP_MS;

// stop asking for ms; a timer wakes the queue up again afterwards
function drivePauseFor(ms){
  D.pause=Math.max(D.pause,Date.now()+ms);
  clearTimeout(D.wakeT);D.wakeT=setTimeout(function(){D.wakeT=0;driveSoon();drivePump();},Math.max(0,D.pause-Date.now())+1000);

// Google said no (403 or 401: the Routes API is switched off for the key, or the key isn't allowed on this page): no more asking until the page is loaded again.
// One line in the console, nothing on the screen.
function driveStopForGood(status,st,msg){
  D.stop=true;D.q=[];
  console.warn("Drive times are off until the page is reloaded: Google's Routes API said no ("+status+(st?" "+st:"")+"). Is the Routes API switched on for the key in lpc-config.js, and is this page's address allowed on it?"+(msg?" "+String(msg).slice(0,160):""));

// Google's length of time comes as text: "1926s", or with a fraction, "1926.4s". NaN for anything else.
function driveSecs(d){const m=/^(\d+(?:\.\d+)?)s$/.exec(String(d==null?"":d).trim());return m?+m[1]:NaN;}
// The text sent to Google for an address. One with no state and no postcode on the end (a site saved as just "10 Gloria st") gets ", NSW" added, so Google
// doesn't pick that street over the border. Only what is sent changes: the pair's key stays the address as it is saved.
function driveText(a){
  const t=trim(a);
  if(/\b(?:nsw|qld|vic|tas|act|new south wales|queensland|victoria|tasmania|australian capital territory|south australia|western australia|northern territory)\b/i.test(t)||/\b(?:SA|WA|NT)\b/.test(t)||/\b\d{4}\s*$/.test(t))return t;
  return t+", NSW";

async function driveFetch(it){
  let outage=false,got=false;const gen=D.gen;
  const ctl=("AbortController" in window)?new AbortController():null,to=setTimeout(function(){if(ctl){try{ctl.abort();}catch(e){}}},8000);
  try{
    const r=await fetch(ROUTES_URL,{method:"POST",signal:ctl?ctl.signal:undefined,
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":gKey(),"X-Goog-FieldMask":"routes.duration,routes.distanceMeters"},
      body:JSON.stringify({origin:{address:driveText(it.a)},destination:{address:driveText(it.b)},travelMode:"DRIVE",routingPreference:"TRAFFIC_UNAWARE",regionCode:"au",units:"METRIC"})});
    let j=null;try{j=await r.json();}catch(e){}
    if(gen!==D.gen)return;      // logged out while this was out: whatever came back is dropped
    const er=j&&j.error,st=String(er&&er.status||""),msg=String(er&&er.message||"");
    if(r.ok&&j){
      const rt=Array.isArray(j.routes)?j.routes[0]:null,secs=rt?driveSecs(rt.duration):NaN;
      const mt=rt?(rt.distanceMeters==null?0:Number(rt.distanceMeters)):NaN;      // Google leaves distanceMeters out when it is 0
      if(isFinite(secs)&&isFinite(mt)&&mt>=0&&secs<=DRIVE_MAX_S&&mt<=DRIVE_MAX_M){driveStore(it.k,{s:secs,m:mt,t:Date.now()});D.bad=0;got=true;}
      else driveNoAnswer(it.k);      // no route between these two addresses, or one too long to be believed (the wrong town): kept as "no answer" for a day, so it isn't asked again on every page load
    }
    else if(r.status===403||r.status===401||/PERMISSION_DENIED|UNAUTHENTICATED/.test(st)||/api key/i.test(msg))driveStopForGood(r.status,st,msg);
    else if(r.status===429||/RESOURCE_EXHAUSTED/.test(st))drivePauseFor(10*60000);      // over quota: nothing for ten minutes
    else if(r.status>=500||!j){outage=true;D.fail[it.k]=Date.now()+5*60000;}
    else{      // Google refused this one pair (an address it can't find, say): not an outage. A 400 or 404 is kept as "no answer" for a day; anything else is left alone for half an hour
      if(r.status===400||r.status===404)driveNoAnswer(it.k);else D.fail[it.k]=Date.now()+30*60000;

    }
  }catch(e){outage=true;D.fail[it.k]=Date.now()+5*60000;}
  finally{
    clearTimeout(to);
    // three failures in a row (no signal, or Google erroring): stop asking for two minutes
    if(outage&&++D.bad>=3)drivePauseFor(120000);
    D.active--;delete D.busy[it.k];
    if(got){try{drivePatch(it.k);}catch(e){}}
    drivePump();
  }
}
/* ----- the words ----- */
function driveKm(m){const k=m/1000;return (k>=100?Math.round(k):Math.round(k*10)/10)+" km";}
function driveShort(mins){return mins<60?mins+"m":Math.floor(mins/60)+"h"+(mins%60?pad(mins%60):"");}
function driveInfo(p,hit){
  const mins=Math.max(1,Math.round(hit.s/60));
  return {mins:mins,km:driveKm(hit.m),gap:p.gap,warn:p.gap<mins};      // red when there is less time than the drive
}
function driveGapTxt(gap){return gap<0?"jobs overlap":gap===0?"no gap":"only "+fmtDur(gap)+" gap";}
// "Drive ~18 min (14 km)", and when the gap is short ", only 10 min gap"
function driveLine(i){return "Drive ~"+fmtDur(i.mins)+" ("+i.km+")"+(i.warn?", "+driveGapTxt(i.gap):"");}
function driveTip(i){
  const g=driveGapTxt(i.gap);
  return "Drive ~"+fmtDur(i.mins)+" ("+i.km+") from the last job"+(i.warn?". "+g.charAt(0).toUpperCase()+g.slice(1)+".":"");
}
// the longest wording that fits in a chip w px wide (about 5.6px a letter at the chip's size, plus the car and the padding).
// A red chip keeps its gap wording down to a narrow phone card ("~32m, 30m gap"); only when even that won't fit does it fall back to the drive time alone.
function driveChipText(i,w){
  const m=fmtDur(i.mins),sh=driveShort(i.mins);
  let c;
  if(i.warn){
    const g0=driveGapTxt(i.gap),g1=i.gap>0?"only "+driveShort(i.gap)+" gap":i.gap===0?"no gap":"overlap",g2=i.gap>0?driveShort(i.gap)+" gap":g1;
    c=["Drive ~"+m+", "+g0,"~"+m+", "+g0,"~"+m+", "+g1,"~"+sh+", "+g1,"~"+sh+", "+g2,"~"+m,sh];
  }else c=["Drive ~"+m+" ("+i.km+")","~"+m,sh];
  c.sort(function(a,b){return b.length-a.length;});      // longest first, whatever the numbers turn out to be
  for(let k=0;k<c.length;k++)if(28+5.6*c[k].length<=w-4)return c[k];

// Where a pair's label goes on the grid, from the numbers alone (nothing is read from the page). The first card is drawn at least 16px tall
// (see laneCardsHtml), so its bottom is worked out from that, not from its end time. free = the blank space between the two cards.
function driveGeom(p){
  const g=S.grid,ppm=g.ppm,H=14;
  const aBot=(p.a.s-g.gs)*ppm+Math.max(Math.max(p.a.d,1)*ppm-2,16),topB=(p.b.s-g.gs)*ppm,free=topB-aBot;
  return {H:H,aBot:aBot,topB:topB,free:free,inGap:free>=H+4};

// The only reads from the page: the second card's width, and (when the chip has to go on the card itself) how much of its first line the time and tick use.
function driveMeasure(p,geo){
  const m={w:0,used:0};
  if(!p.col)return m;
  const b=p.b.el;m.w=b.offsetWidth;
  if(!geo.inGap){
    const l1=b.querySelector(".l1");
    if(l1)Array.prototype.forEach.call(l1.children,function(c){m.used+=c.offsetWidth+4;});
  }

// A pair's label as a node (or null for none). Writes the card's tooltip, reads nothing from the page.
function driveNode(p,hit,geo,m){
  const info=driveInfo(p,hit),b=p.b.el,id=p.b.j.id;
  if(!p.col){      // the technician's list: a line between the two cards
    const d=document.createElement("div");d.className="tdrv"+(info.warn?" warn":"");d.setAttribute("data-b",id);
    d.innerHTML=IC.car+'<span>'+esc(driveLine(info))+'</span>';
    return d;
  }
  // the grid: the tooltip always says it, and a chip goes between the cards if there is a gap, else on the second card's first line, if there is room
  const tip=jobTip(p.b.j)+". "+driveTip(info);
  b.setAttribute("title",tip);b.setAttribute("aria-label",tip);

  if(geo.inGap){
    txt=driveChipText(info,m.w);cls="gap";top=geo.aBot+(geo.free-geo.H)/2;
  }else{
    // No gap to sit in. The chip goes inside the second card, on its first line and to the right of its time (never over the first card's
    // bottom line). A one-line (tiny) card has its name there, and a card too narrow for time + chip has no room: those get the red bar or the tooltip.
    txt=b.classList.contains("tiny")?null:driveChipText(info,m.w-14-m.used);

    return d;

// Puts the labels in: one fragment per column for the grid (so one append each), a line before the card for the list.
function driveWrite(todo){
  const frags=new Map();

    const node=driveNode(t.p,t.hit,t.geo,t.m);if(!node)return;

// Google wants its name shown with what it gives back when there is no Google map. "Google Maps" in words, once on the page (the grid and the technician's list), only while a drive time is showing.
function driveCredit(on){

  if(old)return;

/* =====================================================================
   DRAG AND DROP (Pointer Events: mouse, pen and touch)
   ===================================================================== */
const DR={on:false,started:false,id:null,pid:null,sx:0,sy:0,lx:0,ly:0,offX:0,offY:0,w:0,h:0,card:null,ghost:null,mark:null,over:null,raf:0,zoneT:0,pageT:0,trayT:0,touch:false,armT:0,

const HOLD_MS=350;     // a finger has to rest on a card this long before it picks the job up; a quick swipe scrolls instead

function onDown(e){
  if(!S.isMaster||S.screen!=="cal"||(SH&&!SH.bar)||SV)return;      // (dragging and stretching keep working with the booking bar open)
  // A press that never got its release (the card was swapped out, or the browser lost the touch) must not block dragging for good.
  // The one case we leave alone is a second finger landing during a live drag.

    if(DR.started&&DR.card&&DR.card.isConnected&&e.pointerId!==DR.pid)return;

  }

  DR.on=true;DR.started=false;DR.id=job.id;DR.pid=e.pointerId;DR.mode=rz?"resize":"move";
  S.pressing=true;       // from now until release, a refetch must not rebuild the cards

function armResize(){

/* ----- stretching a job (master): the bottom edge follows the finger or mouse, snapped to 15 min, and the new end time shows as it goes.

  DR.card.classList.add("resizing");document.body.classList.add("isresize");

function tick(){

      // And only when the grid is taller than its frame (S.gridScrolls): a fitted grid has nothing to scroll, and a finger parked near the bottom must not walk the grid away from under it.
      if(S.gridScrolls){
        if(DR.ly>=r.top+hh&&DR.ly<r.top+hh+E)dy=-Math.min(18,Math.max(4,(r.top+hh+E-DR.ly)/3));
        else if(DR.ly>=r.top+hh&&DR.ly>r.bottom-E)dy=Math.min(18,Math.max(4,(DR.ly-(r.bottom-E))/3));
      }
      if(DR.mode!=="resize"){      // stretching only goes up and down

      if(DR.ly<r.top+E)dy=-Math.min(18,Math.max(4,(r.top+E-DR.ly)/3));

function applyDrop(id,t){

async function moveJob(j,patch,isUndo){
  const id=j.id,old={};

  if(!SH.svc.length&&SH.legacyPrice!=null&&!SH.legacyHeld&&(!m||trim(m.price)==="")){e.price=String(SH.legacyPrice);SH.legacyHeld=name;}

function onSvcTick(cb){
  const name=cb.getAttribute("data-svc"),i=SH.svc.findIndex(function(e){return e.type===name;});
  if(cb.checked&&i<0)SH.svc.push(newSvcEntry(name));
  else if(!cb.checked&&i>=0){
    const gone=SH.svc[i];
    // the old price was sitting on the service that just got unticked: take it back off (if it is still the untouched old price) so the next one can have it
    if(SH.legacyHeld===name){SH.legacyHeld="";if(trim(gone.price)===String(SH.legacyPrice))gone.price="";}
    SH.svcMemo[name]=gone;SH.svc.splice(i,1);
    if(SH.legacyPrice!=null&&!SH.legacyHeld&&SH.svc.length===1&&trim(SH.svc[0].price)===""){SH.svc[0].price=String(SH.legacyPrice);SH.legacyHeld=SH.svc[0].type;}      // one service left with no price: it is the only one now
  }
  const row=cb.closest(".svrow");if(row)row.classList.toggle("on",cb.checked);
  SH.svcTouched=true;

  autoLen();
}

// The How long list: 15 minute steps. A saved length that is not on them (80 min, 2 hr 05) goes in at its place in the list, the way setDur adds one, not at the end.
function durOptions(cur){
  cur=+cur||0;
  let h="",found=false;
  const opt=function(m){return '<option value="'+m+'"'+(m===cur?" selected":"")+'>'+esc(fmtDur(m))+'</option>';};
  for(let m=15;m<=720;m+=15){
    if(!found&&cur>0&&cur<m&&cur%15!==0){h+=opt(cur);found=true;}
    if(m===cur)found=true;
    h+=opt(m);
  }
  if(!found&&cur>0)h+=opt(cur);      // (longer than the list goes to)
  return h;
}

}

/* ----- closing ----- */
// force skips the "still saving" and "unsaved changes" checks. keepView (with force, from "More details") still puts the view back that the booking bar switched to Week.
function closeSheet(force,keepView){
  if(!SH)return true;
  // X, Escape and a tap on the backdrop all come through here. Closing in the middle of a save would leave it half done.
  if(!force&&SH.busy){showMsg("Still saving, hang on a sec.","warn");return false;}
  if(!force&&isDirty()&&!confirm("You have changes that are not saved. Close anyway?"))return false;
  clearTimeout(SH.sT);clearTimeout(SH.acT);if(SH.acAbort){try{SH.acAbort.abort();}catch(e){}}
  if(SH.bar){barClose(!!force,!!keepView);return true;}      // the booking bar: no backdrop, nothing to un-lock
  const pf=SH.prevFocus;
  SH=null;
  byId("sheet").innerHTML="";
  document.documentElement.classList.remove("sheet-open");
  const app=byId("app");app.removeAttribute("inert");app.removeAttribute("aria-hidden");
  if(S.dirtyRender)renderBody();
  if(pf&&pf.focus&&document.contains(pf)){try{pf.focus({preventScroll:true});}catch(e){}}
  return true;
}

/* ----- client name search (type-ahead) ----- */

function hideNameList(){const l=byId("f-name-list");if(l){l.hidden=true;l.innerHTML="";}if(SH){clearTimeout(SH.sT);SH.sSeq++;SH.nameResults=[];SH.nameMatch={};}}
function onNameInput(){
  const f=byId("f-name");if(!f)return;
  // A quick save is running (the cursor is already in the box for "Save + add another"): this typing is for the next caller. It must not unlink or search on the
  // booking being saved. quickReset keeps it when the save is done, and quickNameBack puts the old name back if the save fails.
  if(SH.quick&&SH.busy)return;
  // Typing in the name box does NOT unlink the client. Fixing a spelling keeps their phone, email and address, and the job address.
  // Switching to someone else is done by picking from the list, or with the "Different client" button.
  if(SH.quick&&SH.clientId&&SH.client&&trim(f.value)!==trim(SH.client.name))quickUnlink();      // the bar has no rename: typing again means someone else
  if(SH.renameTo!=null)SH.renameTo=trim(f.value);
  updateClientHint();
  clearTimeout(SH.sT);
  const q=trim(f.value);
  if(q.length<2){hideNameList();return;}
  SH.sT=setTimeout(function(){searchClients(q);},250);

async function searchClients(q){
  const sh=SH;if(!sh||(sh.quick&&sh.busy))return;      // a quick save is running: a client picked now would be lost when the panel resets
  const seq=++sh.sSeq;
  try{
    const words=q.split(/\s+/).filter(Boolean).slice(0,4);
    const digits=q.replace(/\D/g,"");
    let addrAt=-1;
    // built in a function so it can be built again if the database turns out not to have clients.notes yet
    const build=function(){
      const cc=clientCols();
      let nq=S.sb.from("clients").select(cc);
      words.forEach(function(w){nq=nq.ilike("name","%"+escLike(w)+"%");});
      nq=nq.order("name",{ascending:true}).limit(8);
      const jobs=[nq];
      if(digits.length>=3){
        // phones from the Xero seed are plain digits, so a straight match works for them
        jobs.push(S.sb.from("clients").select(cc).ilike("phone","%"+digits+"%").order("name",{ascending:true}).limit(8));
        // phones typed in by hand may have spaces in them, so also try a looser pattern and keep only true digit matches
        if(digits.length>=6)jobs.push(S.sb.from("clients").select(cc).ilike("phone","%"+digits.split("").join("%")+"%").order("name",{ascending:true}).limit(100));
      }
      // also match the text of a job site address ("296 tyag", "paterson"), unless what was typed is clearly a phone number
      addrAt=-1;
      if(q.length>=3&&!(digits.length>=6&&/^[\d\s()+.-]+$/.test(q))){
        let aq=S.sb.from("client_properties").select("address,client:clients("+cc+")");
        words.forEach(function(w){aq=aq.ilike("address","%"+escLike(w)+"%");});
        addrAt=jobs.length;
        jobs.push(aq.order("job_count",{ascending:false}).limit(12));
      }
      return jobs;
    };
    let res=await Promise.all(build());
    if(res.some(function(r){return r.error&&noteMissing(r.error);}))res=await Promise.all(build());
    if(SH!==sh||seq!==sh.sSeq||(sh.quick&&sh.busy))return;      // a different sheet, or the list was hidden or a newer search started (or a quick save began meanwhile)
    const seen={},prim=[],sec=[],match={};
    res.forEach(function(r,i){
      if(r.error)return;       // e.g. the sites table isn't set up yet: the name and phone matches still show
      (r.data||[]).forEach(function(row){
        if(i===addrAt){
          const c=Array.isArray(row.client)?row.client[0]:row.client;
          if(!c||!c.id||seen[c.id]||isPlaceholderAddr(row.address))return;
          seen[c.id]=1;match[c.id]=trim(row.address);sec.push(c);return;
        }
        if(i===2&&String(row.phone||"").replace(/\D/g,"").indexOf(digits)<0)return;
        if(!seen[row.id]){seen[row.id]=1;prim.push(row);}
      });
    });
    // name and phone matches first, but keep a few places for address matches so a street typed in isn't crowded out
    const room=Math.min(sec.length,3);
    showNameList(prim.slice(0,8-room).concat(sec).slice(0,8),match);
  }catch(e){if(SH===sh&&seq===sh.sSeq)hideNameList();}
}
function showNameList(list,match){
  const l=byId("f-name-list");if(!l||!SH)return;
  SH.nameResults=list;SH.nameMatch=match||{};
  if(!list.length){l.hidden=true;l.innerHTML="";return;}
  l.innerHTML=list.map(function(c,i){
    const sub=(SH.nameMatch[c.id]?["Site: "+SH.nameMatch[c.id],c.phone]:[c.suburb,c.phone]).filter(Boolean).join(" · ");
    return '<button type="button" class="acitem" role="option" data-sh="pickclient" data-i="'+i+'"><b>'+esc(c.name)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':"")+'</button>';
  }).join("");
  l.hidden=false;
}
// prefer = the site address the search matched on, so that site is the one filled in
function applyClient(c,blankOnly,prefer){
  SH.clientId=c.id;SH.client=Object.assign({},c);
  SH.unlinked=null;SH.renameTo=null;       // picking a client settles who this job is for
  // A client picked from the list: their saved notes (if any) show in the strip. The existing client picked at Save (blankOnly) keeps a note that was just typed
  // on this sheet: it stays in the box, with their saved notes above it if they have some, so nothing is lost and it can be tidied before saving again.
  const ta=byId("f-cnotes"),typed=(blankOnly&&SH.cnTouched&&ta)?trim(ta.value):"";
  if(typed){
    const saved=trim(c.notes);
    if(saved&&typed.indexOf(saved)<0)ta.value=saved.indexOf(typed)>=0?saved:saved+"\n"+typed;
  }else{SH.cnTouched=false;SH.cnOpen=false;}
  const set=function(id,v){const e=byId(id);if(!e)return;if(blankOnly&&trim(e.value))return;e.value=v==null?"":v;};
  if(S.isMaster)setVal("f-name",c.name);
  set("f-phone",c.phone);set("f-email",c.email);set("f-street",c.street);set("f-suburb",c.suburb);set("f-state",c.state);set("f-postcode",c.postcode);
  SH.preferAddr=prefer||"";
  SH.sites=[];SH.sitesFor=null;SH.sitesOk=false;renderSites();      // the last client's sites don't belong to this one
  hideNameList();updateClientHint();updateLinks();
  loadSites(SH,c.id);       // fills the job address from their sites (or their own address) if the box is empty
}
// Only the "Different client" button calls this. It blanks the boxes that still hold the old client's details, but keeps a copy so
// "Same client, just fixing the spelling" can put them back.
function unlinkClient(){
  const old=SH.client||{};
  const map={"f-phone":"phone","f-email":"email","f-street":"street","f-suburb":"suburb","f-state":"state","f-postcode":"postcode","f-cnotes":"notes"};
  const vals={};
  Object.keys(map).forEach(function(id){if(trim(val(id))===trim(old[map[id]])){vals[id]=val(id);setVal(id,"");}});
  // the job address stays, unless it was only ever filled in from this client's details and nobody has touched it
  const oldAddr=composeAddr(old.street,old.suburb,old.state,old.postcode),cur=trim(val("f-addr"));
  if(!SH.addrTouched&&cur&&(cur===oldAddr||cur===SH.addrAuto)){vals["f-addr"]=val("f-addr");setVal("f-addr","");SH.addrAuto="";}
  SH.unlinked=SH.client?{client:Object.assign({},SH.client),vals:vals}:null;
  SH.renameTo=null;
  SH.clientId=null;SH.client=null;
  SH.sites=[];SH.sitesFor=null;SH.sitesOk=false;SH.sitesSeq++;SH.preferAddr="";renderSites();
  updateLinks();
}
function diffClient(){
  if(!SH||!SH.clientId)return;
  unlinkClient();
  updateClientHint();
  const n=byId("f-name");if(n){try{n.focus();n.select();}catch(e){}}
}
// "Same client, just fixing the spelling": put the old client and their details back. What is typed in the name box becomes the new name.
function sameClient(){
  const u=SH&&SH.unlinked;if(!u)return;
  Object.keys(u.vals).forEach(function(id){if(!trim(val(id)))setVal(id,u.vals[id]);});     // never overwrite something typed since
  SH.clientId=u.client.id;SH.client=Object.assign({},u.client);
  SH.renameTo=trim(val("f-name"));SH.unlinked=null;
  hideNameList();updateClientHint();updateLinks();
  loadSites(SH,SH.clientId);
}
function updateClientHint(){
  if(SH&&SH.quick){quickSync();return;}
  renderCNotes();
  const h=byId("f-name-hint");if(!h||!SH)return;
  const nm=trim(val("f-name"));
  if(SH.clientId){
    const renaming=!!(SH.client&&nm&&nm!==trim(SH.client.name));
    h.className="hint "+(renaming?"new":"ok");
    h.innerHTML=esc(renaming?"Renaming this client (save to apply). Changes to their phone, email, address and notes are saved to their record too."
      :"Existing client ("+SH.clientId+"). Changes to their phone, email, address and notes are saved to their record.")+
      ' <button type="button" class="linkbtn" data-sh="diffclient">Different client</button>';
  }else if(nm){

    h.innerHTML=esc("New client. They get added to your client list when you save.")+
      (SH.unlinked?' <button type="button" class="linkbtn" data-sh="sameclient">Same client, just fixing the spelling</button>':"");
  }else{h.className="hint";h.textContent="";}

/* ----- a client's job sites -----
   client_properties holds the places a client has had work done (seeded from Xero, plus any added here). Picking a client, or opening
   one of their jobs, loads them: one site fills an empty job address, several show up as chips to tap. Their own contact address
   counts as a site too (last in the list) if it isn't already one. */
function normAddr(s){return String(s==null?"":s).toLowerCase().replace(/\s*,\s*/g,", ").replace(/\s+/g," ").trim();}
function isPlaceholderAddr(a){const t=trim(a);return !t||/^\(.*\)$/.test(t);}      // the Xero seed has "(address unknown)" rows
function siteLine(s){return composeAddr(s.address,s.suburb,s.state,s.postcode);}
// "111 Paterson St, Byron Bay NSW 2481" -> street, suburb, state, postcode. Only splits when the tail has a state or a postcode, else it is all street.
function splitAddr(line){
  const a=trim(line);
  const m=/^(.+),\s*([^,\d]+?)(?:\s+(NSW|VIC|QLD|SA|WA|TAS|NT|ACT))?(?:\s+(\d{4}))?$/i.exec(a);
  if(m&&(m[3]||m[4]))return {street:trim(m[1]),suburb:trim(m[2]),state:m[3]?m[3].toUpperCase():"",postcode:m[4]||""};
  return {street:a,suburb:"",state:"",postcode:""};
}
function siteSlug(a){return String(a).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24)||"site";}
// No map position (lat/lng) is stored on a job or a site any more: Google's terms only let us keep what its APIs give back for 30 days, so the page
// stores none of it (the lat/lng columns from 05_locations.sql are simply left alone). The one thing kept from Google is a site's place_id, which its terms
// allow to be stored indefinitely. If the database doesn't have that column yet, say nothing: the insert is repeated without it and it is left alone for the session.
function missingPlaceId(e){
  if(!e)return false;
  const m=String(e.message||"")+" "+String(e.details||"")+" "+String(e.hint||"");
  return (e.code==="PGRST204"||e.code==="42703"||/could not find the .*column|column .*does not exist/i.test(m))&&/\bplace_id\b/.test(m);
}
async function fetchSites(clientId,client){
  let rows=null;
  try{
    const r=await S.sb.from("client_properties").select("id,address,suburb,state,postcode,job_count,source").eq("client_id",clientId)
      .order("job_count",{ascending:false}).order("address",{ascending:true});
    if(r.error)throw r.error;
    rows=r.data||[];
  }catch(e){console.warn("Couldn't load this client's job sites.",e);}
  const seen={},list=[];
  (rows||[]).forEach(function(r){
    if(isPlaceholderAddr(r.address))return;
    const k=normAddr(r.address);if(seen[k])return;
    seen[k]=1;seen[normAddr(composeAddr(r.address,r.suburb,r.state,r.postcode))]=1;
    list.push({id:r.id,address:trim(r.address),suburb:trim(r.suburb),state:trim(r.state),postcode:trim(r.postcode),source:r.source});
  });
  const c=client||{};
  if(trim(c.street)&&!seen[normAddr(c.street)])
    list.push({id:null,address:trim(c.street),suburb:trim(c.suburb),state:trim(c.state),postcode:trim(c.postcode),source:"contact"});
  return {list:list,ok:rows!==null};
}
async function loadSites(sh,clientId){
  if(!sh||!clientId)return;
  const seq=++sh.sitesSeq;
  const res=await fetchSites(clientId,sh.client);
  if(SH!==sh||seq!==sh.sitesSeq||sh.clientId!==clientId)return;      // another client was picked, or the sheet was closed
  sh.sites=res.list;sh.sitesFor=clientId;sh.sitesOk=res.ok;
  renderSites();
  applySitePrefill(sh);
}
// the job address box counts as empty if it is blank, or was only ever filled in by this page (an earlier client's site)
function addrBoxEmpty(){return !trim(val("f-addr"))||!SH.addrTouched;}
function applySitePrefill(sh){
  if(SH!==sh||!addrBoxEmpty())return;
  const list=sh.sites;
  let line="";
  if(list.length){
    let pick=list[0];
    if(sh.preferAddr){const k=normAddr(sh.preferAddr);pick=list.filter(function(x){return normAddr(x.address)===k||normAddr(siteLine(x))===k;})[0]||pick;}
    line=siteLine(pick);
  }else if(sh.client){line=composeAddr(sh.client.street,sh.client.suburb,sh.client.state,sh.client.postcode);}     // no street on file: their suburb, as before
  if(!line){
    // nothing to fill in for this client: an earlier client's site that was only auto-filled doesn't stay in the box (not if their sites failed to load: then we don't know)
    if(sh.sitesOk&&trim(val("f-addr"))&&!sh.addrTouched){
      const dirty=isDirty();
      setVal("f-addr","");sh.addrAuto="";
      if(!dirty)sh.baseline=snap();
      updateLinks();renderSites();
    }
    return;
  }
  if(normAddr(val("f-addr"))===normAddr(line))return;
  const wasDirty=isDirty();
  setVal("f-addr",line);sh.addrTouched=false;sh.addrAuto=line;
  if(!wasDirty)sh.baseline=snap();       // filling it in isn't a change the person made, so closing the job shouldn't ask about it
  updateLinks();renderSites();
}
function renderSites(){
  const el=byId("f-addr-sites");if(!el||!SH)return;
  if(SH.quick)quickSync();      // booking bar: the sites have just loaded (or been cleared), so its summary can stop saying it is still looking
  const list=SH.sites||[];
  if(list.length<2){el.hidden=true;el.innerHTML="";return;}
  const cur=normAddr(val("f-addr"));
  el.innerHTML='<span class="sitelbl">Their sites:</span>'+list.map(function(s,i){
    const line=siteLine(s),on=!!cur&&(cur===normAddr(line)||cur===normAddr(s.address));
    return '<button type="button" class="chip'+(on?" on":"")+'" data-sh="picksite" data-i="'+i+'" aria-pressed="'+(on?"true":"false")+'">'+esc(line)+'</button>';
  }).join("");
  el.hidden=false;
}
function pickSite(i){
  const s=SH.sites[i];if(!s)return;
  setVal("f-addr",siteLine(s));SH.addrTouched=true;SH.addrAuto="";SH.addrPick=null;SH.pickSeq++;
  hideAddrList();updateLinks();renderSites();
}
// A real site has a street number in it (12 Smith St, 3/45 Smith St, Lot 4 Smith Rd). A suburb on its own ("Bangalow", "Byron Bay NSW 2481") isn't one.
function hasStreetNumber(street){
  const s=trim(street).replace(/\b(?:NSW|VIC|QLD|SA|WA|TAS|NT|ACT)\b/gi," ").replace(/\s\d{4}\s*$/,"");
  return /\d/.test(s);
}
// On save: if the job's address isn't one of the client's saved sites, add it as one. The caller catches any failure, so the job save never fails over this.
async function saveNewSite(sh,clientId,addr){
  const line=trim(addr);
  if(!clientId||!line||isPlaceholderAddr(line))return;
  const pick=sh.addrPick&&normAddr(sh.addrPick.line)===normAddr(line)?sh.addrPick:null;
  const parts=pick||splitAddr(line);
  if(!hasStreetNumber(parts.street))return;       // just a suburb (the contact-box fallback) or just a road (a lookup pick with no house number): the job keeps it, but it isn't a place to go back to
  let sites=sh.sites;
  if(sh.sitesFor!==clientId||!sh.sitesOk){
    const r=await fetchSites(clientId,sh.client);
    if(!r.ok)throw new Error("couldn't read this client's sites");
    sites=r.list;
  }
  const fullKey=normAddr(line),streetKey=normAddr(parts.street),subKey=normAddr(parts.suburb);
  const savedRows=function(list){return list.filter(function(x){return x.id;});};       // saved rows only: their contact address showing in the chips doesn't count as saved
  // A site is "already there" when the whole address matches, or the street matches and the suburb doesn't say otherwise (either one blank, or the same).
  // The street alone is not enough: "5 Main St, Bangalow" and "5 Main St, Lennox Head" are two places.
  const sameSite=function(x){
    const xl=normAddr(siteLine(x)),xa=normAddr(x.address);
    if(xl===fullKey||xa===fullKey)return true;
    if(xa!==streetKey&&xl!==streetKey)return false;
    const xs=normAddr(x.suburb);
    return !xs||!subKey||xs===subKey;
  };
  const findThere=function(rows){return rows.filter(sameSite)[0]||null;};
  // Google's place id for the lookup pick (a typed address has none). Place ids may be kept; map positions may not, so none are stored.
  const placeId=(pick&&pick.placeId&&!S.noPlaceId)?pick.placeId:null;
  let real=savedRows(sites);
  if(findThere(real))return;
  const base=clientId+"::"+siteSlug(parts.street),taken={};
  real.forEach(function(x){taken[x.id]=1;});
  let id=base,n=1;
  for(let attempt=0;attempt<8;attempt++){
    while(taken[id]){n++;id=base+"-"+n;}
    const row={id:id,client_id:clientId,address:parts.street,suburb:nn(parts.suburb),state:nn(parts.state),postcode:nn(parts.postcode),source:"calendar"};
    if(placeId)row.place_id=placeId;
    let ins=await S.sb.from("client_properties").insert(row);
    if(ins.error&&row.place_id&&missingPlaceId(ins.error)){S.noPlaceId=true;delete row.place_id;ins=await S.sb.from("client_properties").insert(row);}      // the place_id column isn't there yet: save the site without it
    if(!ins.error){
      sh.sites=real.concat([{id:id,address:row.address,suburb:trim(row.suburb),state:trim(row.state),postcode:trim(row.postcode),source:"calendar"}]);
      sh.sitesFor=clientId;sh.sitesOk=true;
      if(SH===sh)renderSites();
      return;
    }
    if(ins.error.code!=="23505")throw ins.error;
    // That id is already used. Usually that is this same address, added from another device since this list loaded, so look again before
    // trying -2, -3 ... (otherwise the same address gets saved twice).
    taken[id]=1;
    const fresh=await fetchSites(clientId,sh.client);
    if(!fresh.ok)throw new Error("couldn't read this client's sites");
    sh.sites=fresh.list;sh.sitesFor=clientId;sh.sitesOk=true;
    real=savedRows(fresh.list);
    if(SH===sh)renderSites();
    if(findThere(real))return;
    real.forEach(function(x){taken[x.id]=1;});
  }
  throw new Error("no free id for the new site");
}

/* ----- job address lookup (Google Places) -----
   Nothing goes out until 250ms after typing stops (and 4+ characters), a newer search cancels an older one, answers are remembered for the
   session, and a late answer never touches the box: results only go into the pick-list, and the box only changes when someone taps one.
   Google gives house numbers (including rural ones), so the list shows what Google says, minus ", Australia".
   One session token goes with every lookup of one address and with the one "details" call that ends it (that is how Google bills it),
   then the next address gets a new token. Tapping a suggestion asks Google for the details (street, suburb, state and postcode, and the place id).
   The place's map position is NOT asked for: Google's terms only let us keep it for 30 days, and nothing here needs it (drive times work from the
   address text, see DRIVE TIMES). If the details call fails, the suggestion's own text goes in and the job is saved with that.
   No key, or Google saying no (403, or over its quota): say so once in the hint and stop asking. Typing the address in always works. */
const ADDR_DOWN="Address lookup unavailable, type it in.";
function addrHint(t){const h=byId("f-addr-hint");if(h)h.textContent=t||"";}
// Hiding the list also cancels a lookup that is waiting or on its way, so every caller gets that.
function hideAddrList(){
  const l=byId("f-addr-list");if(l){l.hidden=true;l.innerHTML="";}
  addrHint("");
  if(SH){clearTimeout(SH.acT);if(SH.acAbort){try{SH.acAbort.abort();}catch(e){}SH.acAbort=null;}SH.acSeq++;SH.acResults=[];}
}
function gKey(){const c=window.LPC_SUPABASE||{};return trim(c.googleKey);}
function gBlocked(){return !gKey()||Date.now()<S.gBlockUntil;}
// A failed Google answer: 403 (key not allowed here, API off) stops lookups for the rest of the session, 429 / over quota for a minute.
async function gFail(r){
  let st="";
  try{const j=await r.json();st=String(j&&j.error&&j.error.status||"");}catch(e){}
  if(r.status===403||r.status===401||/PERMISSION_DENIED|REQUEST_DENIED|UNAUTHENTICATED/i.test(st))S.gBlockUntil=Infinity;
  else if(r.status===429||/RESOURCE_EXHAUSTED|OVER_QUERY_LIMIT/i.test(st))S.gBlockUntil=Date.now()+60000;
}
function onAddrInput(){
  SH.addrTouched=true;SH.addrAuto="";SH.addrPick=null;SH.pickSeq++;
  // The booking bar has no street, suburb ... boxes to see or fix for a NEW client. They only ever hold the lookup pick for this address, so they go as soon as the text is changed
  // (otherwise a cleared or corrected address comes back from them on save).
  if(SH.quick&&!SH.clientId)["f-street","f-suburb","f-state","f-postcode"].forEach(function(id){setVal(id,"");});
  hideAddrList();       // whatever was showing belongs to the old text
  renderSites();
  const q=trim(val("f-addr"));
  if(q.length<ADDR_MIN)return;
  const sh=SH;
  sh.acT=setTimeout(function(){if(SH===sh)addrLookup(q);},ADDR_WAIT);
}
// Enter: search now instead of waiting
function findAddr(){
  if(!SH)return;
  const q=trim(val("f-addr"));
  clearTimeout(SH.acT);
  if(q.length<ADDR_MIN){addrHint("Type a bit more of the address.");return;}
  addrLookup(q);
}
function stateAbbr(st){
  const t=trim(st);if(!t)return "";
  if(STATE_ABBR[t])return STATE_ABBR[t];
  return /^(NSW|VIC|QLD|SA|WA|TAS|NT|ACT)$/i.test(t)?t.toUpperCase():t;
}
// one suggestion from Google -> {id, line}, or null if it has no place or no text
function gPred(s){
  const p=s&&s.placePrediction;if(!p)return null;
  const id=trim(p.placeId)||trim(String(p.place||"").replace(/^places\//,""));
  const t=trim(p.text&&p.text.text);
  if(!id||!t)return null;
  return {id:id,line:trim(t.replace(/,\s*Australia$/i,""))};
}
async function addrLookup(q){
  const sh=SH;if(!sh)return;
  const key=normAddr(q);
  if(key.length<ADDR_MIN){addrHint("Type a bit more of the address.");return;}
  if(sh.acAbort){try{sh.acAbort.abort();}catch(e){}sh.acAbort=null;}
  const seq=++sh.acSeq;
  const hit=S.addrCache.get(key);
  if(hit){showAddrList(hit);return;}
  if(gBlocked()){addrHint(ADDR_DOWN);return;}       // no key, or Google has said no: don't ask again
  const ctl=("AbortController" in window)?new AbortController():null;sh.acAbort=ctl;
  if(!sh.gTok)sh.gTok=uuid();
  addrHint("Looking...");
  try{
    const r=await fetch(G_AUTO,{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":gKey()},signal:ctl?ctl.signal:undefined,
      body:JSON.stringify({input:q,sessionToken:sh.gTok,includedRegionCodes:["au"],includedPrimaryTypes:["street_address","premise","subpremise","route"],
        locationBias:{circle:{center:{latitude:G_LAT,longitude:G_LNG},radius:G_RADIUS}}})});
    if(!r.ok){await gFail(r);throw plainErr("Address lookup answered with an error.");}
    const data=await r.json();
    if(!data||typeof data!=="object")throw plainErr("Address lookup answered with something odd.");
    const seen={},preds=[];
    (data.suggestions||[]).forEach(function(s){const p=gPred(s);if(!p)return;const k=p.line.toLowerCase();if(seen[k])return;seen[k]=1;preds.push(p);});
    S.addrCache.set(key,preds);
    if(S.addrCache.size>80)S.addrCache.delete(S.addrCache.keys().next().value);
    if(SH!==sh||seq!==sh.acSeq)return;       // the sheet changed, or newer typing / a pick / a blur has cancelled this
    if(trim(val("f-addr"))!==q)return;       // the text has moved on since this was asked
    showAddrList(preds);
  }catch(e){
    if(SH!==sh||seq!==sh.acSeq)return;
    if(e&&e.name==="AbortError")return;
    addrHint(ADDR_DOWN);
  }
}
function showAddrList(preds){
  const l=byId("f-addr-list");if(!l||!SH)return;
  SH.acResults=preds.slice(0,8);
  if(!SH.acResults.length){l.hidden=true;l.innerHTML="";addrHint("No match found. Type it in.");return;}
  addrHint("");

    '<div class="acpow" role="presentation">Address suggestions: Google Maps</div>';      // Google's name with its suggestions (no Google map here)

}
// What Google's place details say, as {street, suburb, state, postcode, line, placeId}.
// Street is "<number> <road>" with the unit in front ("5/296 Tyagarah Rd") when there is one. Google sometimes knows only the road for
// a numbered rural address (it answers with the road, no number): then the number that was in the suggestion is kept, and placeId is
// left empty, because the place Google has is the road, not the house. Only the place id is kept from Google's answer (its terms allow
// place ids to be stored for good); the map position is not even asked for (see the lookup notes above).
function placeParts(d,pred){
  if(!d||!Array.isArray(d.addressComponents))return null;
  const comps=d.addressComponents;
  const get=function(types,short){
    for(let k=0;k<types.length;k++){
      const c=comps.filter(function(x){return x&&Array.isArray(x.types)&&x.types.indexOf(types[k])>=0;})[0];
      if(c){const v=trim(short?(c.shortText||c.longText):(c.longText||c.shortText));if(v)return v;}
    }
    return "";
  };
  const num=get(["street_number"]),sub=get(["subpremise"]),route=get(["route"],true);
  const seg=trim(String(pred.line).split(",")[0]);
  let street;
  if(num&&route)street=(sub?sub+"/":"")+num+" "+route;
  else if(/\d/.test(seg))street=seg;
  else street=route||seg;
  const suburb=get(["locality","sublocality_level_1","sublocality","postal_town"]);
  const state=stateAbbr(get(["administrative_area_level_1"],true)),pc=get(["postal_code"]);
  return {street:street,suburb:suburb,state:state,postcode:pc,line:composeAddr(street,suburb,state,pc),placeId:(num||sub)?pred.id:null};
}
// Tapping a suggestion: its text goes in the box straight away, then Google's details replace it (if the box still shows that text) with the proper
// street / suburb / state / postcode, and the place id is kept for a new client site. sh.addrPending is that call; a save waits for it (so the client's
// street, suburb ... boxes and the new site get the proper details, not just the suggestion's text).
function pickAddr(i){
  const sh=SH,p=sh&&sh.acResults[i];if(!p)return;
  const seq=++sh.pickSeq;
  setVal("f-addr",p.line);sh.addrTouched=true;sh.addrAuto="";sh.addrPick=null;
  hideAddrList();updateLinks();renderSites();
  const shown=trim(val("f-addr"));
  const done=function(){if(sh.addrPending===pr)sh.addrPending=null;};
  const pr=pickDetails(sh,p,seq,shown).then(done,done);
  sh.addrPending=pr;
}
// Waits for the details of an address that was only just tapped, but never longer than ms. true = they landed. false = gave up: the pick is cancelled
// (pickSeq), so a late answer can't rewrite the address box after the save has gone ahead, and the job is saved with the address text as it is.
async function waitAddrPending(sh,ms){
  const pr=sh.addrPending;if(!pr)return true;
  let t=0;
  const landed=await Promise.race([pr.then(function(){return true;},function(){return true;}),new Promise(function(res){t=setTimeout(function(){res(false);},ms);})]);
  clearTimeout(t);
  if(!landed&&sh.addrPending===pr){sh.pickSeq++;sh.addrPending=null;}
  return landed;
}
async function pickDetails(sh,p,seq,shown){
  let got=null;
  const tok=sh.gTok||uuid();
  sh.gTok=null;       // this call ends the session: the next time the address box is used it gets a new token
  if(!gBlocked()){
    const ctl=("AbortController" in window)?new AbortController():null,to=setTimeout(function(){if(ctl){try{ctl.abort();}catch(e){}}},7000);
    try{
      const r=await fetch(G_PLACE+encodeURIComponent(p.id)+"?sessionToken="+encodeURIComponent(tok),
        {headers:{"X-Goog-Api-Key":gKey(),"X-Goog-FieldMask":"addressComponents,formattedAddress"},signal:ctl?ctl.signal:undefined});
      if(!r.ok){await gFail(r);throw plainErr("Place details answered with an error.");}
      got=placeParts(await r.json(),p);
    }catch(e){got=null;}
    finally{clearTimeout(to);}
  }
  if(sh.pickSeq!==seq)return;       // the address was typed over, or another one was picked, while Google was answering
  if(!got){const sp=splitAddr(p.line);got={street:sp.street,suburb:sp.suburb,state:sp.state,postcode:sp.postcode,line:p.line,placeId:null};}
  sh.addrPick={line:got.line,street:got.street,suburb:got.suburb,state:got.state,postcode:got.postcode,placeId:got.placeId};
  if(SH!==sh||trim(val("f-addr"))!==shown)return;      // sheet closed, or the box was changed some other way
  setVal("f-addr",got.line);
  // the client's street, suburb ... boxes only get filled when there is a client (or a name typed for one): with no client they would block the save
  // Booking bar, new client: those boxes are hidden and only ever hold the latest pick, so a second pick replaces the first (in the full sheet they are visible and stay as they are).
  const qNew=!!(SH.quick&&!SH.clientId);
  if((SH.clientId||trim(val("f-name")))&&(qNew||(!trim(val("f-street"))&&!trim(val("f-suburb"))))){setVal("f-street",got.street);setVal("f-suburb",got.suburb);setVal("f-state",got.state);setVal("f-postcode",got.postcode);}
  updateLinks();renderSites();
}

/* ----- photo queue -----
   Every photo is shrunk and kept on the device (IndexedDB, or in memory if the browser won't allow that) BEFORE it is uploaded,
   and is only removed once both the file upload and the job_photos row have worked. A dropped signal, a crash or leaving the
   page mid-batch no longer loses a photo. On an iPhone a camera shot isn't saved to the camera roll, so this is the only copy. */
const PQ_DB="lpc-cal-photos-v1",PQ_STORE="pendingPhotos";
let pqDb=null;      // null = not opened yet, false = this browser won't give us IndexedDB
function pqOpen(){
  if(pqDb!==null)return Promise.resolve(pqDb||null);
  return new Promise(function(res){
    try{
      if(!window.indexedDB){pqDb=false;res(null);return;}
      const rq=indexedDB.open(PQ_DB,1);
      rq.onupgradeneeded=function(){const d=rq.result;if(!d.objectStoreNames.contains(PQ_STORE))d.createObjectStore(PQ_STORE,{keyPath:"id"});};
      rq.onsuccess=function(){pqDb=rq.result;pqDb.onversionchange=function(){try{pqDb.close();}catch(e){}pqDb=null;};res(pqDb);};
      rq.onerror=function(){pqDb=false;res(null);};
      rq.onblocked=function(){res(null);};
    }catch(e){pqDb=false;res(null);}
  });
}
function pqRun(mode,fn){
  return pqOpen().then(function(db){
    if(!db)throw new Error("no indexeddb");
    return new Promise(function(res,rej){
      let rq=null;
      try{
        const tx=db.transaction(PQ_STORE,mode);
        rq=fn(tx.objectStore(PQ_STORE));
        tx.oncomplete=function(){res(rq?rq.result:undefined);};
        tx.onerror=tx.onabort=function(){rej(tx.error||new Error("indexeddb failed"));};
      }catch(e){rej(e);}
    });
  });
}
async function pqPut(it){
  try{await pqRun("readwrite",function(st){return st.put(it);});}
  catch(e){S.pendingPhotos.push(it);}       // memory fallback: lasts until the page is closed
}
async function pqDel(id){
  S.pendingPhotos=S.pendingPhotos.filter(function(x){return x.id!==id;});
  try{await pqRun("readwrite",function(st){return st.delete(id);});}catch(e){}
}
async function pqList(jobId){
  let out=S.pendingPhotos.slice();
  try{const all=await pqRun("readonly",function(st){return st.getAll();});out=out.concat(all||[]);}catch(e){}
  return jobId?out.filter(function(x){return x.jobId===jobId;}):out;
}
// how many photos for this job are saved on the device but not uploaded yet; shows or hides the "Try again (N)" button
async function refreshPending(){
  const sh=SH;if(!sh||!sh.jobId)return;
  let n=0;
  try{n=(await pqList(sh.jobId)).length;}catch(e){}
  if(SH!==sh)return;
  sh.pendingN=n;
  if(n>0&&!moreOpen()){sh.moreForce=true;updateMoreRow();}      // photos that haven't gone up are inside More: open it so they aren't missed
  const row=byId("ph-retry-row"),b=byId("ph-retry");
  if(row)row.hidden=!n;
  if(b)b.textContent="Try again ("+n+")";
}
// one stored photo: upload the file, add the job_photos row, then (and only then) forget the stored copy.
// The path comes from the stored id, so a retry after a half-finished go picks up where it left off instead of doubling up.
async function uploadOne(it){
  const path=it.jobId+"/"+it.id+".jpg";
  let existed=false;
  const up=await S.sb.storage.from("job-photos").upload(path,it.blob,{contentType:"image/jpeg",upsert:false});
  if(up.error){
    if(String(up.error.statusCode||up.error.status||"")==="409"||/already exists|duplicate/i.test(String(up.error.message||"")))existed=true;
    else throw up.error;
  }
  if(existed){
    const ex=await S.sb.from("job_photos").select("id").eq("job_id",it.jobId).eq("path",path).limit(1);
    if(ex.error)throw ex.error;
    if(ex.data&&ex.data.length){await pqDel(it.id);return;}
  }
  const ins=await S.sb.from("job_photos").insert({job_id:it.jobId,path:path,caption:it.caption});
  if(ins.error)throw ins.error;
  await pqDel(it.id);
}
function photoStat(sh,jobId,t){if(SH===sh&&sh.jobId===jobId){const ps=byId("ph-stat");if(ps)ps.textContent=t;}}
// after a batch: tidy up, say what happened. If the sheet was closed in the meantime, a toast tells them the photos landed.
async function afterUploads(sh,jobId,ok,bad,unread,lastErr){
  sh.uploading=false;
  if(SH)updateLinks();
  if(SH===sh){
    await loadPhotos();
    await refreshPending();  // recount the photos still waiting, so the message below is right
    if(SH===sh){
      const ps=byId("ph-stat"),parts=[];
      if(ok)parts.push(ok+" added.");
      if(bad)parts.push(bad+" didn't upload yet. "+(sh.pendingN?"They're kept on this device, tap Try again when you have signal. ":"")+lastErr);
      if(unread)parts.push(unread+" couldn't be read.");
      if(ps&&parts.length)ps.textContent=parts.join(" ");
    }
  }else if(ok>0){toast(ok+" photo"+(ok===1?"":"s")+" added.");}
  if(bad||unread)toast((bad?bad+" photo"+(bad===1?"":"s")+" didn't upload. They're kept to try again. ":"")+(unread?unread+" couldn't be read. ":"")+lastErr,true);
}
async function loadPhotos(){
  const id=SH&&SH.jobId;if(!id)return;
  refreshPending();
  try{
    const r=await S.sb.from("job_photos").select("id,path,caption,created_at").eq("job_id",id).order("created_at",{ascending:true});
    if(r.error)throw r.error;
    let urls={};
    const paths=(r.data||[]).map(function(p){return p.path;});
    if(paths.length){
      const s=await S.sb.storage.from("job-photos").createSignedUrls(paths,3600);
      if(!s.error)(s.data||[]).forEach(function(x){if(x&&x.signedUrl)urls[x.path]=x.signedUrl;});
    }
    if(!SH||SH.jobId!==id)return;
    SH.photos=(r.data||[]).map(function(p){return {id:p.id,path:p.path,caption:p.caption,url:urls[p.path]||""};});
    renderPhotos();
  }catch(e){const ps=byId("ph-stat");if(ps&&SH&&!SH.uploading)ps.textContent="Couldn't load the photos. "+friendly(e);}
}
function renderPhotos(){
  const g=byId("ph-grid");if(!g||!SH)return;
  g.innerHTML=SH.photos.map(function(p){
    return p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+esc(p.url)+'" alt="'+esc(p.caption||"Job photo")+'" loading="lazy"></a>':"";
  }).join("");
