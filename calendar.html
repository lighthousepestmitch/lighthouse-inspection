<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Calendar">
<meta name="theme-color" content="#0E4F54">
<title>Lighthouse Job Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Look is a placeholder (same palette as the Job Book). Mitch brings the design later. */
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface2:#EDF0EC; --raise:0 1px 2px rgba(20,32,30,.06),0 4px 14px rgba(20,32,30,.05);
  --ink:#14201E; --ink2:#4B5B57; --ink3:#7E8D88; --line:#DCE1DD; --line2:#C9D1CC; --lineq:#EBEEEA;
  --deep:#0E4F54; --deepInk:#FFFFFF; --accent:#B4701F;
  --over:#A23C29; --overBg:#F8E8E3; --soon:#8C6314; --soonBg:#F8F0DC; --ok:#276B59; --okBg:#E2EFE9;
  --focus:#0E4F54; --now:#C0392B;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#16211F; --surface2:#1E2B28; --raise:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --ink:#E9EEEB; --ink2:#9FB0AB; --ink3:#71837E; --line:#27342F; --line2:#33423D; --lineq:#1C2824;
  --deep:#57B3BA; --deepInk:#08201F; --accent:#DDA05B;
  --over:#EE9179; --overBg:#2C1A16; --soon:#DCB162; --soonBg:#2B2416; --ok:#74C8A8; --okBg:#14261F;
  --focus:#57B3BA; --now:#EE7B6B;
}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#16211F; --surface2:#1E2B28; --raise:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --ink:#E9EEEB; --ink2:#9FB0AB; --ink3:#71837E; --line:#27342F; --line2:#33423D; --lineq:#1C2824;
  --deep:#57B3BA; --deepInk:#08201F; --accent:#DDA05B;
  --over:#EE9179; --overBg:#2C1A16; --soon:#DCB162; --soonBg:#2B2416; --ok:#74C8A8; --okBg:#14261F;
  --focus:#57B3BA; --now:#EE7B6B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.sheet-open body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45}
body.isdrag{cursor:grabbing;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--deep)}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:0 0 auto}
.spin{width:19px;height:19px;border:2px solid var(--line2);border-top-color:var(--deep);
  border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--deep);color:var(--deepInk);
  padding:calc(6px + env(safe-area-inset-top)) 14px 6px;display:flex;align-items:center;gap:10px;box-shadow:var(--raise)}
.top h1{font-size:18px;color:var(--deepInk);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:13px;opacity:.88;white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.top .out{min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.45);border-radius:10px;font-weight:600;font-size:14px;color:var(--deepInk)}

/* toolbar */
.tb{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 14px}
.tb .grp{display:flex;gap:6px;align-items:center}
.tbtn{min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tbtn.pri{background:var(--deep);color:var(--deepInk);border-color:var(--deep)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dlabel{font-family:Newsreader,Georgia,serif;font-size:20px;font-weight:600;flex:1 1 150px;min-width:0}
.tbdate{min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:16px}
.chk{display:inline-flex;align-items:center;gap:7px;min-height:44px;font-size:13.5px;color:var(--ink2)}
.chk input{width:20px;height:20px}
.live{font-size:12px;font-weight:600;color:var(--ink3);display:inline-flex;align-items:center;gap:5px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.live.on{color:var(--ok)} .live.on:before{background:var(--ok)}
.top .live,.top .live.on{color:var(--deepInk);opacity:.85;white-space:nowrap}
.top .live:before{background:currentColor;opacity:.45}
.top .live.on:before{background:#7FE3B8;opacity:1}
.banner{padding:11px 13px;border-radius:10px;font-size:14px;margin:0 14px 12px;border:1px solid}
.banner.warn{background:var(--soonBg);border-color:var(--soon);color:var(--soon)}
.banner.ok{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.banner.bad{background:var(--overBg);border-color:var(--over);color:var(--over)}
.linkbtn{text-decoration:underline;font-weight:600;color:inherit;min-height:44px;padding:0 6px}
#sh-msg .banner{margin:0 0 12px}

/* day view. The grid's height is fitted to the screen by fitPpm()/sizeGrid() in the script: 7am to 5pm shows without scrolling. */
.dayline{display:flex;gap:12px;padding:0 14px 14px;align-items:flex-start}
.gridwrap{--gut:46px;flex:1;min-width:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  position:relative;-webkit-overflow-scrolling:touch}
.grid{--cw:150px;min-width:calc(var(--gut) + var(--n) * var(--cw))}
.grow{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(var(--cw),1fr))}
.gtop{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line2)}
.gut{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);font-size:11px;color:var(--ink3);font-weight:600}
.gtop .gut{z-index:7;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.ch{padding:6px 8px;font-weight:700;font-size:14px;border-left:1px solid var(--line);display:flex;align-items:center;gap:7px;min-width:0}
.ch span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tot{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;margin-left:auto;flex:0 0 auto}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--unas,#7E8D88)}
/* "No time yet" strip: jobs that have a person but no start time, as small chips under the names (stays put while the grid scrolls)
   and a drop target: drop a job on a time to set it, drop a timed job here to clear its time. */
.ntrow{border-top:2px solid var(--soon)}
.ntrow .gut{background:var(--soonBg);color:var(--soon);font-size:10.5px;line-height:1.1;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;gap:2px}
.ntn{display:inline-block;min-width:19px;padding:0 5px;border-radius:999px;background:var(--soon);color:var(--soonBg);font-size:11px;line-height:18px}
.ntc{border-left:1px solid var(--line);padding:4px;min-height:34px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;background:var(--soonBg);
  max-height:64px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ntc>*{flex-shrink:0}
.ntadd{flex:1;min-height:26px;border:1.5px dashed var(--soon);border-radius:7px;color:var(--soon);font-weight:700;font-size:12.5px;background:transparent}
.ntc.dropover{outline-color:var(--soon);background-color:var(--soonBg)}
/* a job as a small chip: no-time jobs, and the week's Unassigned row */
.jt{--sc:#7E8D88;display:block;max-width:100%;min-width:0;padding:1px 7px 1px 5px;border-left:4px solid var(--sc);border-radius:6px;background:var(--surface);
  border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(20,32,30,.15);
  font-size:12.5px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.jt .ct{font-family:"Spline Sans Mono",ui-monospace,monospace;font-weight:600;color:var(--ink2);font-size:11px;margin-right:5px}
.jt.st-done{opacity:.6;filter:grayscale(.7)} .jt.st-cancelled{opacity:.55;text-decoration:line-through}
.jt.dragging{opacity:.3}
/* jobs with no time show as slim cards (the strip and the Unassigned list already say there is no time) */
.jm.nt{padding:5px 8px;min-height:44px}
.jm.nt .l1{display:none}
.jm.nt.st-booked .stl{display:none}
.jm.nt .nm{font-size:13px}
.hl{position:absolute;left:0;right:0;padding-right:5px;text-align:right;transform:translateY(-1px);white-space:nowrap}
/* hour lines, with a faint line on the half hour */
.col{position:relative;border-left:1px solid var(--line);cursor:cell;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--lineq) 1px,transparent 1px);
  background-size:100% var(--hr),100% calc(var(--hr) / 2)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.gb{overflow:clip}      /* a card stretched or dropped past the last hour must not grow the frame's scroll area (clip, not hidden: the sticky hour labels still work) */
.dropmark{position:absolute;left:2px;right:2px;border:2px dashed var(--deep);background:rgba(14,79,84,.14);
  border-radius:8px;pointer-events:none;z-index:3;font-size:12px;font-weight:700;color:var(--deep);padding:2px 6px;overflow:hidden;white-space:nowrap}
.wk .dropmark{left:0;right:0;padding:1px 2px;font-size:11px;border-radius:5px}
.dropover{outline:2px dashed var(--deep);outline-offset:-3px;background-color:rgba(14,79,84,.08)}

/* job cards (day grid) */
.jc,.jm{--sc:#7E8D88;border-left:5px solid var(--sc);background:var(--surface);border-radius:8px;
  box-shadow:0 1px 3px rgba(20,32,30,.2);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  cursor:pointer;overflow:hidden;font-size:12.5px;line-height:1.3}
.is-master .jc,.is-master .jm,.is-master .jt{touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.jc .l1,.jm .l1{font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.jc .nm,.jm .nm{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .ds,.jm .ds{color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stl{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;
  background:var(--surface2);color:var(--ink2);margin-top:2px}
.stl.done{background:var(--okBg);color:var(--ok)} .stl.cancelled{background:var(--overBg);color:var(--over)}
/* timed cards on the grid: height is the job's length, tinted with the person's colour. What shows depends on the room (set by cardFit()):
   tiny = one line (time, name) / short = time, name / mid = + suburb and services on one line / full = suburb and services on lines of their own.
   nw = a narrow lane (week view): start time and first word of the name / xn = very narrow: smaller text. */
.jc{position:absolute;padding:2px 5px;z-index:1;line-height:1.2;background:var(--surface);background:color-mix(in srgb,var(--sc) 13%,var(--surface))}
.jc .ds,.jc .stl{display:none}
.jc.mid .ds,.jc.full .ds{display:block}
.jc.full .ds .sep{display:none}
.jc.full .ds .sb,.jc.full .ds .sv{display:block;overflow:hidden;text-overflow:ellipsis}
.jc.tiny{display:flex;gap:5px;align-items:center;white-space:nowrap;padding-top:0;padding-bottom:0;line-height:1.1}
.jc.tiny .l1{flex:0 0 auto}
.jc.tiny .nm{min-width:0}
.jc.nw{padding:1px 3px 1px 4px}
.jc.xn{padding:1px 0 1px 2px;border-left-width:3px}
.jc.xn .l1{font-family:inherit;font-size:10px;letter-spacing:-.03em;text-overflow:clip}
.jc.xn .nm{font-size:10px;letter-spacing:-.03em;text-overflow:clip}      /* "Gayl" says more than "G..." */
.jc.xn.tiny .nm{display:none}
/* the stretch handle on the bottom edge (master only): drag it to make the job longer or shorter */
.rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;z-index:2}
.rz:after{content:"";position:absolute;left:50%;bottom:2px;width:20px;margin-left:-10px;height:3px;border-radius:2px;background:var(--ink2);opacity:0;transition:opacity .15s}
@media(hover:hover){.jc:hover .rz:after{opacity:.6}}
@media(pointer:coarse){.rz{height:min(14px,40%)}.rz:after{opacity:.3;bottom:1px;width:16px;margin-left:-8px;height:2px}}
.jc.resizing{z-index:5;box-shadow:0 0 0 2px var(--deep),0 6px 18px rgba(0,0,0,.25)}
.jc.resizing .rz:after{opacity:.8}
body.isresize,body.isresize *{cursor:ns-resize!important;-webkit-user-select:none;user-select:none}
.rzlab{position:absolute;z-index:6;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.jc.st-done,.jm.st-done,.tcard.st-done{opacity:.6;filter:grayscale(.7)}
.jc.st-cancelled,.jm.st-cancelled,.tcard.st-cancelled{opacity:.55;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.05) 6px 12px)}
.jc.st-cancelled .nm,.jm.st-cancelled .nm{text-decoration:line-through}
.jc.dragging,.jm.dragging{opacity:.3}
.ghost{box-shadow:0 10px 28px rgba(0,0,0,.35)!important;opacity:.92}
.jm{padding:6px 8px;position:relative}

/* tray */
.tray{flex:0 0 230px;border:1px dashed var(--line2);border-radius:12px;padding:10px;background:var(--surface2);display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 190px);overflow:auto}
.tray>*{flex-shrink:0}      /* without this the cards squash to fit instead of the tray scrolling (10 jobs in an iPad-portrait tray were 24px tall) */
.tray .trayhead{display:flex;justify-content:space-between;align-items:baseline}
.tray h2{font-size:16px}
.tray h3{font-family:"Public Sans",sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-top:6px}
.n{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--ink3)}
.traynote{font-size:12.5px;color:var(--ink3);margin:2px 0}
.tag{font-size:11px;color:var(--soon);font-weight:600}
/* the Unassigned list as one sideways-scrolling row (the week view always, the day view on a phone or iPad) */
.tray.row{flex:none;width:auto;flex-direction:row;align-items:center;gap:6px;max-height:none;overflow-x:auto;overflow-y:hidden;padding:5px 8px;-webkit-overflow-scrolling:touch}
.tray.row .trayhead{flex:0 0 auto;gap:6px;align-items:center}
.tray.row h2{font-size:13.5px}
.tray.row .traynote{white-space:nowrap;margin:0}
.tray.row .jt{flex:0 0 auto;max-width:220px}
@media(max-width:900px){
  .dayline{flex-direction:column;align-items:stretch}
  .gridwrap{flex:none;width:100%}
  .tray{order:-1;flex:none;width:100%;flex-direction:row;align-items:center;gap:6px;max-height:none;overflow-x:auto;overflow-y:hidden;padding:5px 8px}
  .tray .trayhead{flex:0 0 auto;gap:6px;align-items:center}
  .tray h2{font-size:13.5px}
  .tray h3{display:none}
  .tray .traynote{white-space:nowrap;margin:0}
  .tray .jm{flex:0 0 auto;max-width:210px;min-height:0;padding:2px 8px;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .tray .jm .ds,.tray .jm .stl,.tray .jm .tag{display:none}
}

/* week view: a time grid, one column per day, split into one lane per person when everyone is shown */
.wkline{flex-direction:column;align-items:stretch;gap:8px}
.wkline .gridwrap{flex:none;width:100%}
.grid.wk{min-width:0}      /* the week fits the width of the screen: no sideways scrolling */
.wk .wrow{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(0,1fr))}
.wdh{border-left:1px solid var(--line);padding:3px 5px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-width:0;cursor:pointer;line-height:1.25;min-height:36px;color:inherit}
.wdh:hover{background:var(--surface2)}
.wdh b{font-size:13.5px;white-space:nowrap}
.wdh .tot{margin:0;font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wdh.today{background:var(--okBg);color:var(--ok)}
.wdh.today .tot{color:var(--ok)}
.wdh .ptot{display:none}      /* a phone only, see the max-width:719px block */
.wln .gut{background:var(--soonBg);color:var(--soon);font-size:10.5px;line-height:1.1;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.wdl{display:flex;border-left:1px solid var(--line);min-width:0}
.wlh{--sc:#7E8D88;flex:1 1 0;min-width:0;border-top:3px solid var(--sc);background:var(--soonBg);padding:2px;display:flex;flex-direction:column;gap:2px;
  min-height:24px;max-height:66px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wlh>*{flex-shrink:0}
.wlh+.wlh{border-left:1px dotted var(--line2)}
.wlh .lt{font-size:10.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;line-height:14px}
.wlh .jt{font-size:11px;line-height:17px;padding:0 3px 0 3px;border-left-width:3px}
@media(max-width:719px){.wlh .jt{font-size:10px;padding:0 1px 0 2px;text-overflow:clip;letter-spacing:-.03em}}
.wlh.dropover{outline-color:var(--soon)}
.wlh{cursor:cell}
.wday{display:flex;border-left:1px solid var(--line);min-width:0}
.wday.today{background:rgba(39,107,89,.05)}
.wday .col{flex:1 1 0;min-width:0;border-left:none}
.wday .col+.col{border-left:1px dotted var(--line2)}

/* tech list */
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
.tcard{--sc:#0e7490;background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--sc);border-radius:12px;margin-bottom:12px;box-shadow:var(--raise);overflow:hidden}
.tmain{padding:14px 14px 10px;cursor:pointer;min-height:44px}
.ttime{font-family:"Spline Sans Mono",monospace;font-size:15px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center}
.tname{font-family:Newsreader,Georgia,serif;font-size:22px;font-weight:600;margin:2px 0}
.taddr{font-size:16px;color:var(--ink)}
.tsvc{font-size:15px;color:var(--ink2);font-weight:600;margin-top:2px}
.tnote{font-size:14px;color:var(--ink2);margin-top:6px;white-space:pre-wrap;word-break:break-word}
.tacts{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.tacts a{flex:1;min-width:92px}
.empty{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty h3{font-size:18px;color:var(--ink2);margin-bottom:5px}

/* buttons */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{flex:1;min-width:104px;min-height:48px;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--deep);color:var(--deepInk);border-color:var(--deep)}
.btn.ok{background:var(--ok);color:var(--deepInk);border-color:var(--ok)}
.btn.warn{background:var(--surface);color:var(--soon);border-color:var(--soon)}
.btn.bad{background:var(--surface);color:var(--over);border-color:var(--over)}

/* login / status screens */

.boot{display:grid;place-items:center;min-height:50vh;text-align:center;padding:24px;gap:10px;color:var(--ink2)}

.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(10,20,18,.42);display:flex;align-items:flex-end;justify-content:center}

.shhead{background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
@media(min-width:720px){.shhead{padding-top:14px}}
.shttl{flex:1;min-width:0}

.x{width:44px;height:44px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}

.shbody{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
.shfoot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.shfoot .btn{margin:0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin:18px 0 8px}
.fl{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin:0 0 4px}
.fld{margin-bottom:10px;position:relative;min-width:0}
.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea.inp{min-height:110px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:10px}
.hint{font-size:12.5px;color:var(--ink3);margin:-4px 0 10px 2px}
.hint.ok{color:var(--ok)} .hint.new{color:var(--accent);font-weight:600}
.hint .linkbtn{font-size:12.5px;vertical-align:baseline}
#f-addr-hint:empty{display:none}
/* services (tick list, then a price and invoice wording for each ticked one) */
.svlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;margin-bottom:4px}
.svrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 8px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14.5px;line-height:1.25;min-width:0}
.svrow span{min-width:0;overflow-wrap:anywhere}
.svrow input{width:22px;height:22px;flex:0 0 auto;margin:0}
.svrow.on{border-color:var(--deep);background:var(--okBg)}
#sv-list .linkbtn{display:block;margin:2px 0 6px -6px}
.svcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px 2px;margin:8px 0}
.svhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.svhead b{font-size:15px;min-width:0;word-break:break-word}
.pf{flex:0 0 auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soon);background:var(--soonBg);padding:2px 8px;border-radius:5px}
textarea.sdesc{min-height:64px}

/* a client's known job sites, tap to fill the job address */
.sites{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 12px}
.sitelbl{font-size:12.5px;color:var(--ink3);font-weight:600;margin-right:2px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;line-height:1.25;text-align:left}
.chip.on{background:var(--deep);color:var(--deepInk);border-color:var(--deep)}
.aclist{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--raise);margin-top:2px;max-height:300px;overflow:auto}
.acitem{display:block;width:100%;text-align:left;padding:10px 12px;min-height:48px;border-bottom:1px solid var(--line);font-size:15px}
.acitem:last-child{border-bottom:none}
.acitem b{display:block}
.acitem span{display:block;font-size:12.5px;color:var(--ink2)}
.acitem:hover,.acitem:focus-visible{background:var(--surface2)}
.ro{padding:10px 12px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;font-size:15px;min-height:44px}
.recs{font-size:14px;color:var(--ink2);margin:2px 0 6px}
.recs .y{color:var(--ok);font-weight:700}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}
.phgrid a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--surface2)}
.phgrid img{width:100%;height:100%;object-fit:cover;display:block}
.photostat{font-size:13.5px;color:var(--ink2);min-height:20px}
.danger{margin-top:22px;padding-top:6px;border-top:1px solid var(--line)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:400;max-width:min(92vw,520px);
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}

body.isdrag #toast,body.isresize #toast{pointer-events:none;opacity:.35}      /* so a card can be dropped on the spot under it */
#toast .toastbtn{margin-left:10px;min-height:44px;padding:0 10px;font-weight:700;text-decoration:underline;color:inherit}

/* segmented buttons (Quick add "Who", and the phone day view "Both | Mitch | ...") and rows of chips */
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--surface)}
.segb{flex:1 1 0;min-width:0;min-height:44px;padding:0 8px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-left:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:6px}
.segb:first-child{border-left:none}
.segb[aria-pressed="true"]{background:var(--deep);color:var(--deepInk)}
.segb .n{color:inherit;opacity:.85}
/* who to show (Both | Mitch | ...): in the toolbar, for the week view, and for the day view on a phone */
.tb .pfilter{flex:1 1 220px;min-width:0;max-width:440px}
/* toolbar date: on a computer a label and a date box side by side; on a phone (master) one button with the date box laid invisibly over it */
.dpick{display:contents}
.dshort{display:none}
.tbx{display:contents}
.tbbot{display:none}
.chiprow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:1px 16px 3px;margin:0 -16px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow>*{flex:0 0 auto}
@media(hover:hover) and (pointer:fine){.chiprow{scrollbar-width:thin}.chiprow::-webkit-scrollbar{display:block;height:6px}}      /* on a computer the sideways scroll needs a visible bar */

/* floating + button (master): Quick add */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:60px;height:60px;border-radius:50%;
  background:var(--deep);color:var(--deepInk);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.34),0 1px 3px rgba(0,0,0,.3)}
.fab .ic{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.95)}
body.isdrag .fab,body.isresize .fab{pointer-events:none;opacity:.3}      /* so a card can be dropped on the spot under it */
body.is-master main{padding-bottom:92px}
@media(min-width:720px){body.is-master main{padding-bottom:0}}      /* the grid is fitted to the screen, so nothing is below it to scroll to */
body.is-master #toast{bottom:calc(92px + env(safe-area-inset-bottom))}
body.is-master #toast.act{bottom:auto;top:calc(4px + env(safe-area-inset-top));padding-top:4px;padding-bottom:4px}      /* the Undo toast sits over the title bar, never over the grid: the next job to move is often right where it would be */
html.qa-open #toast{bottom:auto;top:calc(10px + env(safe-area-inset-top))}      /* with the keyboard up, a toast at the bottom would be hidden behind it */

/* Quick add panel */
.qa .panel{max-width:520px}
.qa .shhead{align-items:center;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:4px;gap:4px}
.qa .shhead h2{flex:1;min-width:0}
.qa .shhead .linkbtn{flex:0 0 auto;font-size:14px}
.qa .shbody{padding:2px 16px 10px}
.qa .lbl{margin:6px 0 3px;display:flex;align-items:center;gap:8px;min-height:18px}
.qa .qname{margin-top:8px}
.qa .lbl .qdl{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink2);font-size:13px}
.qa .lbl .linkbtn{text-transform:none;letter-spacing:0;font-size:14px;margin:-13px -6px -13px 0}
.qa .fld{margin-bottom:8px}
.qa .aclist{max-height:230px}
.qa .hint{margin:0 0 8px 2px}
.qa .shfoot{gap:10px}
.qa .shfoot .btn{min-width:0;padding:11px 8px}
.qa .shfoot .btn.pri{flex:0 0 32%}
.qa .shfoot .btn:not(.pri){flex:1}
.chip.qc{text-align:center;padding:6px 14px;white-space:nowrap}
.qdate{flex:0 0 156px;min-height:44px;padding:6px 10px}
.qtime{display:flex;gap:6px;align-items:center}
.qtime>.chip{flex:0 0 auto}
.qtime .chiprow{flex:1;min-width:0;margin:0;padding:1px 1px 3px}
.qsv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.qsv .chip{border-radius:12px;padding:4px 5px;text-align:center;font-size:13.5px;line-height:1.2;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;min-width:0}
.qsv .chip.on:before{content:"\2713\00a0"}
.qsum{display:flex;gap:0 8px;align-items:center;flex-wrap:wrap;margin:-2px 0 6px;padding:5px 10px 0;border:1px solid var(--ok);background:var(--okBg);border-radius:10px}
.qsum .qsl{flex:1 1 180px;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.qsum .qsa{display:flex;gap:2px;margin-right:-6px}
.qsum .linkbtn{font-size:13.5px}
.qhint{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 0}
.qhint .hint{margin:0}
.qhint .linkbtn{flex:0 0 auto;font-size:14px;margin-right:-6px}
.qsum .miss{color:var(--soon);font-weight:700}
@media(max-width:719px){
  .grid{--cw:136px}
  /* phone toolbar in three rows instead of four: [< Today >] [Day Week] / [date label] [date box] / [New job] [Show cancelled] */
  .tb{padding:6px 14px 8px;gap:6px 10px}
  .tb>.grp:first-child{order:1}
  .tb>.grp[aria-label="View"]{order:2}
  .tb .dlabel{order:3;flex:1 1 150px;font-size:18px}
  .tb .tbdate{order:4;flex:0 0 152px}
  .tb .tbtn.pri{order:5}
  .tb .chk{order:6}
  .tb .live{order:7}
  .tray{padding:4px 8px;gap:5px}
  .tray .traynote{display:none}
  .gridwrap{--gut:36px}
  .ch{padding:5px 6px;font-size:13px;gap:5px}
  .tot{font-size:11.5px}
  /* master on a phone: the toolbar in two rows so the whole day fits under it.
     [< Today >] [Day Week] / [date button] [Both | Mitch | ...]. New job and Show cancelled sit under the grid (.tbbot). */
  .is-master .top{padding-top:calc(2px + env(safe-area-inset-top));padding-bottom:2px}
  .is-master .top h1{font-size:17px}
  .is-master .tb{padding:4px 8px 6px;gap:6px}
  .is-master .tb>.grp[aria-label="View"]{margin-left:auto}
  .is-master .tb .dpick{order:3;display:block;position:relative;flex:1 1 auto;min-width:0;height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
  .is-master .tb.hasf .dpick{flex:0 1 auto;max-width:48%}
  .is-master .tb .dpick .dlabel{display:block;font-size:17px;line-height:42px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .is-master .tb .dlong{display:none}
  .is-master .tb .dshort{display:inline}
  .is-master .tb .dpick .tbdate{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0;opacity:0;padding:0;border:none}
  .is-master .tb .pfilter{order:4;flex:1 1 0;max-width:none}
  .is-master .tb .pfilter .segb{padding:0 4px;gap:4px;font-size:14.5px}
  .is-master .tb .pfilter .segb .n{display:none}
  .is-master .tb .pfilter .dot{width:9px;height:9px}
  .is-master .tb .tbx{display:none}
  .is-master .tbbot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:4px 8px 8px}
  .is-master .dayline{padding:0 8px 6px;gap:6px}
  .wlh .lt{display:none}      /* a person's lane on a phone is too narrow for a name: the colour says who */
  .wdh{padding:2px 3px;min-height:32px}
  .wdh b{font-size:12.5px}
  .wdh .tot{font-size:10.5px}
  .wdh.hasp>.tot{display:none}
  .wdh .ptot{display:flex;flex-direction:column;max-width:100%}
  .wdh .pl{display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink2);white-space:nowrap;line-height:1.25}
  .wdh .pl .dot{width:7px;height:7px}
  .wdh.today .pl{color:var(--ok)}
}

<noscript><p style="padding:20px">This calendar needs JavaScript turned on.</p></noscript>

<!-- Pinned on purpose (2.117.2, the build the old @2 tag gave on 5 Oct 2026). To upgrade: change the version, re-hash with

<script>
(function(){
"use strict";

/* =====================================================================
   Lighthouse shared job calendar.
   Talks to Supabase (see ~/lighthouse-supabase/01_schema.sql). Row-level
   security in the database is the real lock; this page just behaves.
   ===================================================================== */

/* ---------- settings ---------- */
const WORK_START=7*60, WORK_END=17*60;   // the day and week grids always show 7am to 5pm, and grow (to the hour) to take in any job outside that
const PPM_FLOOR=0.6, PPM_MAX=3;          // pixels per minute: fitted to the screen (fitPpm), but never under 0.6 so a 30 min job can still be tapped
const SNAP=15;               // minutes
const MIN_DUR=15;            // shortest a job can be stretched down to
const UNAS="#7E8D88";
const CLIENT_COLS="id,name,phone,email,street,suburb,state,postcode";
const JOB_COLS="*, client:clients("+CLIENT_COLS+")";
const PREF_KEY="lpc_calendar_prefs_v1", EMAIL_KEY="lpc_calendar_last_email", DRAFT_KEY="lpc-cal-draft-v1";
const DRAFT_MAX_AGE=24*60*60*1000;
const STATE_ABBR={"New South Wales":"NSW","Victoria":"VIC","Queensland":"QLD","South Australia":"SA","Western Australia":"WA","Tasmania":"TAS","Northern Territory":"NT","Australian Capital Territory":"ACT"};
// These two service types are the ones that get the Termite inspection button. Everything else gets the Service record button.
const INSPECTION_TYPES=["Termite Inspection","Pre-Purchase Inspection"];
const SVC_SHOW=8;           // services shown before "More services"
const PHOTON_URL="https://photon.komoot.io/api/",PHOTON_LAT=-28.65,PHOTON_LON=153.56;     // address lookup, biased to the Northern Rivers
const QUICK_KEY="lpc_quick_prefs_v1";   // Quick add remembers who the last job was for
const QUICK_SVC=6;                      // service chips Quick add shows before "More"
const QUICK_DUR=60;                     // minutes, same default as the full job sheet
const QUICK_FIRST=6*60+30, QUICK_LAST=17*60, QUICK_STEP=30;      // time chips 6:30am to 5:00pm
const NARROW="(max-width:719px)";       // phone width: below this the day view can show one person at a time

/* ---------- tiny helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const byId=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>(n<10?"0":"")+n;
const trim=s=>String(s==null?"":s).trim();
const nn=s=>{s=trim(s);return s?s:null;};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const IC={
  tick:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  l:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  r:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  phone:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
  msg:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.3 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.8A8.4 8.4 0 0 1 3.7 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>',
  mail:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  pin:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cam:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

/* ---------- dates and times (local parts only, never toISOString for a date) ---------- */
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseYmd(s){const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function todayYmd(){return ymd(new Date());}
function validYmd(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s))&&ymd(parseYmd(s))===s;}
function weekStart(s){const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function niceDate(s){const d=parseYmd(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();}
function dayShort(s){const d=parseYmd(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function tmToMin(t){if(!t)return null;const m=/^(\d{1,2}):(\d{2})/.exec(String(t));return m?(+m[1])*60+(+m[2]):null;}
function minToTm(m){return pad(Math.floor(m/60))+":"+pad(m%60)+":00";}
function minToHM(m){return pad(Math.floor(m/60))+":"+pad(m%60);}
function fmtMin(m){const h=Math.floor(m/60)%24,mi=m%60;return (h%12===0?12:h%12)+":"+pad(mi)+(h>=12?"pm":"am");}
function hourLabel(m){const h=Math.floor(m/60)%24;return (h%12===0?12:h%12)+(h>=12?"pm":"am");}
function fmtDur(m){if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" hr"+(r?" "+r+" min":"");}
function hm(m){const h=Math.floor(m/60)%24;return (h%12===0?12:h%12)+":"+pad(m%60);}      // 8:00, 1:30 (the grid's hour labels say am or pm)
function rangeTxt(s,dur){return hm(s)+"-"+hm(s+dur);}                                     // 8:00-9:00
function hmc(m){return m%60?hm(m):String(Math.floor(m/60)%24%12||12);}                       // 8, 9:15 (the tightest week lanes on a phone)
// the time line on a grid card: the range, or just the start when the card is narrow
function cardTime(fit,s,dur){return /\bxn\b/.test(fit)?hmc(s):/\bnw\b/.test(fit)?hm(s):rangeTxt(s,dur);}
function firstWord(s){return trim(s).split(/\s+/)[0]||"";}
function fmtStamp(iso){const d=new Date(iso);if(isNaN(d))return "";return d.getDate()+" "+MON[d.getMonth()]+", "+fmtMin(d.getHours()*60+d.getMinutes());}

function toastUndo(msg,onUndo){

  const b=document.createElement("button");b.type="button";b.className="toastbtn";b.textContent="Undo";

  clearTimeout(toastT);toastT=setTimeout(function(){t.className="";},8000);

function plainErr(m){const e=new Error(m);e.plain=true;return e;}
function friendly(e){
  if(e&&e.plain)return e.message;
  const msg=trim(e&&(e.message||e.error_description||e.msg)||(typeof e==="string"?e:""));
  const code=e&&e.code,status=e&&e.status;
  if((typeof navigator!=="undefined"&&navigator.onLine===false)||/failed to fetch|networkerror|load failed|network request failed/i.test(msg))return "Can't reach the server. Check your signal and try again.";
  if(status===401||/\bjwt\b|not authenticated|invalid.*token|refresh token/i.test(msg))return "You've been logged out. Log in again.";
  if(code==="42501"||/row-level security|permission denied/i.test(msg)){return /^Only the master/.test(msg)?msg:"You're not allowed to do that.";}
  if(code==="23505")return "That already exists.";
  if(status===429||/rate limit|too many/i.test(msg))return "Too many tries. Wait a few minutes and try again.";
  return "Something went wrong"+(msg?" ("+msg+")":"")+".";
}

function netErr(e){return (navigator.onLine===false)||(e&&(e.name==="AuthRetryableFetchError"||e.status===0))||/failed to fetch|networkerror|load failed|network request failed/i.test(String(e&&e.message||""));}

function sortStaff(a){return a.slice().sort(function(x,y){if(x.role!==y.role)return x.role==="master"?-1:1;return String(x.name).localeCompare(String(y.name));});}
function safeColour(c){return /^#[0-9a-fA-F]{3,8}$/.test(String(c||""))?c:UNAS;}
function staffColour(id){const s=id&&S.staffById[id];return safeColour(s&&s.colour);}
function activeStaff(){return S.staff.filter(function(s){return s.active;});}
function cName(j){return (j.client&&j.client.name)?j.client.name:"No client";}
function composeAddr(street,suburb,state,pc){const tail=[suburb,state,pc].map(trim).filter(Boolean).join(" ");return [trim(street),tail].filter(Boolean).join(", ");}
function suburbOf(j){
  if(j.client&&j.client.suburb)return j.client.suburb;
  const a=trim(j.address);if(a.indexOf(",")<0)return "";
  const last=a.split(",").pop();
  return trim(last.replace(/\b(NSW|VIC|QLD|SA|WA|TAS|NT|ACT)\b/i,"").replace(/\b\d{4}\b/,""));
}
function byTime(a,b){
  const x=tmToMin(a.start_time),y=tmToMin(b.start_time);
  if(x==null&&y==null)return cName(a).localeCompare(cName(b));
  if(x==null)return 1;if(y==null)return -1;return x-y;
}
function visibleJobs(){return S.jobs.filter(function(j){return (S.isMaster&&S.showCancelled)||j.status!=="cancelled";});}
const INSPECTION_KEYS=INSPECTION_TYPES.map(function(n){return n.toLowerCase();});
function isInspectionType(name){return INSPECTION_KEYS.indexOf(String(name==null?"":name).trim().toLowerCase())>=0;}
function slugify(name){
  let s=String(name).toLowerCase();
  try{s=s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}catch(e){}
  s=s.replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60).replace(/-+$/,"");
  return s||"client";
}
function looksEmail(s){return /^[^\s@?&#,;]+@[^\s@?&#,;]+\.[^\s@?&#,;]+$/.test(trim(s));}
function parsePrice(s){const t=String(s==null?"":s).replace(/[$,\s]/g,"");if(t==="")return null;if(!/^\d+(\.\d{1,2})?$/.test(t))return NaN;return Number(t);}
function uuid(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  const b=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(b);
  b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  const h=Array.prototype.map.call(b,function(x){return (x+256).toString(16).slice(1);}).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}

/* ---------- services on a job ----------
   A job can have several services. In the form each one is {type, description, price}, with the price kept as the text in the box.
   Saved: jobs.services = [{type, description, price}] in tick order, jobs.service_type = the names joined with " + " (for showing),
   jobs.price = the entered prices added up (null if none entered). */
function priceStr(p){return p==null||p===""?"":String(p);}
function typeDesc(name){const t=S.typesByName[name];return t&&t.xero_description?String(t.xero_description):"";}
// What the form starts with for a job: its saved services, or, for an older job that only has service_type, that one service.
function loadServices(j){
  if(!j)return [];
  if(Array.isArray(j.services)&&j.services.length){
    const out=j.services.filter(function(e){return e&&trim(e.type);}).map(function(e){
      // only a service with no wording saved at all gets the default Xero wording; wording that was cleared on purpose (saved as "") stays blank
      return {type:trim(e.type),description:e.description===undefined?typeDesc(trim(e.type)):String(e.description||""),price:priceStr(e.price)};
    });
    // one service with no price of its own, but the job has one: that is the service's price (don't show it blank and risk wiping it on save)
    if(out.length===1&&out[0].price===""&&j.price!=null)out[0].price=priceStr(j.price);
    return out;
  }
  const st=trim(j.service_type);
  return st?[{type:st,description:typeDesc(st),price:priceStr(j.price)}]:[];
}
// the form's services as they get saved (price as a number or null, blank wording as "" so it stays blank when the job is opened again)
function canonServices(list){
  return (list||[]).map(function(e){return {type:trim(e.type),description:trim(e.description),price:parsePrice(e.price)};});
}
function sumPrice(list){
  let any=false,t=0;
  list.forEach(function(e){if(e.price!=null&&!isNaN(e.price)){any=true;t+=e.price;}});
  return any?Math.round(t*100)/100:null;
}
function svcNames(j){
  if(Array.isArray(j.services)&&j.services.length){
    const a=j.services.map(function(e){return trim(e&&e.type);}).filter(Boolean);
    if(a.length)return a;
  }
  const st=trim(j.service_type);
  return st?st.split(" + ").map(trim).filter(Boolean):[];
}
// for the cards: all the names joined, or, when that is too long for the card, the first one and how many more
function svcLabel(j,max){
  const n=svcNames(j),full=n.join(" + ");
  if(n.length<2||full.length<=max)return full;
  return n[0]+" +"+(n.length-1);
}

function hashError(){
  try{
    const h=String(location.hash||"").replace(/^#/,"");if(!h)return "";
    const p=new URLSearchParams(h);if(!p.has("error")&&!p.has("error_code")&&!p.has("error_description"))return "";
    const code=(p.get("error_code")||"").toLowerCase(),err=(p.get("error")||"").toLowerCase();
    try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    if(code==="otp_expired"||code==="flow_state_expired"||code==="flow_state_not_found")
      return "That login link has expired or was already used. Ask for a new one below.";
    if(err==="access_denied")
      return "That login link didn't work. Ask for a new one below.";
    return "The login link didn't work. Ask for a new one below.";
  }catch(e){return "";}
}

function loginBusy(on){["lg-send","lg-go"].forEach(function(id){const b=byId(id);if(b)b.disabled=!!on;});}

async function sendLink(){
  const email=trim(byId("lg-email").value).toLowerCase();
  if(!looksEmail(email)){loginMsg("Type your email address first.","bad");return;}
  try{localStorage.setItem(EMAIL_KEY,email);}catch(e){}
  loginBusy(true);loginMsg("Sending...","ok");
  try{
    const redirect=String(location.href).split(/[?#]/)[0];
    const r=await S.sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:false,emailRedirectTo:redirect}});
    if(r.error)throw r.error;
    loginMsg("Sent. Check your email and tap the link. Only a few can be sent each hour, so don't keep asking.","ok");
  }catch(e){
    const m=trim(e&&e.message);
    if(/signups? not allowed|not allowed for otp|user not found/i.test(m))loginMsg("That email isn't set up for this calendar. Ask Mitch.","bad");
    else loginMsg(friendly(e),"bad");
  }
  loginBusy(false);
}
async function passwordLogin(){
  const email=trim(byId("lg-email").value).toLowerCase(),pass=byId("lg-pass").value;
  if(!looksEmail(email)){loginMsg("Type your email address first.","bad");return;}
  if(!pass){loginMsg("Type your password.","bad");return;}
  try{localStorage.setItem(EMAIL_KEY,email);}catch(e){}
  loginBusy(true);loginMsg("Checking...","ok");
  try{
    const r=await S.sb.auth.signInWithPassword({email:email,password:pass});
    if(r.error)throw r.error;
    if(r.data&&r.data.session)onSession(r.data.session);
  }catch(e){
    const m=trim(e&&e.message);
    loginMsg(/invalid login|invalid credentials|email not confirmed/i.test(m)?"That email and password don't match. Check them, or use the login link below.":friendly(e),"bad");
    loginBusy(false);
  }
}
async function signOut(){
  if(SH){closeSheet(true);}
  stopApp();
  let r=null;
  try{r=await S.sb.auth.signOut({scope:"local"});}catch(e){r={error:e};}
  // auth-js hands back {error} instead of throwing. If the logout call failed (no signal), the stored session is still there,
  // so clear the stored login keys ourselves, otherwise the next person to open the app lands in this account.
  let partial=false;
  if(r&&r.error){
    partial=true;
    try{
      const k=(S.sb.auth&&S.sb.auth.storageKey)||"";
      Object.keys(localStorage).forEach(function(key){
        if((k&&key.indexOf(k)===0)||/^sb-.+-auth-token/.test(key))localStorage.removeItem(key);
      });
    }catch(e){}
  }
  S.userId=null;S.user=null;S.me=null;
  renderLogin(partial?"Logged out on this device. No signal, so the login wasn't cancelled on the server. That's fine, it just runs out on its own.":"",partial?"warn":"");
}

function onSession(session){
  if(!session||!session.user){
    // INITIAL_SESSION comes through as null before getSession has finished (and when it can't reach the server): let checkSession decide.
    if(!S.userId&&(S.screen==="boot"||S.screen==="offline"))return;
    if(S.userId||S.screen==="boot"||S.screen==="fatal"||S.screen==="notsetup"||S.screen==="offline"){
      const kept=stashDraft(S.userId);      // before anything is torn down, while the form is still on screen
      stopApp();S.userId=null;S.user=null;S.me=null;if(SH)closeSheet(true);
      renderLogin(kept?"You've been logged out. What you typed is kept and comes back after you log in.":(S.hashErr||""),"warn");S.hashErr="";
    }
    return;
  }
  S.hashErr="";
  if(S.userId===session.user.id&&(S.screen==="cal"||S.screen==="notsetup"||S.starting))return;
  if(S.userId&&S.userId!==session.user.id){stashDraft(S.userId);stopApp();if(SH)closeSheet(true);}
  S.userId=session.user.id;S.user=session.user;
  startApp();
}

/* ----- a job that was half typed when the login ran out: kept on this device and offered back after the next log in ----- */
function stashDraft(uid){
  if(!SH||!uid||!isDirty())return false;
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify({uid:uid,jobId:SH.jobId||null,isNew:!!SH.isNew,init:SH.init,
      clientId:SH.clientId||null,client:SH.client||null,form:readForm(),addrTouched:!!SH.addrTouched,
      baseUpdatedAt:(SH.job&&SH.job.updated_at)||null,at:Date.now()}));
    return true;
  }catch(e){return false;}
}
function readDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");return d&&typeof d==="object"?d:null;}catch(e){return null;}}
function hideDraftBar(){const el=byId("dr");if(el&&el.innerHTML){el.innerHTML="";renderBody();}}      // the grid is fitted to the room under the banner, so fit it again
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}hideDraftBar();}
function clearDraftForJob(jobId){const d=readDraft();if(d&&jobId&&d.jobId===jobId&&d.uid===S.userId)clearDraft();}
function offerDraft(){
  const d=readDraft();if(!d)return;
  // never show one person's draft to another, and don't keep old ones around
  if(d.uid!==S.userId||!d.form||!(Date.now()-d.at<DRAFT_MAX_AGE)){clearDraft();return;}
  const el=byId("dr");if(!el)return;
  const who=trim(d.form.name);
  el.innerHTML='<div class="banner warn">You were logged out while editing '+(who?esc(who)+"'s job":"a job")+'. What you typed is kept. '+
    '<button class="linkbtn" data-act="draftrestore">Restore</button><button class="linkbtn" data-act="draftdiscard">Discard</button></div>';
  renderBody();      // the banner takes room the grid was fitted to: fit it again
}
// a draft saved before jobs could have several services holds one "service" and one "price"
function draftServices(F){
  if(Array.isArray(F.services))return F.services.filter(function(e){return e&&trim(e.type);}).map(function(e){return {type:trim(e.type),description:String(e.description==null?"":e.description),price:priceStr(e.price)};});
  const st=trim(F.service);

// Puts a form (as readForm gives it) into the job sheet that has just been opened. The baseline stays as the fresh snapshot taken in
// openSheet, so the sheet counts as changed and still asks before it closes. Used by Restore (after a logout) and by Quick add's "More details".
function fillSheet(F,o){
  const vals={"f-name":F.name,"f-phone":F.phone,"f-email":F.email,"f-street":F.street,"f-suburb":F.suburb,"f-state":F.state,"f-postcode":F.postcode,
    "f-addr":F.address,"f-notes":F.notes};
  if(S.isMaster){vals["f-date"]=F.date;vals["f-time"]=F.time;vals["f-dur"]=F.dur;vals["f-staff"]=F.staff;}
  Object.keys(vals).forEach(function(id){if(byId(id))setVal(id,vals[id]);});
  if(S.isMaster){SH.clientId=o.clientId||null;SH.client=o.client?Object.assign({},o.client):null;}
  SH.svc=draftServices(F);renderSvcList();renderSvcDetails();
  if(o.addrTouched)SH.addrTouched=true;
  if(SH.clientId&&SH.client&&(!o.job||SH.clientId!==o.job.client_id))loadSites(SH,SH.clientId);      // an open job already fetched its own client's sites
  updateClientHint();updateLinks();renderRecs();
}
async function restoreDraft(){
  const d=readDraft();
  if(!d||d.uid!==S.userId||!d.form){clearDraft();return;}
  if(SH){toast("Close the open job first, then tap Restore.",true);return;}
  let job=null;
  if(d.jobId&&!d.isNew){
    job=S.byId[d.jobId]||null;
    if(!job){      // on another date: go and get it
      try{
        const r=await S.sb.from("jobs").select(JOB_COLS).eq("id",d.jobId).maybeSingle();
        if(r.error)throw r.error;
        job=r.data||null;
      }catch(e){toast("Couldn't get that job back. "+friendly(e),true);return;}
      if(!job){toast("That job isn't there any more, so what you typed can't go back on it. Tap Discard to clear it.",true);return;}
    }
  }
  if(SH)return;
  const F=d.form;
  if(job)openSheet(job,null);
  else openSheet(null,{staff:F.staff||"",date:validYmd(F.date)?F.date:S.date,time:F.time||""});
  if(!SH)return;
  fillSheet(F,{clientId:d.clientId,client:d.client,addrTouched:d.addrTouched,job:job});
  const changed=!!(job&&d.baseUpdatedAt&&job.updated_at&&job.updated_at!==d.baseUpdatedAt);
  showMsg(changed?"You got logged out. Here's what you'd typed. This job was changed since, so check it before you tap Save."
    :"You got logged out. Here's what you'd typed. Check it and tap Save.","warn");
  clearDraft();
}

async function startApp(){
  if(S.starting)return;
  S.starting=true;
  renderBoot("Loading your calendar...");
  try{
    const me=await S.sb.from("staff").select("id,name,role,colour,active").eq("id",S.userId).maybeSingle();
    if(me.error)throw me.error;
    if(!me.data||!me.data.active){S.starting=false;renderNotSetup();return;}
    S.me=me.data;S.isMaster=me.data.role==="master";
    const res=await Promise.all([
      S.sb.from("staff").select("id,name,role,colour,active"),
      S.sb.from("service_types").select("id,name,default_price,xero_description,sort").order("sort",{ascending:true})
    ]);
    if(res[0].error)throw res[0].error;if(res[1].error)throw res[1].error;
    S.staff=sortStaff(res[0].data||[]);S.staffById={};S.staff.forEach(function(s){S.staffById[s.id]=s;});
    S.types=res[1].data||[];S.typesByName={};S.types.forEach(function(t){S.typesByName[t.name]=t;});
    document.body.classList.toggle("is-master",S.isMaster);
    if(!S.isMaster)S.view="day";
    S.date=todayYmd();S.loaded=false;S.loadErr="";S.jobs=[];S.byId={};S.range=null;S.scrollToWork=true;S.lastRenderKey="";
    renderShell();
    S.starting=false;
    subscribe();
    startPoll();
    await fetchJobs(false);
    offerDraft();
  }catch(e){
    S.starting=false;
    renderFatal(friendly(e),true);
  }
}
function stopApp(){
  clearTimeout(S.refetchT);clearInterval(S.pollT);S.pollT=null;clearTimeout(S.tbDateT);S.tbDateT=0;S.tbDateV="";S.tbDateFocus=false;S.lastRenderKey="";
  if(S.channel){try{S.sb.removeChannel(S.channel);}catch(e){}S.channel=null;}
  S.live="";S.jobs=[];S.byId={};S.loaded=false;S.range=null;S.starting=false;
  document.body.classList.remove("is-master");
}

/* =====================================================================
   DATA: fetch, realtime, refetch
   ===================================================================== */
function currentRange(){
  if(S.isMaster&&S.view==="week"){const ws=weekStart(S.date);return {from:ws,to:addDays(ws,6)};}
  return {from:S.date,to:S.date};
}
function setJobs(rows){S.jobs=rows||[];S.byId={};S.jobs.forEach(function(j){S.byId[j.id]=j;});}
async function fetchJobs(silent){
  if(S.screen!=="cal")return;
  if(S.pending>0){scheduleRefetch(500);return;}
  const seq=++S.fetchSeq,range=currentRange();
  if(!silent){S.loaded=false;renderBody();}
  try{
    let q=S.sb.from("jobs").select(JOB_COLS).gte("job_date",range.from).lte("job_date",range.to)
      .order("job_date",{ascending:true}).order("start_time",{ascending:true,nullsFirst:false});
    if(!S.isMaster)q=q.eq("staff_id",S.me.id);
    const r=await q;
    if(seq!==S.fetchSeq)return;
    if(r.error)throw r.error;
    setJobs(r.data||[]);S.range=range;S.loaded=true;S.loadErr="";
    renderBody();
  }catch(e){
    if(seq!==S.fetchSeq)return;
    S.loadErr=friendly(e)+(S.loaded?" Showing what was loaded earlier.":"");
    if(!S.loaded&&!S.jobs.length)S.loaded=false;
    renderBody();
  }
}
function scheduleRefetch(delay){clearTimeout(S.refetchT);S.refetchT=setTimeout(function(){fetchJobs(true);},delay==null?400:delay);}
function subscribe(){
  if(S.channel){try{S.sb.removeChannel(S.channel);}catch(e){}S.channel=null;}
  try{
    S.channel=S.sb.channel("lpc-calendar")
      .on("postgres_changes",{event:"*",schema:"public",table:"jobs"},function(){scheduleRefetch();})
      .on("postgres_changes",{event:"*",schema:"public",table:"job_photos"},function(){if(SH&&SH.jobId)loadPhotos();})
      .subscribe(function(status){S.live=status;updateLive();});
  }catch(e){S.live="";updateLive();}
}
function updateLive(){
  // the Live tag (master) is in the top bar
  const on=S.live==="SUBSCRIBED";
  $$all(".live").forEach(function(l){
    l.className="live"+(on?" on":"");l.textContent=on?"Live":"Not live";
    l.title=on?"Changes from other people show up by themselves.":"Changes show up when you come back to this page.";
  });
}
function startPoll(){
  clearInterval(S.pollT);
  S.pollT=setInterval(function(){if(document.visibilityState==="visible"&&S.screen==="cal")scheduleRefetch(0);},120000);
}

/* =====================================================================
   CALENDAR SHELL, TOOLBAR, BODY

function weekLabel(){const ws=weekStart(S.date),we=addDays(ws,5),y1=parseYmd(ws).getFullYear(),y2=parseYmd(we).getFullYear();return dayShort(ws)+(y1!==y2?" "+y1:"")+" to "+dayShort(we)+" "+y2;}
// the phone toolbar's shorter version: "5 to 10 Oct", or "29 Sep to 4 Oct"
function weekLabelShort(){

  return a.getMonth()===b.getMonth()?a.getDate()+" to "+b.getDate()+" "+MON[b.getMonth()]:a.getDate()+" "+MON[a.getMonth()]+" to "+b.getDate()+" "+MON[b.getMonth()];

// both versions of the date go in; CSS shows the long one on a computer and the short one on a phone
function dlabelHtml(wk){

// New job and Show cancelled. In the toolbar on a computer; on a phone (master) they move under the grid so the grid gets the height.
function extrasHtml(){

    '<label class="chk"><input type="checkbox" data-canc'+(S.showCancelled?" checked":"")+'> Show cancelled</label>';
}
// Is someone typing in the toolbar date box? Chrome moves focus between the day, month and year parts of the box, and for a moment
// document.activeElement reads as <body> in the middle of that (seen on a plain page), so "has focus" is tracked from focusin/focusout.
function dateBoxBusy(){

}
function renderToolbar(){
  const tb=byId("tb");if(!tb)return;

  // Changing the view or tapping a button takes focus off the box first, so those still get the full rebuild.
  if(dateBoxBusy()){

    updateLive();return;

  let h='<div class="tb"><div class="grp">'+

    '<div class="dpick"><div class="dlabel">'+dlabelHtml(wk)+'</div>'+
    '<input class="tbdate" id="tb-date" type="date" value="'+esc(S.date)+'" aria-label="Pick a date"></div>';
  if(S.isMaster){
    h+='<div class="grp" role="group" aria-label="View">'+
      '<button class="tbtn" data-act="viewday" aria-pressed="'+(!wk)+'">Day</button>'+
      '<button class="tbtn" data-act="viewweek" aria-pressed="'+wk+'">Week</button></div>'+
      '<div class="pfilter" id="tbf" hidden></div>'+

// The "who to show" buttons in the toolbar. Drawn again with every body render (the counts change), and first, because the grid is
// fitted to the space left under the toolbar.
function renderFilter(){
  const el=byId("tbf");if(!el)return;
  const act=activeStaff(),bar=el.parentNode;
  if(!filterOn(act)){el.innerHTML="";el.hidden=true;if(bar)bar.classList.remove("hasf");return;}
  const r=currentRange(),all=visibleJobs().filter(function(j){return j.job_date>=r.from&&j.job_date<=r.to;});
  const ae=document.activeElement,had=(ae&&el.contains(ae))?ae.getAttribute("data-who"):null;
  el.innerHTML=phoneFilterHtml(act,all,phoneSolo(act));
  el.hidden=false;if(bar)bar.classList.add("hasf");

}
function bodyHtml(){
  let h="";
  if(S.loadErr)h+='<div class="banner bad">'+esc(S.loadErr)+' <button class="linkbtn" data-act="retry">Try again</button></div>';
  if(!S.loaded){if(!S.loadErr)h+='<div class="boot"><div><span class="spin"></span></div><div>Loading jobs...</div></div>';}
  else if(!S.isMaster)h+=techHtml();
  else if(S.view==="week")h+=weekHtml();
  else h+=dayHtml();
  if(S.isMaster)h+='<div class="tb tbbot">'+extrasHtml()+'</div>';      // only shows on a phone (CSS)
  return h;
}
function renderBody(){
  if(S.dragging||S.pressing){S.dirtyRender=true;return;}     // a finger or mouse is down on a card: don't swap it out from under them
  S.dirtyRender=false;
  const cb=byId("cb");if(!cb||S.screen!=="cal")return;
  renderFilter();      // first: it sits in the toolbar above the grid, so it changes the room the grid has
  const old=byId("gw");const sl=old?old.scrollLeft:0,stp=old?old.scrollTop:0;
  const ot=$(".tray"),tst=ot?ot.scrollTop:0,tsl=ot?ot.scrollLeft:0;
  const key=S.date+"|"+S.view,sameDay=S.lastRenderKey===key;    // the tray only keeps its place on the same day and view
  S.lastRenderKey=key;
  S.winKey=window.innerWidth+"x"+window.innerHeight;
  cb.innerHTML=bodyHtml();
  let gw=byId("gw");
  if(gw){
    // Fit the grid to the screen: measure the room under the toolbar and the grid's own header, then draw again at that scale if it changed.
    const want=fitPpm(gw);
    if(Math.abs(want-S.ppm)>0.002){S.ppm=want;cb.innerHTML=bodyHtml();gw=byId("gw");}
    sizeGrid(gw);
    if(S.scrollToWork&&S.loaded){S.scrollToWork=false;gw.scrollTop=workScroll();gw.scrollLeft=0;}
    else{gw.scrollLeft=sl;gw.scrollTop=stp;}
  }
  const tr=$(".tray");
  if(tr&&sameDay){if(tst)tr.scrollTop=tst;if(tsl)tr.scrollLeft=tsl;}
  updateLive();
}
/* ---------- fitting the grid to the screen ----------
   Pixels per minute = the height left on the screen under the top bar, toolbar, Unassigned row and the grid's own header (names, No time yet),
   divided by the hours shown (7am to 5pm unless a job is outside that). Never under PPM_FLOOR: below that the grid scrolls inside its frame
   (the names stay put) instead of squashing the cards. Worked out again on every render, and on a resize or turning the phone. */
// The + button (master) floats 16px in from the bottom right and is 60px across. From 720px up the page does not scroll, so a grid that runs
// under it could never be uncovered: end that grid above it. (On a phone the page scrolls on past the grid, see body.is-master main, and the
// grid needs every pixel it can get, so it stays as it is.)
const FAB_ROOM=80;
function gapUnderGrid(gw){
  if(isNarrow())return 6;      // the .dayline padding under the grid
  if(S.isMaster&&gw&&gw.getBoundingClientRect().right>(document.documentElement.clientWidth||window.innerWidth)-76)return FAB_ROOM;
  return 14;
}
function fitPpm(gw){
  const head=gw.querySelector(".gtop"),hh=head?head.offsetHeight:0;
  const top=gw.getBoundingClientRect().top+(window.pageYOffset||0);
  const bar=Math.max(0,gw.offsetHeight-gw.clientHeight-2);      // a sideways scroll bar (lots of people on a small screen)
  const span=Math.max(60,S.grid.ge-S.grid.gs);
  const room=window.innerHeight-top-hh-bar-2-gapUnderGrid(gw);
  return Math.max(PPM_FLOOR,Math.min(PPM_MAX,Math.floor(room/span*1000)/1000));
}
function sizeGrid(gw){
  const top=gw.getBoundingClientRect().top+(window.pageYOffset||0);
  const room=Math.max(180,Math.floor(window.innerHeight-top-gapUnderGrid(gw)));      // 180: a phone on its side still gets a usable frame
  gw.style.height="";
  // it fits: the frame is just as tall as the grid. The floor was hit: the frame fills the screen and the grid scrolls inside it.
  if(gw.offsetHeight>room+1)gw.style.height=room+"px";
  S.gridScrolls=!!gw.style.height;      // tick() only scrolls the grid up and down when there is something to scroll
  // the Unassigned list beside the day grid (computer) is no taller than the grid
  const tr=$(".dayline>.tray");
  if(tr){let side=false;try{side=!window.matchMedia("(max-width:900px)").matches&&!tr.classList.contains("row");}catch(e){}tr.style.maxHeight=side?Math.max(240,gw.offsetHeight)+"px":"";}
}
// Only used when the floor was hit and the grid scrolls: start it near the work (now, or the first job), not at the top.
function workScroll(){
  const g=S.grid;let t=WORK_START;
  if(S.view==="day"){
    const jobs=visibleJobs().filter(function(j){return j.job_date===S.date&&tmToMin(j.start_time)!=null;});
    if(S.date===todayYmd()){const n=new Date();t=n.getHours()*60+n.getMinutes()-60;}
    else if(jobs.length){t=Math.min.apply(null,jobs.map(function(j){return tmToMin(j.start_time);}))-30;}
  }else{
    const ws=weekStart(S.date),td=todayYmd();
    if(td>=ws&&td<=addDays(ws,6)){const n=new Date();t=n.getHours()*60+n.getMinutes()-60;}
  }
  return Math.max(0,(t-g.gs)*g.ppm);
}
function onWinResize(){
  if(S.screen!=="cal"||!S.isMaster)return;
  if(S.winKey===window.innerWidth+"x"+window.innerHeight)return;
  renderBody();
}

/* ---------- cards ---------- */
function stLabel(st){return st==="done"?"Done":st==="cancelled"?"Cancelled":"Booked";}
function cardHtml(j,cls,style){
  const s=tmToMin(j.start_time),done=j.status==="done";
  const sub=[suburbOf(j),svcLabel(j,30)].filter(Boolean).join(" · ");

  return '<div class="'+cls+' st-'+esc(j.status)+'" data-job="'+esc(j.id)+'" role="button" tabindex="0" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" style="--sc:'+staffColour(j.staff_id)+';'+(style||"")+'">'+
    '<div class="l1"><span class="tm">'+esc(time)+'</span><span class="te">'+esc(range)+'</span>'+(done?IC.tick:"")+'</div>'+
    '<div class="nm">'+esc(cName(j))+'</div>'+
    '<div class="ds">'+esc(sub)+'</div>'+
    '<span class="stl '+esc(j.status)+'">'+esc(stLabel(j.status))+'</span></div>';
}
function miniHtml(j,tag,extra){
  const tagHtml=tag?'<div class="tag">'+esc(tag)+'</div>':"";
  return cardHtml(j,"jm"+(extra?" "+extra:""),"").replace('<span class="stl',function(){return tagHtml+'<span class="stl';});
}
// what a screen reader says and a mouse hover shows for a job: the lot
function jobTip(j){
  const s=tmToMin(j.start_time),subFull=[suburbOf(j),svcNames(j).join(" + ")].filter(Boolean).join(" · ");
  return cName(j)+(s==null?", no start time":", "+fmtMin(s)+" to "+fmtMin(s+j.duration_min))+(subFull?", "+subFull:"")+", "+stLabel(j.status);
}
// What a timed card has room for (see the .jc CSS), from its height and width in px. Week lanes on a phone are very narrow.
function cardFit(h,w){
  let c=h<30?"tiny":h<46?"short":h<64?"mid":"full";
  if(w<70)c=(h<30?"tiny":"short")+" nw";      // narrow: start time and the first word of the name, the rest is on the job sheet
  if(w<44)c+=" xn";
  return c;
}
// A job on the time grid: "8:00-9:00", client, then suburb and services if there is room. Master gets the stretch handle on the bottom edge.
function gridCardHtml(j,s,dur,fit,style){
  const nw=/\bnw\b/.test(fit),done=j.status==="done",tip=jobTip(j);
  const sb=suburbOf(j),sv=svcLabel(j,34);
  return '<div class="jc '+fit+' st-'+esc(j.status)+'" data-job="'+esc(j.id)+'" role="button" tabindex="0" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" style="--sc:'+staffColour(j.staff_id)+';'+style+'">'+
    '<div class="l1"><span class="tm">'+esc(cardTime(fit,s,dur))+'</span>'+(done?IC.tick:"")+'</div>'+
    '<div class="nm">'+esc(nw?firstWord(cName(j)):cName(j))+'</div>'+
    ((sb||sv)&&!nw?'<div class="ds">'+(sb?'<span class="sb">'+esc(sb)+'</span>':"")+(sb&&sv?'<span class="sep"> · </span>':"")+(sv?'<span class="sv">'+esc(sv)+'</span>':"")+'</div>':"")+
    (S.isMaster?'<div class="rz" aria-hidden="true"></div>':"")+'</div>';
}
// a job as a small chip (no start time yet, and the week's Unassigned row). pre = a grey bit in front (the day and time), label = instead of the client name.
function chipHtml(j,pre,label){
  const tip=jobTip(j);
  return '<div class="jt st-'+esc(j.status)+'" data-job="'+esc(j.id)+'" role="button" tabindex="0" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" style="--sc:'+staffColour(j.staff_id)+'">'+
    (pre?'<span class="ct">'+esc(pre)+'</span>':"")+esc(label||cName(j))+'</div>';
}

/* ---------- day totals: "5 jobs · 7 h" (timed and no-time jobs, cancelled ones left out) ---------- */
function dayTot(list){
  let n=0,min=0;
  list.forEach(function(j){if(j.status==="cancelled")return;n++;min+=Math.max(0,+j.duration_min||0);});
  return {n:n,min:min};
}
function hrsTxt(min){return String(Math.round(min/15)/4);}      // 7, 7.5, 7.25
// short: 0 = "5 jobs · 7 h", 1 (or true) = "5 · 7h", 2 = "5·7h" (a day column of the week on a phone)
function totTxt(t,short){
  if(!t.n)return "";
  if(short===2)return t.n+"·"+hrsTxt(t.min)+"h";
  return short?t.n+" · "+hrsTxt(t.min)+"h":t.n+(t.n===1?" job":" jobs")+" · "+hrsTxt(t.min)+" h";
}
function totHtml(list,short,who){
  const t=dayTot(list);if(!t.n)return "";
  return '<span class="tot" title="'+esc((who?who+": ":"")+totTxt(t,false))+'">'+esc(totTxt(t,short))+'</span>';
}

/* ---------- the time grid (day and week views share it) ---------- */
function isTimed(j){return tmToMin(j.start_time)!=null;}
// The hours shown: 7am to 5pm, stretched (to the hour) to take in any job that starts earlier or runs later.
function gridSpan(list){
  let gs=WORK_START,ge=WORK_END;
  list.forEach(function(j){
    const s=tmToMin(j.start_time);if(s==null)return;
    gs=Math.min(gs,Math.floor(s/60)*60);ge=Math.max(ge,Math.ceil((s+Math.max(+j.duration_min||0,SNAP))/60)*60);
  });
  return {gs:Math.max(0,gs),ge:Math.min(ge,24*60)};
}
// About how wide the grid's columns are in total (px), worked out from the window so the HTML can be built in one go.
function gridWidth(){
  const w=document.documentElement.clientWidth||window.innerWidth||1000,narrow=isNarrow();
  const side=(S.view!=="week"&&w>900)?242:0;      // the Unassigned list beside the day grid on a computer
  return Math.max(120,w-(narrow?16:28)-2-(narrow?36:46)-side);
}
function gutHtml(g,hpx){
  let labels="";
  for(let m=g.gs;m<g.ge;m+=60)labels+='<div class="hl" style="top:'+((m-g.gs)*g.ppm)+'px">'+esc(hourLabel(m))+'</div>';
  return '<div class="gut" style="height:'+hpx+'px">'+labels+'</div>';
}
function nowLineHtml(d,g){
  if(d!==todayYmd())return "";
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  return (m>=g.gs&&m<g.ge)?'<div class="now" style="top:'+((m-g.gs)*g.ppm)+'px"></div>':"";
}
// one person's timed jobs for one day, at their start time and as tall as they are long. Jobs that overlap sit side by side.
function laneCardsHtml(list,g,laneW){
  const items=list.filter(isTimed).map(function(j){
    const s=tmToMin(j.start_time),d=Math.max(+j.duration_min||0,1);
    return {j:j,s:s,d:d,e:s+Math.max(d,SNAP)};
  });
  lanes(items);
  return items.map(function(it){
    const top=(it.s-g.gs)*g.ppm,h=Math.max(it.d*g.ppm-2,16),w=100/it.lanes,gap=laneW/it.lanes<44?1:3;      // the tightest lanes keep every pixel
    return gridCardHtml(it.j,it.s,it.d,cardFit(h,laneW/it.lanes-gap),"top:"+top+"px;height:"+h+"px;left:"+(it.lane*w)+"%;width:calc("+w+"% - "+gap+"px)");
  }).join("");
}

/* ---------- day view ---------- */
function lanes(list){
  list.sort(function(a,b){return a.s-b.s||a.e-b.e;});
  let cluster=[],end=-1;
  function close(){let n=1;cluster.forEach(function(x){n=Math.max(n,x.lane+1);});cluster.forEach(function(x){x.lanes=n;});cluster=[];}
  list.forEach(function(it){
    if(cluster.length&&it.s>=end){close();end=-1;}
    const used=cluster.filter(function(c){return c.e>it.s;}).map(function(c){return c.lane;});
    let l=0;while(used.indexOf(l)>=0)l++;
    it.lane=l;cluster.push(it);end=Math.max(end,it.e);
  });
  if(cluster.length)close();
  return list;
}
// The "who to show" buttons (Both | Mitch | ...): the week view always, the day view on a phone. Two or more people only.
function filterOn(act){return !!S.isMaster&&act.length>=2&&(S.view==="week"||isNarrow());}
// The one person picked with those buttons, or "" for everyone.
function phoneSolo(act){
  if(!filterOn(act))return "";
  return act.some(function(c){return c.id===S.phoneWho;})?S.phoneWho:"";
}
function phoneFilterHtml(act,all,solo){
  if(!filterOn(act))return "";
  let h='<div class="seg" role="group" aria-label="Who to show">'+
    '<button type="button" class="segb" data-act="pwho" data-who="both" aria-pressed="'+(!solo)+'">'+(act.length>2?"All":"Both")+'</button>';
  act.forEach(function(c){
    const n=all.filter(function(j){return j.staff_id===c.id;}).length;
    h+='<button type="button" class="segb" data-act="pwho" data-who="'+esc(c.id)+'" aria-pressed="'+(solo===c.id)+'" aria-label="'+esc(c.name+(n?", "+n+(n===1?" job":" jobs"):""))+'">'+
      '<span class="dot" style="background:'+safeColour(c.colour)+'"></span><span class="nm">'+esc(c.name)+'</span>'+(n?'<span class="n">'+n+'</span>':"")+'</button>';
  });
  return h+'</div>';
}
function dayHtml(){
  const all=visibleJobs().filter(function(j){return j.job_date===S.date;});
  const act=activeStaff(),ids={};act.forEach(function(c){ids[c.id]=true;});

function trayHtml(list){

/* ---------- week view: a time grid, Mon to Sat (Sunday too if it has jobs or is the day picked), one lane per person ---------- */
function weekDays(){
  const ws=weekStart(S.date),days=[];
  for(let i=0;i<6;i++)days.push(addDays(ws,i));
  const sun=addDays(ws,6);
  if(S.date===sun||visibleJobs().some(function(j){return j.job_date===sun;}))days.push(sun);
  return days;
}
function weekHtml(){
  const days=weekDays(),inWk={};days.forEach(function(d){inWk[d]=true;});
  const jobs=visibleJobs().filter(function(j){return inWk[j.job_date];});
  const act=activeStaff(),ids={};act.forEach(function(c){ids[c.id]=true;});

  const onGrid=jobs.filter(function(j){return j.staff_id&&ids[j.staff_id]&&(!solo||j.staff_id===solo);});

  const hpx=(g.ge-g.gs)*g.ppm,hr=60*g.ppm,today=todayYmd();

      if(t.n)pt+='<span class="pl" title="'+esc(c.name+": "+totTxt(t,false))+'"><span class="dot" style="background:'+safeColour(c.colour)+'"></span>'+esc(totTxt(t,2))+'</span>';

      '<b>'+DOW[dd.getDay()]+" "+dd.getDate()+'</b>'+totHtml(mine,dayW<80?2:dayW<150?1:0,"")+(pt?'<span class="ptot">'+pt+'</span>':"")+'</button>';
    strip+='<div class="wdl">';body+='<div class="wday'+(d===today?" today":"")+'">';

        lane.filter(function(j){return !isTimed(j);}).sort(byTime).map(function(j){return chipHtml(j,"",laneW<90?firstWord(cName(j)):"");}).join("")+'</div>';
      body+='<div class="col" data-drop="col" data-staff="'+esc(c.id)+'" data-date="'+esc(d)+'" style="height:'+hpx+'px;--hr:'+hr+'px">'+nowLineHtml(d,g)+laneCardsHtml(lane,g,laneW)+'</div>';

// the week's unassigned jobs as one row of chips ("Tue 9:00 Smith"), in day and time order. Drag one onto the grid to give it a person.
function weekTrayHtml(list){

/* =====================================================================

   ===================================================================== */
const DR={on:false,started:false,id:null,pid:null,sx:0,sy:0,lx:0,ly:0,offX:0,offY:0,w:0,h:0,card:null,ghost:null,mark:null,over:null,raf:0,zoneT:0,pageT:0,trayT:0,touch:false,armT:0,

function onDown(e){
  if(!S.isMaster||S.screen!=="cal"||SH)return;
  // A press that never got its release (the card was swapped out, or the browser lost the touch) must not block dragging for good.
  // The one case we leave alone is a second finger landing during a live drag.
  if(DR.on){
    if(DR.started&&DR.card&&DR.card.isConnected&&e.pointerId!==DR.pid)return;
    endDrag();
  }

  if(t.closest("a,button,input,select,textarea"))return;
  const card=t.closest("[data-job]");if(!card)return;
  const job=S.byId[card.getAttribute("data-job")];if(!job)return;
  const r=card.getBoundingClientRect();
  const rz=!!t.closest(".rz")&&tmToMin(job.start_time)!=null;      // the stretch handle on a timed card's bottom edge
  DR.on=true;DR.started=false;DR.id=job.id;DR.pid=e.pointerId;DR.mode=rz?"resize":"move";
  S.pressing=true;       // from now until release, a refetch must not rebuild the cards
  DR.sx=DR.lx=e.clientX;DR.sy=DR.ly=e.clientY;
  DR.offX=e.clientX-r.left;DR.offY=e.clientY-r.top;DR.w=r.width;DR.h=r.height;DR.card=card;
  DR.touch=e.pointerType==="touch";
  try{card.setPointerCapture(e.pointerId);}catch(err){}
  window.addEventListener("pointermove",onMove,{passive:false});
  window.addEventListener("pointerup",onUp);

  // also listen on the card itself, in case it is ever detached and the release never reaches window
  card.addEventListener("pointerup",onUp);
  card.addEventListener("pointercancel",onCancel);
  if(rz){
    // Stretching: mouse and pen start straight away, a finger presses and holds the handle first (a quick swipe there still scrolls).
    const g=S.grid,col=card.parentNode,cr=col.getBoundingClientRect(),s0=tmToMin(job.start_time),d0=Math.max(+job.duration_min||0,1);
    DR.rzS=s0;DR.rzOrig=d0;DR.rzDur=d0;
    DR.rzOff=(s0+d0)-(g.gs+(e.clientY-cr.top)/g.ppm);      // minutes from the finger to the job's end, so the end doesn't jump to the finger
    if(DR.touch)DR.armT=setTimeout(armResize,HOLD_MS);
    else startResize();
    if(e.cancelable&&!DR.touch)e.preventDefault();      // no text selection while dragging the edge with a mouse
    return;
  }
