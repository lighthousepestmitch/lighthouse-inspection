function loadImg(file){
  return new Promise(function(res,rej){
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im);};
    im.onerror=function(){URL.revokeObjectURL(u);rej(plainErr("Couldn't read that photo."));};
    im.src=u;
  });
}
async function toJpeg(file){
  let src=null;
  try{if(window.createImageBitmap)src=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){src=null;}
  if(!src)src=await loadImg(file);
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
  if(!w||!h)throw plainErr("Couldn't read that photo.");
  const k=Math.min(1,1600/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
  const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cw,ch);cx.drawImage(src,0,0,cw,ch);
  if(src.close){try{src.close();}catch(e){}}
  const blob=await new Promise(function(res){cv.toBlob(res,"image/jpeg",0.82);});
  cv.width=cv.height=0;
  if(!blob)throw plainErr("Couldn't shrink that photo.");
  return blob;
}
async function addPhotos(fileList){
  if(!SH||!SH.jobId||SH.uploading||S.uploads>0)return;
  const files=Array.prototype.slice.call(fileList||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name||"");});
  if(!files.length)return;
  const sh=SH,jobId=sh.jobId,caption=nn(val("f-caption"));
  sh.uploading=true;S.uploads++;updateLinks();      // S.uploads is page-wide, so it still counts after the sheet is closed
  let ok=0,bad=0,unread=0,lastErr="";
  try{
    for(let i=0;i<files.length;i++){
      photoStat(sh,jobId,"Uploading photo "+(i+1)+" of "+files.length+"...");
      let item=null;
      try{
        const blob=await toJpeg(files[i]);
        item={id:uuid(),jobId:jobId,caption:caption,blob:blob,ts:Date.now()};
        await pqPut(item);          // saved on the device first
      }catch(e){unread++;lastErr=friendly(e);continue;}
      try{await uploadOne(item);ok++;}
      catch(e){bad++;lastErr=friendly(e);}
    }
    await afterUploads(sh,jobId,ok,bad,unread,lastErr);
  }finally{
    sh.uploading=false;S.uploads--;
    if(SH)updateLinks();
  }
}
// "Try again (N)": send what is still waiting for this job
async function retryPhotos(){
  const sh=SH;if(!sh||!sh.jobId||sh.uploading||S.uploads>0)return;
  const jobId=sh.jobId;
  let items=[];
  try{items=await pqList(jobId);}catch(e){}
  if(!items.length){refreshPending();return;}
  if(SH!==sh)return;
  sh.uploading=true;S.uploads++;updateLinks();
  let ok=0,bad=0,lastErr="";
  try{
    for(let i=0;i<items.length;i++){
      photoStat(sh,jobId,"Uploading photo "+(i+1)+" of "+items.length+"...");
      try{await uploadOne(items[i]);ok++;}
      catch(e){bad++;lastErr=friendly(e);}
    }
    await afterUploads(sh,jobId,ok,bad,0,lastErr);
  }finally{
    sh.uploading=false;S.uploads--;
    if(SH)updateLinks();
  }
}

/* ----- validation, patches, saving ----- */
// Contact details that would have nowhere to go on a job with no client. Street, suburb, state and postcode only count when the job
// address box is filled in, because with that box empty they are folded into the job address and saved there.
function hasContact(f){return !!(f.phone||f.email||(f.address&&(f.street||f.suburb||f.state||f.postcode)));}
function validate(f){
  if(S.isMaster){
    if(!validYmd(f.date))return "Pick a date for the job.";
    if(!(f.dur>0))return "Pick how long the job takes.";
    if(!SH.clientId&&!f.name&&SH.isNew)return "Type the client's name.";
  }
  // a client-less job can't keep a phone, email or address, so say so instead of saving "Saved" and quietly dropping them
  if(!SH.clientId&&!f.name&&hasContact(f))
    return S.isMaster?"Type the client's name so the phone, email and address have somewhere to save, or clear those boxes."
      :"This job has no client, so phone, email and address can't be saved. Clear those boxes, or ask Mitch to add the client.";
  for(let i=0;S.isMaster&&i<f.services.length;i++){      // (prices are the master's: a worker's sheet has none)
    if(isNaN(parsePrice(f.services[i].price)))return flagMore("The price for "+f.services[i].type+" needs to be a number, like 250 or 250.50.");
  }
  if(f.email&&!looksEmail(f.email))return flagMore("That email address doesn't look right.");
  return "";
}
function buildJobPatch(sh,f,clientId,extra){
  const j=sh.job||{},isNew=sh.isNew,p={};
  if(S.isMaster){
    const staff=f.staff||null;
    if(isNew||staff!==(j.staff_id||null))p.staff_id=staff;
    if(isNew||f.date!==j.job_date)p.job_date=f.date;
    const tm=f.time?minToTm(tmToMin(f.time)):null,otm=j.start_time?minToTm(tmToMin(j.start_time)):null;
    if(isNew||tm!==otm)p.start_time=tm;
    if(isNew||f.dur!==j.duration_min)p.duration_min=f.dur;
    if(isNew||(clientId||null)!==(j.client_id||null))p.client_id=clientId||null;
  }
  // services and service_type are written together, and only when the services or a wording changed. No price goes to the jobs table, ever (it is saved to
  // job_prices by savePrices, master only), so changing only a price sends nothing here.
  const svcNew=canonServices(f.services);
  if(isNew||JSON.stringify(svcNew)!==JSON.stringify(canonServices(loadServices(j)))){
    p.services=svcNew;
    p.service_type=svcNew.length?svcNew.map(function(e){return e.type;}).join(" + "):null;
  }
  // never null out an address nobody touched (a client change blanks the street boxes, but that isn't the person clearing the job address)
  const addr=nn(f.address);if(isNew||(addr!==nn(j.address)&&(addr!==null||sh.addrTouched)))p.address=addr;
  const notes=nn(f.notes);if(isNew||notes!==nn(j.notes))p.notes=notes;
  if(extra)Object.assign(p,extra);
  return p;
}
async function findClientByName(name){
  const r=await colRetry(function(){return S.sb.from("clients").select(clientCols()).ilike("name",escLike(name)).limit(3);});
  if(r.error)throw r.error;
  return r.data||[];
}
async function createClientRow(f){
  const base=slugify(f.name);
  const r=await S.sb.from("clients").select("id").or("id.eq."+base+",id.like."+base+"-*");
  if(r.error)throw r.error;
  const taken={};(r.data||[]).forEach(function(x){taken[x.id]=1;});
  let n=1,id=base;
  for(let attempt=0;attempt<6;attempt++){
    while(taken[id]){n++;id=base+"-"+n;}
    const row={id:id,name:f.name,phone:nn(f.phone),email:nn(f.email),street:nn(f.street),suburb:nn(f.suburb),state:nn(f.state),postcode:nn(f.postcode),source:"calendar"};
    if(!S.noNotesCol&&nn(f.cnotes))row.notes=nn(f.cnotes);
    const ins=await colRetry(function(){if(S.noNotesCol)delete row.notes;return S.sb.from("clients").insert(row);});
    if(!ins.error)return row;
    if(ins.error.code==="23505"){taken[id]=1;continue;}
    throw ins.error;
  }
  throw plainErr("Couldn't find a free id for that new client. Try again.");
}
// rename=true only after the person has said yes to renaming this client (see saveSheet). The name is only sent when it isn't blank.
async function updateClientRow(sh,f,rename){
  const base=sh.client||{},p={};
  ["name","phone","email","street","suburb","state","postcode"].forEach(function(k){
    const nv=nn(f[k]);
    if(k==="name"){if(S.isMaster&&rename&&nv&&nv!==trim(base.name))p.name=nv;return;}
    if(nv!==nn(base[k]))p[k]=nv;
  });
  if(!S.noNotesCol&&f.cnotes!=null){const nv=nn(f.cnotes);if(nv!==nn(base.notes))p.notes=nv;}      // the client's notes go to the client, not the job
  if(!Object.keys(p).length)return;
  const r=await colRetry(function(){
    if(S.noNotesCol)delete p.notes;      // the database has no clients.notes yet: leave it out
    if(!Object.keys(p).length)return Promise.resolve({data:[{id:sh.clientId}],error:null});
    return S.sb.from("clients").update(p).eq("id",sh.clientId).select("id");
  });
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw plainErr("The client details didn't save. You may not be allowed to change this client.");
  Object.assign(sh.client,p);
  if(sh.job&&sh.job.client)Object.assign(sh.job.client,p);
}
function upsertLocal(row){
  const r=currentRange();
  const inR=row.job_date>=r.from&&row.job_date<=r.to&&(S.isMaster||row.staff_id===S.me.id);
  const i=S.jobs.findIndex(function(x){return x.id===row.id;});
  if(inR){if(i>=0)S.jobs[i]=row;else S.jobs.push(row);}else if(i>=0)S.jobs.splice(i,1);
  S.byId={};S.jobs.forEach(function(x){S.byId[x.id]=x;});
  renderBody();
}
async function saveSheet(extra,opts){
  opts=opts||{};
  if(!SH||SH.busy)return false;
  // Everything below reads and writes THIS sheet (sh), even if the screen has moved on by the time a request comes back.
  const sh=SH;

  if(sh.addrPending){

    if(SH!==sh)return false;
    setBusy(false);
  }
  let f=readForm();const bad=validate(f);
  if(bad){showMsg(bad,"bad");return false;}
  setBusy(true);showMsg("Saving...","ok");
  S.pending++;
  let okSave=false,lostContact=false,siteFailed=false,priceMissed=false;
  try{
    // 1. the client
    let clientId=sh.clientId,rename=false;
    if(S.isMaster&&clientId&&sh.client&&f.name&&f.name!==trim(sh.client.name)){
      // The name box was changed on a linked client. Never rename silently: ask.

      else clientId=null;           // Cancel: a new client, made from the fields as they are now (nothing gets blanked)
    }
    if(S.isMaster&&!clientId&&f.name&&sh.unlinked&&f.name.toLowerCase()!==trim(sh.unlinked.client.name).toLowerCase()){
      // Backstop: the client was unlinked earlier and a different name is now typed. Is this just a spelling fix?
      const u=sh.unlinked;

        sh.clientId=clientId=u.client.id;sh.client=Object.assign({},u.client);
        if(SH===sh){Object.keys(u.vals).forEach(function(id){if(!trim(val(id)))setVal(id,u.vals[id]);});f=readForm();}
        sh.unlinked=null;sh.renameTo=f.name;rename=true;
      }
    }
    if(S.isMaster&&!clientId&&f.name){
      if(sh.dupDeclined!==f.name.toLowerCase()){
        const dup=await findClientByName(f.name);
        if(dup.length){
          const d=dup[0];
          if(confirm('There is already a client called "'+d.name+'"'+(d.suburb?" ("+d.suburb+")":"")+".\n\nOK = use that client.\nCancel = add a separate new client.")){
            if(SH===sh){
              applyClient(d,true);

              showMsg("Using the existing client. Check the details, then save again.","warn");
            }
            return false;
          }

        }
      }
      if(sh.quick)quickClientAddr(sh,f);
      const row=await createClientRow(f);
      sh.clientId=clientId=row.id;sh.client=Object.assign({},row);sh.unlinked=null;sh.renameTo=null;
      if(SH===sh)updateClientHint();
    }else if(clientId){
      await updateClientRow(sh,f,rename);
      sh.renameTo=null;
    }
    lostContact=!clientId&&hasContact(f);
    // 2. the job
    // (Booking bar: a job address that was cleared on purpose stays blank. Its hidden client boxes must not put it back.)
    if(!f.address&&!(sh.quick&&sh.addrTouched)){const a=composeAddr(f.street,f.suburb,f.state,f.postcode);if(a){f.address=a;if(SH===sh)setVal("f-addr",a);}}
    const patch=buildJobPatch(sh,f,clientId,extra);
    const pOld=S.isMaster?priceSnap(sh.job):null;      // the prices as they were loaded (master), taken before the job is written
    let row=null;
    if(sh.isNew){
      patch.status=patch.status||"booked";
      const r=await colRetry(function(){return S.sb.from("jobs").insert(patch).select(jobCols()).single();});
      if(r.error)throw r.error;
      row=r.data;
      sh.isNew=false;sh.jobId=row.id;
    }else if(Object.keys(patch).length){
      const r=await colRetry(function(){return S.sb.from("jobs").update(patch).eq("id",sh.jobId).select(jobCols());});
      if(r.error)throw r.error;
      if(!r.data||!r.data.length)throw plainErr("That job didn't save. It may have been deleted or moved to someone else.");
      row=r.data[0];
    }
    if(row){
      if(S.isMaster){if(sh.job)carryPrices(sh.job,row);else setJobPrices(row,null,[],true);}      // the row that comes back has no prices in it: it keeps the ones the old copy had (savePrices brings them up to date next)
      sh.job=row;if(row.client)sh.client=Object.assign({},row.client);
    }
    else if(sh.job&&sh.client){sh.job.client=Object.assign({},sh.job.client||{},sh.client);}

    let priceErr=null;
    if(S.isMaster&&sh.job){try{await savePrices(sh,f,pOld);}catch(e){priceErr=e;}}
    if(sh.job)upsertLocal(sh.job);       // the calendar shows what was written, whether or not this sheet is still open
    if(priceErr){
      // The booking bar: the job IS booked, so a price that didn't save is a warning, not a failed save. (A failed save would put Who, the day and the time back, and the next
      // Save would then move the booked job.) The bar only sends usual prices, so nothing typed is lost.
      if(!opts.quick){if(SH===sh)refreshSheetHead();throw priceErr;}
      priceMissed=true;console.warn("The job is booked, but its price didn't save.",priceErr);
    }
    if(SH===sh)sh.baseline=snap();
    if(sh.svc.length){sh.legacyPrice=null;sh.legacyHeld="";}      // the old price now lives on a saved service
    okSave=true;
    // The job is saved. If its address isn't one of the client's sites yet, add it. A failure here is logged and mentioned, never a failed save.
    try{await saveNewSite(sh,clientId,f.address);}
    catch(e){siteFailed=true;console.warn("The job saved, but its address couldn't be added to the client's sites.",e);}
    scheduleRefetch(300);
  }catch(e){
    if(SH===sh){showMsg(friendly(e),"bad");if(sh.quick)quickNameBack(sh);}
  }finally{
    S.pending--;
    if(SH===sh)setBusy(false);
  }
  if(!okSave)return false;
  clearDraftForJob(sh.jobId);
  const siteNote="The address couldn't be added to their list of sites.",priceNote="The price didn't save. Open the job to add it.";
  if(SH!==sh){toast("Saved"+(priceMissed?". "+priceNote:"")+(siteFailed?". "+siteNote:""),siteFailed||priceMissed);return true;}       // the sheet was closed while this was saving (logged out, for one); the write itself went through
  if(opts.quick){quickDone(sh,opts,siteFailed,siteNote,priceMissed,priceNote);return true;}
  const warn=lostContact?" The phone, email and address weren't saved, because this job has no client.":"",kind=lostContact?"warn":"ok";
  if(opts.fresh){
    // First save of a new job: reopen it as a saved job so photos, paperwork and the done button appear.
    const saved=sh.job;
    closeSheet(true);
    openSheet(saved,null);
    if(SH){SH.moreForce=true;updateMoreRow();}      // Take photo and Choose photos are inside More: open it for this sheet only (the saved shut/open setting is left alone)
    showMsg("Saved."+(S.byId[saved.id]?"":" It is on "+niceDate(saved.job_date)+", so it isn't on this screen.")+warn+" You can add photos now.",kind);
    if(siteFailed)toast(siteNote,true);
  }else if(opts.keepOpen){
    refreshSheetHead();showMsg("Saved."+warn,kind);updateLinks();
    if(siteFailed)toast(siteNote,true);
  }else{
    const jid=sh.job&&sh.job.id,jd=sh.job&&sh.job.job_date;
    closeSheet(true);
    let msg=(!S.isMaster||!jid||S.byId[jid]?"Saved":"Saved. It is on "+niceDate(jd)+", so it isn't on this screen.")+warn;
    if(siteFailed)msg+=(/\.$/.test(msg)?" ":". ")+siteNote;
    toast(msg,lostContact||siteFailed);
  }
  return true;
}
/* XERO (not built yet): a future "make a Xero draft invoice" reads job_prices, never the jobs table: price = the job's total ex GST (null = nothing entered; a price is
   never made up), lines = [{type, price}], one per service in the order of jobs.services; the wording for each invoice line is jobs.services[].description. jobs.price
   and any "price" inside jobs.services are dead (the 08 triggers keep them empty). Only the master can read job_prices, so a draft has to be made from the master's login.
   savePrices (master only): writes the job's prices to job_prices after the job itself saved. old is priceSnap() from before the job was written. It writes only when
   a price (or the list of services the prices sit on) changed, or when the stored row doesn't match the services on screen (a technician can change the services without
   touching job_prices): a save that changes nothing sends nothing. A job with no price left on its form has its row deleted, not kept with nulls, but only when the form
   showed a price to clear: a stored price the form couldn't show (an old job with a price and no service) is never deleted just because the job was saved.
   Never writes to the jobs table. A worker never gets here. */
async function savePrices(sh,f,old){
  if(!S.isMaster||S.noPriceTbl)return;
  const job=sh.job;if(!job||!job.id)return;
  const lines=canonLines(f.services),np={price:sumPrice(lines),lines:lines},empty=pricesEmpty(np),npJ=JSON.stringify(np);
  // nothing entered: there is something to clear only if the form showed a price. Something entered: no write if it is what the form showed and what is stored.
  if(empty?pricesEmpty(old.p):(npJ===JSON.stringify(old.p)&&npJ===JSON.stringify(old.s)))return;
  if(!old.ok)throw plainErr("The job saved, but its prices didn't load earlier, so they can't be saved over now. Close the job, open it again and re-enter the prices.");
  let r;
  try{
    r=empty?await S.sb.from("job_prices").delete().eq("job_id",job.id).select("job_id")
           :await S.sb.from("job_prices").upsert({job_id:job.id,price:np.price,lines:np.lines},{onConflict:"job_id"}).select("job_id");
  }catch(e){r={error:e};}
  if(r.error){
    if(missingTable(r.error,"job_prices")){noPriceTables();return;}      // (the 08 update isn't in: the job is saved, the prices can't be)
    throw plainErr("The job saved, but its prices didn't. "+friendly(r.error)+" Tap Save to try again.");
  }
  if(!empty&&(!r.data||!r.data.length))throw plainErr("The job saved, but its prices didn't. Tap Save to try again.");
  setJobPrices(job,empty?null:np.price,empty?[]:np.lines,true);
}

/* =====================================================================
   JOB LENGTH FROM THE SERVICES, AND THE SERVICES PANEL
   Each service type can have a usual length (service_types.default_minutes, 15 to 720), an add-on time (service_types.addon_minutes, 0 to 720: the minutes it
   adds when it is done on the same visit as another service, blank = its full usual time) and a usual price (a row of service_prices, master only: t._usual). Ticking services sets the job's length by
   the rule in lenRule below (only services that have a usual length count), to the nearest 5 min, 15 to 720. If none of the ticked services has a usual
   length, the length is left as it is. It only does that while the length has not been set by hand on this job (SH.durHand); a job that is already saved
   counts as set by hand, so ticking more services on it never changes its length by itself: the hint under "How long" offers the usual time instead ("Use it").
   ===================================================================== */
/*LEN-BEGIN  pure functions (no page state): the self-test below, and a test page, can run them on their own */
// items = [{m: usual minutes (or none), a: minutes it adds when with another job (or null = its full time)}], one per ticked service.
// Each ticked service is tried as the "main" job (its full time) with every OTHER ticked service adding its add-on time (its full time if blank).
// The shortest of those totals is the job's length: nearest 5 min, 15 to 720. A service with no usual length adds nothing. null = none has one.
function lenRule(items){
  const L=[];
  (items||[]).forEach(function(e){
    const m=e&&e.m;if(!(typeof m==="number"&&isFinite(m)&&m>0))return;
    const a=e.a;L.push({m:m,a:(typeof a==="number"&&isFinite(a)&&a>=0)?a:m});
  });
  if(!L.length)return null;
  let best=Infinity;
  L.forEach(function(main,i){let t=main.m;L.forEach(function(o,k){if(k!==i)t+=o.a;});if(t<best)best=t;});
  return Math.max(MIN_DUR,Math.min(720,Math.round(best/5)*5));
}
// a job length in words for the booking bar: "45 min", "1 hr", "1 hr 20", "2 hr 05"
function fmtLen(m){m=Math.round(m);if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" hr"+(r?" "+pad(r):"");}
// The free gaps in a lane where a job of len minutes fits. busy = [[start,end],...] (minutes, any order, may overlap), the day runs ws to we.
// Each answer is {from,to}: from = the earliest start on the step (15 min) grid, to = the end of the free gap (a job can start anywhere from..to-len).
function fitGaps(busy,len,ws,we,step){
  const iv=(busy||[]).filter(function(b){return b[1]>b[0];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});
  const out=[];let cur=ws;
  const emit=function(a,b){const f=Math.ceil(a/step)*step;if(f+len<=b)out.push({from:f,to:b});};
  for(let i=0;i<iv.length;i++){
    const x=iv[i];
    if(x[1]<=cur)continue;
    if(x[0]>cur)emit(cur,Math.min(x[0],we));
    cur=Math.max(cur,x[1]);
    if(cur>=we)break;
  }
  if(cur<we)emit(cur,we);
  return out;
}
// A tap at raw minute (the time under the finger, not snapped) inside one of those gaps: the start it books, on the step grid, clamped so the job
// still fits in the gap. null = the tap is not in a green block.
function pickStart(gaps,raw,len,step){
  for(let i=0;i<gaps.length;i++){
    const g=gaps[i];
    if(raw>=g.from&&raw<g.to){
      const hi=Math.floor((g.to-len)/step)*step;
      return Math.max(g.from,Math.min(Math.floor(raw/step)*step,hi));
    }
  }
  return null;
}
// Returns a list of what is wrong (empty = all good). Mitch's live values: General Pest 60 (add-on blank), Termite Inspection 60 (adds 45), Rodent 45 (adds 20).
function lenSelfTest(){
  const GP={m:60,a:null},TI={m:60,a:45},RO={m:45,a:20},NO={m:null,a:30},bad=[];
  const eq=function(what,got,want){if(JSON.stringify(got)!==JSON.stringify(want))bad.push(what+": got "+JSON.stringify(got)+", wanted "+JSON.stringify(want));};
  eq("GP alone",lenRule([GP]),60);eq("TI alone",lenRule([TI]),60);eq("Rodent alone",lenRule([RO]),45);
  eq("GP + TI",lenRule([GP,TI]),105);eq("GP + Rodent",lenRule([GP,RO]),80);eq("TI + Rodent",lenRule([TI,RO]),80);eq("GP + TI + Rodent",lenRule([GP,TI,RO]),125);
  eq("order does not matter",lenRule([RO,TI,GP]),125);
  eq("nothing ticked",lenRule([]),null);eq("no usual length at all",lenRule([NO]),null);eq("a service with no length adds nothing",lenRule([GP,NO]),60);
  eq("nearest 5 (62)",lenRule([{m:62,a:null}]),60);eq("nearest 5 (63)",lenRule([{m:63,a:null}]),65);eq("not under 15",lenRule([{m:5,a:null}]),15);eq("not over 720",lenRule([{m:700,a:null},{m:700,a:null}]),720);
  eq("add-on 0 adds nothing",lenRule([GP,{m:30,a:0}]),60);
  eq("label 80",fmtLen(80),"1 hr 20");eq("label 125",fmtLen(125),"2 hr 05");eq("label 105",fmtLen(105),"1 hr 45");eq("label 60",fmtLen(60),"1 hr");eq("label 45",fmtLen(45),"45 min");
  // gaps: a lane with jobs 8:00-9:10, 10:00-11:00 (and one inside it), 15:30-16:30, day 7:00-17:00
  const busy=[[600,660],[480,550],[630,650],[930,990]];
  eq("gaps for 60",fitGaps(busy,60,420,1020,15),[{from:420,to:480},{from:660,to:930}]);
  eq("gaps for 80",fitGaps(busy,80,420,1020,15),[{from:660,to:930}]);
  eq("gaps for 30",fitGaps(busy,30,420,1020,15).map(function(g){return g.from+"-"+g.to;}),["420-480","555-600","660-930","990-1020"]);
  eq("empty day",fitGaps([],125,420,1020,15),[{from:420,to:1020}]);
  eq("full day",fitGaps([[420,1020]],15,420,1020,15),[]);
  eq("job runs past 5pm",fitGaps([[960,1100]],60,420,1020,15),[{from:420,to:960}]);
  eq("job starts before 7am",fitGaps([[360,480]],60,420,1020,15),[{from:480,to:1020}]);
  eq("a gap that starts between steps starts on the next one",fitGaps([[480,550]],60,420,1020,15),[{from:420,to:480},{from:555,to:1020}]);
  eq("exact fit",fitGaps([[420,480],[540,1020]],60,420,1020,15),[{from:480,to:540}]);
  eq("one minute short",fitGaps([[420,480],[539,1020]],60,420,1020,15),[]);
  // taps
  const g=[{from:555,to:640},{from:700,to:1020}];
  eq("tap in first block",pickStart(g,560,60,15),555);
  eq("tap near the end of a block is pulled back so it fits",pickStart(g,635,60,15),570);
  eq("tap snaps down to 15",pickStart(g,730,60,15),720);
  eq("tap outside",pickStart(g,650,60,15),null);
  eq("tap on the block's end edge",pickStart(g,640,60,15),null);
  eq("tap right at the start",pickStart(g,555,60,15),555);
  return bad;
}

// A box was changed: check it, save it straight away (the toast says so), and put the old value back if the save fails. Blank = no usual value (null).
// The usual length and the add-on time are in steps of 5 minutes (15 to 720, and 0 to 720).
async function svcPanelChange(el){
  if(!SV||!el||!el.getAttribute)return;
  const f=el.getAttribute("data-svp-f");if(!f)return;
  const t=S.types[+el.getAttribute("data-i")];if(!t)return;
  // m and a are columns of service_types; the usual price (p) is not: it is a row of service_prices (t._usual in memory)
  const col=f==="m"?"default_minutes":f==="a"?"addon_minutes":null,old=f==="p"?(t._usual==null?null:t._usual):(t[col]==null?null:t[col]),raw=trim(el.value);
  const lo=f==="a"?0:15,msg=f==="a"?"The add-on time has to be between 0 and 720 minutes.":"The usual length has to be between 15 and 720 minutes.";
  let v=null,err="";
  if(raw!==""){
    if(f==="m"||f==="a"){const n=Number(raw);if(!isFinite(n)||n<lo||n>720)err=msg;else v=Math.round(n/5)*5;}
    else{const n=parsePrice(raw);if(isNaN(n))err="The price needs to be a number, like 250 or 250.50.";else v=n;}
  }
  const show=function(x){el.value=x==null?"":String(x);};
  // the browser couldn't read what was typed as a number (el.value is "" then): that is a mistake, not a deliberate blank, so the old value goes back
  if((f==="m"||f==="a")&&el.validity&&el.validity.badInput)err=msg;
  if(err){show(old);toast(err,true);return;}
  show(v);
  if(v===old)return;
  if(f==="p"&&(S.noPriceTbl||S.usualFail)){show(old);return;}      // (the box is switched off then)
  el.disabled=true;
  try{
    let r;
    if(f==="p"){      // blank = no usual price: the row goes, so nothing is ever kept as a made-up zero
      r=v==null?await S.sb.from("service_prices").delete().eq("service_type_id",t.id).select("service_type_id")
               :await S.sb.from("service_prices").upsert({service_type_id:t.id,default_price:v},{onConflict:"service_type_id"}).select("service_type_id");
      if(r.error)throw r.error;
      if(v!=null&&(!r.data||!r.data.length))throw plainErr("That didn't save. You may not be allowed to change services.");
      t._usual=v;      // S.types and S.typesByName hold the same objects
    }else{
      const patch={};patch[col]=v;
      r=await S.sb.from("service_types").update(patch).eq("id",t.id).select("id");
      if(r.error)throw r.error;
      if(!r.data||!r.data.length)throw plainErr("That didn't save. You may not be allowed to change services.");
      t[col]=v;      // S.types and S.typesByName hold the same objects
    }
    toast("Saved");
  }catch(e){
    if(f==="p"&&missingTable(e,"service_prices")){      // the 08 update isn't in: prices go off for the session, quietly, and the panel is drawn again with the box switched off
      noPriceTables();show(old);
      if(SV){const b=$(".shbody"),st=b?b.scrollTop:0;byId("sheet").innerHTML=svcPanelHtml();const b2=$(".shbody");if(b2)b2.scrollTop=st;}
      return;
    }
    const noLen=col==="default_minutes"&&missingCol(e,"default_minutes"),noAdd=col==="addon_minutes"&&missingCol(e,"addon_minutes");
    if(noLen||noAdd){      // the database has no usual lengths (or add-on times) yet: drop them for the session, quietly
      if(noLen)S.noLenCol=true;else S.noAddonCol=true;
      if(SV){const b=$(".shbody"),st=b?b.scrollTop:0;byId("sheet").innerHTML=svcPanelHtml();const b2=$(".shbody");if(b2)b2.scrollTop=st;}
      return;
    }
    show(old);toast("Couldn't save that. "+friendly(e),true);
  }finally{el.disabled=false;}
}

/* =====================================================================
   BOOKING BAR (master only). The + button opens it; it replaces the old Quick add panel, which covered the calendar.
   A slim panel docked to the bottom of the screen for booking a job while on the phone to a customer: pick the client, tick the services, then tap a
   green spot on the calendar above it. The calendar stays live and visible: the grid is fitted to the room above the bar (barMeasure), and the
   bar keeps itself above the phone's keyboard (barPlace, from window.visualViewport).
   It is the same job sheet underneath: the same SH, the same field ids (f-name, f-phone, f-addr ...) and the same save path, so the client type-ahead,
   address lookup, job sites and saving all behave as they do in the full sheet. SH.bar marks it (SH.quick too: the Quick add rules still apply to it).
   The fields that have no box on the front of the bar (time, how long, who, street, suburb ...) are hidden inputs that the chips, the green spots and the
   client pick fill in. Tapping the calendar while the bar is open:
   - a green spot (a gap in that person's day where a job this long fits, 7am to 5pm, today or later): books the job there, at the tapped time snapped to
     15 min and pulled back if need be so it still fits, for that person and day. The Unassigned list is green too: a tap there books it for nobody, no time.
   - anywhere else, with a client and service picked: a short hint (Doesn't fit there). Before that: the slot is remembered (a Book button appears
     once a client and a service are picked, and the green spots show as well).
   Opened by tapping an empty slot (bar closed): the same, with that day, time and person already set.
   ===================================================================== */

  quickUnlink();setVal("f-name","");hideNameList();quickSync();
  const n=byId("f-name");if(n){try{n.focus();}catch(e){}}
}
// A brand new client with a street address typed (or picked) for the job but none of their own: the client gets that address too, the same as
// picking it from the lookup does. A bare suburb doesn't count (the job keeps it, the client doesn't).
function quickClientAddr(sh,f){
  if(f.street||f.suburb||f.state||f.postcode||!f.address)return;
  const p=sh.addrPick&&normAddr(sh.addrPick.line)===normAddr(f.address)?sh.addrPick:splitAddr(f.address);
  if(!hasStreetNumber(p.street))return;
  f.street=p.street;f.suburb=p.suburb;f.state=p.state;f.postcode=p.postcode;
}
// "Use that client" (the name matched one already on file): the boxes were filled for a NEW client, and the bar shows no address boxes to check unless Edit is
// open, so nothing from them may be written over the existing client's record on the next save. Their address goes back to what is on file. Phone and email
// do too when the record has one (the summary shows what is kept, and Edit changes it); a typed one only stays where the record has nothing.
function quickTakeClient(c){
  ["street","suburb","state","postcode"].forEach(function(k){setVal("f-"+k,c[k]);});
  ["phone","email"].forEach(function(k){if(trim(c[k]))setVal("f-"+k,c[k]);});
  quickSync();
}
// A quick save failed. If a name was typed for the next caller while it was saving, it goes back to this booking's name, so that tapping Save
// again can't book this job under someone else's name.
function quickNameBack(sh){
  if(SH!==sh||sh.saveName==null||trim(val("f-name"))===sh.saveName)return;
  setVal("f-name",sh.saveName);hideNameList();quickSync();
  const m=byId("sh-msg"),t=m?trim(m.textContent):"";
  showMsg((t?t+" ":"")+"The name you typed was put back to this booking's. Tap Save to try again.","bad");
}
async function quickSave(){
  const sh=SH;if(!sh||!sh.quick||sh.busy)return false;
  const f=readForm();
  if(!sh.clientId&&!f.name){showMsg("Type the client's name.","bad");const n=byId("f-name");if(n){try{n.focus();}catch(e){}}return false;}
  if(!sh.svc.length){showMsg("Tap at least one service.","bad");return false;}
  sh.saveName=f.name;      // the name this booking is for: a different one in the box when the save is done was typed for the next caller
  return saveSheet(null,{quick:true});
}
// after a good save (called from saveSheet): a toast, a clean bar for the next booking (who is kept), and a Done link to close it
function quickDone(sh,opts,siteFailed,siteNote,priceMissed,priceNote){
  const j=sh.job||{},nm=trim((sh.client&&sh.client.name)||val("f-name")),s=tmToMin(j.start_time);
  const msg="Booked: "+nm+", "+dayLbl(j.job_date)+(s!=null?" "+fmtMin(s):"");
  quickReset(sh);
  SH.booked=true;barRefresh();      // the status line says so, with a Done link, until the next tap or key
  toast(msg+(priceMissed?". "+priceNote:"")+(siteFailed?". "+siteNote:""),siteFailed||!!priceMissed);
}
// A clean bar: the same Who (what was picked before a green spot set it for that spot's person). The boxes are cleared in place (not rebuilt), so the
// client box keeps its focus and the keyboard stays up if it was.
function quickReset(old){
  clearTimeout(old.sT);clearTimeout(old.acT);clearTimeout(old.hintT);if(old.acAbort){try{old.acAbort.abort();}catch(e){}}
  // a name may have been typed for the next caller while the save was running. That one stays.
  const typed=val("f-name"),keepName=(old.saveName!=null&&trim(typed)!==old.saveName)?typed:"";
  const who=old.whoKeep!=null?old.whoKeep:(val("f-staff")||"");
  const day=barDayDefault(old);      // the same rule as the first booking: the day on screen (or today), unless a day is picked by hand
  SH=quickState(quickInit({date:day,time:"",staff:who}),old.prevFocus);
  SH.bmore=old.bmore;SH.dayAuto=old.dayAuto;
  ["f-name","f-phone","f-email","f-street","f-suburb","f-state","f-postcode","f-addr","f-time","f-notes","f-cnotes"].forEach(function(id){setVal(id,"");});
  setVal("f-staff",who);setVal("f-date",SH.init.date);setVal("f-dur",String(SH.init.dur));      // the last booking's automatic length must not carry over to the next one
  hideNameList();hideAddrList();renderSites();
  quickRenderSvc();      // (this also clears the status line and takes the green spots off)
  const tr=byId("q-times");if(tr)tr.scrollLeft=0;
  const b=byId("q-body");if(b)b.scrollTop=0;
  SH.baseline=snap();
  try{if(window.matchMedia&&matchMedia("(pointer:fine)").matches){const n=byId("f-name");if(n)n.focus({preventScroll:true});}}catch(e){}
  if(keepName){setVal("f-name",keepName);onNameInput();}      // onNameInput brings up the new-client note and the type-ahead for it
}
// "More details" (in More): the full job sheet, with what has been typed so far filled in
async function quickMore(){
  const q=SH;if(!q||!q.quick||q.busy)return;
  if(q.addrPending){      // an address was only just tapped: let Google's details land first (two seconds at most), so they come across too
    setBusy(true);showMsg("Getting the address details...","ok");
    await waitAddrPending(q,ADDR_SAVE_WAIT);
    if(SH!==q)return;
    setBusy(false);showMsg("");
  }
  if(q.busy)return;
  const F=readForm();
  if(!q.clientId&&F.name)quickClientAddr(q,F);      // a new client gets the same contact address from Save as from More details then Save, and the full sheet's boxes show it
  const keep={clientId:q.clientId,client:q.client,addrTouched:q.addrTouched,addrAuto:q.addrAuto,addrPick:q.addrPick,preferAddr:q.preferAddr,svcMemo:q.svcMemo};
  closeSheet(true,true);      // (the view the bar switched to Week goes back: the full sheet is not part of that)
  openSheet(null,{staff:F.staff,date:validYmd(F.date)?F.date:S.date,time:F.time});
  if(!SH)return;
  fillSheet(F,{clientId:keep.clientId,client:keep.client,addrTouched:keep.addrTouched,job:null});
  SH.addrAuto=keep.addrAuto;SH.addrPick=keep.addrPick;SH.preferAddr=keep.preferAddr;SH.svcMemo=keep.svcMemo;
}

/* ----- the status line, the Book button and the green spots ----- */
// a client (or a name typed for a new one) and at least one service are picked
function barReady(){return !!SH&&!!SH.bar&&(!!SH.clientId||!!trim(val("f-name")))&&SH.svc.length>0;}
function barLen(){const d=parseInt(val("f-dur"),10);return d>0?d:QUICK_DUR;}
// the time already chosen (a tap on an empty slot opened the bar, or a time chip): {staff, date, min}, or null
function barSlot(){
  const tm=val("f-time"),d=val("f-date");
  if(!tm||!validYmd(d)||tmToMin(tm)==null)return null;
  return {staff:val("f-staff")||"",date:d,min:tmToMin(tm)};
}
function slotTxt(sl){const st=sl.staff&&S.staffById[sl.staff];return dayLbl(sl.date)+" "+fmtMin(sl.min)+(st?", "+st.name:"");}
function barButtons(){
  if(!SH||!SH.bar)return;
  const dis=!!SH.busy||!barReady();
  ["sh-save","q-book"].forEach(function(id){const b=byId(id);if(b)b.disabled=dis;});
}
function barRefresh(){
  if(!SH||!SH.bar)return;
  const rdy=barReady(),L=barLen(),sl=barSlot(),n=barPaint();
  let txt,cls="",html=null;
  if(SH.hint){txt=SH.hint;cls="warn";}
  else if(SH.booked&&!rdy){txt="Booked. Book another, or Done";cls="rdy";html='<span>Booked. Book another, or</span> <button type="button" class="linkbtn" data-sh="close">Done</button>';}
  else if(!rdy)txt=(sl?slotTxt(sl)+" · ":"")+"Pick a client and a service";
  else if(!S.loaded)txt=fmtLen(L);
  else{
    const sv=canonLines(SH.svc),sm=sumPrice(sv),pr=(sm!=null&&!sv.some(function(e){return e.price==null||isNaN(e.price);}))?" · $"+(Math.round(sm)===sm?sm:sm.toFixed(2)):"";      // the price when every ticked service has one
    if(n>0){txt=fmtLen(L)+pr+" · tap a green spot";cls="rdy";}
    else txt=fmtLen(L)+pr+" · no gap that long on these days";
  }
  const st=byId("q-stat"),sig=cls+"|"+txt;
  if(st&&SH.statSig!==sig){SH.statSig=sig;st.className="barstat"+(cls?" "+cls:"");st.innerHTML=html||((cls==="rdy"?'<span class="sw" aria-hidden="true"></span>':"")+"<span>"+esc(txt)+"</span>");}
  const bk=byId("q-book");
  if(bk){bk.hidden=!sl;if(sl){const t="Book "+slotTxt(sl);if(bk.textContent!==t)bk.textContent=t;}}
  // Save with no time says the day and the person it books for (they are in More and the Who row, which can be scrolled out of sight). With a time chosen, the Book button beside it says it.
  const ns=byId("sh-save");
  if(ns){const t=barNoTimeTxt(sl);if(ns.textContent!==t)ns.textContent=t;}
  barButtons();
}
// the label on the Save with no time button: "Save Wed 7, Mitch, no time" (Unassigned when nobody is picked)
function barNoTimeTxt(sl){
  if(sl)return "Save, no time";
  const d=val("f-date"),st=S.staffById[val("f-staff")||""];
  return "Save "+(validYmd(d)?dayLbl(d)+", ":"")+(st?st.name:"Unassigned")+", no time";
}
// a short note in the status line for a few seconds
function barHint(text){
  if(!SH||!SH.bar)return;
  clearTimeout(SH.hintT);SH.hint=text;barRefresh();
  const sh=SH;sh.hintT=setTimeout(function(){sh.hint="";if(SH===sh)barRefresh();},3400);
}
// every non-cancelled timed job, as busy minutes per person and day: {"staffId|2026-10-07": [[start,end],...]}
function busyMap(){
  const m={};
  S.jobs.forEach(function(j){
    if(j.status==="cancelled"||!j.staff_id)return;
    const s=tmToMin(j.start_time);if(s==null)return;
    const k=j.staff_id+"|"+j.job_date;(m[k]||(m[k]=[])).push([s,s+Math.max(+j.duration_min||0,1)]);
  });
  return m;
}
// The earliest a job can start on a day: 7am, or for today the time now rounded up to the next 15 minutes. A time that has gone is never green, and a tap can't book it.
function barStart(date){
  if(date!==todayYmd())return WORK_START;
  const n=new Date();
  return Math.max(WORK_START,Math.ceil((n.getHours()*60+n.getMinutes())/SNAP)*SNAP);
}
const BP={rid:-1,key:"",n:0};      // what the last barPaint drew (so it isn't drawn again for nothing), and how many green blocks that was
// Draws the green spots (one translucent block per free gap, per person's column, on the day and week grids), the marker for a time already chosen, and
// greens the Unassigned list. The green spots come from the jobs already loaded. Every redraw of the page body (renderBody) wipes them, so that calls this
// again (S.rid counts the redraws). Returns the number of green blocks.
function barPaint(){
  const cb=byId("cb");if(!cb)return 0;
  const on=!!SH&&!!SH.bar&&S.isMaster&&S.screen==="cal"&&S.loaded;
  const rdy=on&&barReady(),L=barLen(),sl=on?barSlot():null;
  const key=(rdy?"r"+L:"n")+"|"+(sl?sl.staff+"@"+sl.date+"@"+sl.min:"")+"|"+(on?1:0)+"|"+barStart(todayYmd());      // (today's green starts at the time now, so it is drawn again once that moves on)
  if(BP.rid===S.rid&&BP.key===key)return BP.n;
  BP.rid=S.rid;BP.key=key;BP.n=0;
  cb.querySelectorAll(".gspot,.bkmark").forEach(function(n){if(n.parentNode)n.parentNode.removeChild(n);});
  const tr=cb.querySelector(".tray");if(tr)tr.classList.remove("barok");
  if(!on)return 0;
  const g=S.grid,today=todayYmd(),cols=$$all("#cb .col");
  let n=0;
  if(rdy){
    const busy=busyMap();
    cols.forEach(function(col){
      const d=col.getAttribute("data-date"),sid=col.getAttribute("data-staff");
      if(!d||d<today)return;      // a day that has gone gets no green
      const f=document.createDocumentFragment();
      fitGaps(busy[sid+"|"+d]||[],L,barStart(d),WORK_END,SNAP).forEach(function(gp){
        const el=document.createElement("div");el.className="gspot";el.setAttribute("aria-hidden","true");
        el.style.top=((gp.from-g.gs)*g.ppm)+"px";el.style.height=((gp.to-gp.from)*g.ppm)+"px";
        f.appendChild(el);n++;
      });
      col.appendChild(f);
    });
    if(tr&&barTrayDate())tr.classList.add("barok");      // (not on a day or a week that has gone: a tap there only says so)
  }
  if(sl){
    cols.forEach(function(col){
      if(col.getAttribute("data-date")!==sl.date||(col.getAttribute("data-staff")||"")!==sl.staff)return;
      const el=document.createElement("div");el.className="dropmark bkmark";el.setAttribute("aria-hidden","true");
      el.style.top=((sl.min-g.gs)*g.ppm)+"px";el.style.height=Math.min(Math.max(L*g.ppm,16),Math.max(16,(g.ge-sl.min)*g.ppm))+"px";
      el.textContent=S.view==="week"?hm(sl.min):fmtMin(sl.min);
      col.appendChild(el);
    });
  }
  BP.n=n;return n;
}
/* ----- placing the job ----- */
// Books the job: who (a person, or "" = nobody), the day, and min (minutes, or null = no start time). The same save as every other quick save.
async function barBook(staff,date,min){
  const sh=SH;if(!sh||!sh.bar||sh.busy||!barReady())return;
  const was={staff:val("f-staff")||"",date:val("f-date"),time:val("f-time")};
  sh.whoKeep=was.staff;      // Who stays as it was picked after this: a green spot in someone else's column doesn't change it
  setVal("f-staff",staff||"");setVal("f-date",date);setVal("f-time",min==null?"":minToHM(min));
  quickSync();
  let ok=false;
  try{ok=await quickSave();}catch(e){console.warn("The booking didn't save.",e);}
  // It didn't go through (no signal ...): Who, the day and the time go back to what they were before the tap, so that tapping Save (or Save with no time) next
  // doesn't book for the spot's person and day, which is out of sight on a phone. Not when the job did get booked (sh.isNew is false once the insert is in): then these
  // ARE the job's person, day and time, and putting the old ones back would make the next Save move it.
  if(!ok&&SH===sh&&sh.isNew){setVal("f-staff",was.staff);setVal("f-date",was.date);setVal("f-time",was.time);sh.whoKeep=null;quickSync();}
}
// A tap on a person's column (day or week) while the bar is open. raw = the minute under the finger (not snapped).
function barGridTap(staff,date,raw){
  const sh=SH;if(!sh||!sh.bar||sh.busy)return;
  const g=S.grid;
  if(!barReady()){      // nothing to book yet: remember this slot. Once a client and a service are picked it shows as a Book button, and the green spots show too.
    const min=Math.max(g.gs,Math.min(Math.floor(raw/SNAP)*SNAP,g.ge-SNAP));
    barPreset({staff:staff,date:date,time:minToHM(min),exact:true});
    return;
  }
  const L=barLen(),start=date<todayYmd()?null:pickStart(fitGaps(busyMap()[staff+"|"+date]||[],L,barStart(date),WORK_END,SNAP),raw,L,SNAP);
  if(start==null){barHint("Doesn't fit there. Tap a green spot, or drag it later.");return;}
  barBook(staff,date,start);
}
// the day a tap on the Unassigned list books for: the day on screen (day view), or the bar's day if it is in this week and hasn't gone (week view)
function barTrayDate(){
  const today=todayYmd();
  if(S.view!=="week")return S.date>=today?S.date:null;
  const days=weekDays().filter(function(d){return d>=today;}),cur=val("f-date");
  return days.indexOf(cur)>=0?cur:(days[0]||null);
}
function barTrayTap(){
  const sh=SH;if(!sh||!sh.bar||sh.busy||!barReady())return;
  const d=barTrayDate();
  if(!d){barHint("That day has gone. Pick a day that hasn't.");return;}
  barBook("",d,null);
}
// Who, day and time set from a tap on the grid or a "+ Add" (and the bar already open). Past days are kept when o.exact (a tap on a column).
function barPreset(o){
  if(!SH||!SH.bar)return;
  SH.booked=false;
  if(o.staff!==undefined)setVal("f-staff",o.staff||"");
  if(validYmd(o.date)){setVal("f-date",(!o.exact&&o.date<todayYmd())?todayYmd():o.date);SH.dayHand=true;}
  if(o.time!==undefined)setVal("f-time",o.time||"");
  quickSync();
}
// while the bar is open and the day on screen changes, the bar's day follows it (until a day has been picked by hand)
function barFollowDay(){if(!SH||!SH.bar||SH.dayHand)return;setVal("f-date",barDayDefault(SH));quickSync();}
// The day the bar books on when no day has been picked by hand: today or the day on screen (quickDayDefault). The one exception is the day that was open in Day view
// when a computer was switched to Week for the bar: that day stays while its week is the one showing, and goes the moment another week is.
function barDayDefault(sh){
  if(sh&&sh.dayAuto){
    if(S.view==="week"&&weekStart(S.date)===weekStart(sh.dayAuto)&&sh.dayAuto>=todayYmd())return sh.dayAuto;
    sh.dayAuto="";
  }
  return quickDayDefault();
}

/* ----- the bar's place on the screen ----- */
// Scrolls the bar's body so el is at the top of it
function barScrollTo(el){
  const body=byId("q-body");if(!body||!el)return;
  body.scrollTop=Math.max(0,el.getBoundingClientRect().top-body.getBoundingClientRect().top+body.scrollTop-4);
}
// Is a box in the part of the bar that scrolls (More: phone, address, email, notes ...) the one being typed in? Then html.bar-edit is on, and with the keyboard up the CSS gives the
// bar the room above it. A box that has just been tapped is scrolled into the room it now has.
function barEditFlag(){
  const ae=document.activeElement,on=!!(SH&&SH.bar&&ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.closest&&ae.closest("#q-body")),de=document.documentElement,was=de.classList.contains("bar-edit");
  de.classList.toggle("bar-edit",on);
  if(on&&!was){
    setTimeout(function(){
      if(!SH||!SH.bar||document.activeElement!==ae)return;
      const body=byId("q-body");if(!body)return;
      const b=body.getBoundingClientRect(),r=ae.getBoundingClientRect();
      if(r.top<b.top||r.bottom>b.bottom)barScrollTo(ae.closest(".fld")||ae);
    },80);
  }
}
// Keeps the bar just above the phone's keyboard (the keyboard shrinks the visual viewport, not the page), and gives it a maximum height of 45% of what is
// visible (--vvh).
function barPlace(){
  const b=byId("bar");if(!b||!SH||!SH.bar)return;
  const vv=window.visualViewport;let bottom=0,vh=window.innerHeight;
  if(vv&&vv.scale<1.05){vh=vv.height;bottom=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));}
  b.style.bottom=bottom+"px";b.style.setProperty("--vvh",Math.round(vh)+"px");
  document.documentElement.classList.toggle("kb-open",bottom>80);
}
// How much of the bottom of the screen the bar takes: its content height, up to its maximum (45% of the screen on a phone), and NOT shrunk by the keyboard
// (so the calendar doesn't jump about while someone types). The grid is fitted to the rest (viewH).
function barMeasure(){
  const b=byId("bar");let h=0;
  if(b&&SH&&SH.bar){
    const head=$(".barhead",b),inner=byId("q-inner"),foot=$(".barfoot",b);
    const nat=(head?head.offsetHeight:0)+(inner?inner.offsetHeight:0)+4+(foot?foot.offsetHeight:0)+(parseFloat(getComputedStyle(b).paddingBottom)||0)+1;
    const cap=isNarrow()?Math.max(150,Math.floor(window.innerHeight*.45)):Math.min(Math.floor(window.innerHeight*.44),400);      // the same numbers as .bar's max-height in the CSS (the keyboard's smaller --vvh doesn't count: the calendar mustn't jump about while someone types)
    h=Math.min(nat,cap);
  }
  S.barH=h;document.documentElement.style.setProperty("--barh",h+"px");
  return h;
}
let barRO=null,barVv=false,barRefitT=0;
function barRefit(){
  barRefitT=0;
  if(!SH||!SH.bar)return;
  const old=S.barH;barMeasure();
  if(Math.abs(S.barH-old)>2)renderBody();      // the room above the bar changed: fit the grid again
}
function barRefitSoon(){clearTimeout(barRefitT);barRefitT=setTimeout(barRefit,90);}
function barWatch(on){
  const vv=window.visualViewport;
  if(on){
    if(vv&&!barVv){vv.addEventListener("resize",barPlace);vv.addEventListener("scroll",barPlace);barVv=true;}
    if(window.ResizeObserver&&!barRO){
      try{
        barRO=new ResizeObserver(barRefitSoon);
        const b=byId("bar");["q-inner"].forEach(function(id){const e=byId(id);if(e)barRO.observe(e);});
        if(b){const h=$(".barhead",b),f=$(".barfoot",b);if(h)barRO.observe(h);if(f)barRO.observe(f);}
      }catch(e){barRO=null;}
    }
    window.addEventListener("resize",barRefitSoon);window.addEventListener("resize",barPlace);
  }else{
    if(vv&&barVv){vv.removeEventListener("resize",barPlace);vv.removeEventListener("scroll",barPlace);barVv=false;}
    if(barRO){try{barRO.disconnect();}catch(e){}barRO=null;}
    clearTimeout(barRefitT);barRefitT=0;
    window.removeEventListener("resize",barRefitSoon);window.removeEventListener("resize",barPlace);
  }
}
// The bar is going: tidy up and give the calendar its room back. A view that was switched to Week for the bar goes back, except on a logout (force without
// restore), where the screen is being torn down and nothing is redrawn or fetched. "More details" is a force that does restore.
function barClose(force,restore){
  clearTimeout(SH.hintT);
  const pf=SH.prevFocus;
  SH=null;
  barWatch(false);
  const b=byId("bar");if(b){b.innerHTML="";b.hidden=true;b.style.bottom="";b.style.removeProperty("--vvh");}
  const de=document.documentElement;de.classList.remove("qa-open","bar-open","kb-open","bar-edit");
  S.barH=0;de.style.setProperty("--barh","0px");
  let nav=false;
  if(S.barPrevView){const v=S.barPrevView;S.barPrevView=null;if((!force||restore)&&S.view!==v){S.view=v;nav=true;}}
  if(nav)afterNav();else renderBody();
  if(pf&&pf.focus&&document.contains(pf)){try{pf.focus({preventScroll:true});}catch(e){}}
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function handleSheetAction(a,e){
  const k=a.getAttribute("data-sh");
  if(SH&&SH.quick&&k!=="qbook"&&k!=="qnotime")quickClearMsg();
  if(k==="close"){closeSheet(false);}
  else if(k==="save"){doSave();}
  else if(k==="done"||k==="undone"||k==="cancel"||k==="reopen"){setStatus(k);}
  else if(k==="delete"){deleteJob();}
  else if(k==="pickclient"){
    if(SH.quick&&SH.busy)return;      // a quick save is running: a pick now would be wiped by the reset that follows it
    const c=SH.nameResults[+a.getAttribute("data-i")];if(c)applyClient(c,false,SH.nameMatch[c.id]||"");
    if(c&&SH.quick){const n=byId("f-name");if(n)n.blur();}      // put the keyboard away so the services and times are in view
  }
  else if(k==="pickaddr"){pickAddr(+a.getAttribute("data-i"));}
  else if(k==="picksite"){pickSite(+a.getAttribute("data-i"));}
  else if(k==="svcmore"){
    SH.svcMore=!SH.svcMore;renderSvcList();
    const b=$('#sv-list [data-sh="svcmore"]');if(b){try{b.focus({preventScroll:true});}catch(x){}}
  }
  else if(k==="diffclient"){diffClient();}
  else if(k==="sameclient"){sameClient();}
  else if(k==="retryphotos"){retryPhotos();}
  else if(k==="more"){toggleMore();}
  else if(k==="cnedit"||k==="cnadd"){openCNotes();}
  else if(k==="uselen"){setDur(usualLen(SH.svc));updateLenHint();updateLinks();}
  else if(k==="qwho"||k==="qday"||k==="qtime"){quickSet(k,a);}
  else if(k==="qsvc"){quickToggleSvc(a.getAttribute("data-v"));}
  else if(k==="qsvcmore"){SH.svcMore=!SH.svcMore;quickRenderSvc();}
  else if(k==="qmoretog"){
    SH.bmore=!SH.bmore;quickSync();
    if(SH.bmore){const body=byId("q-body"),mp=byId("q-more");if(body&&mp)body.scrollTop=Math.max(0,mp.getBoundingClientRect().top-body.getBoundingClientRect().top+body.scrollTop-4);}      // bring what opened to the top of the bar
  }
  else if(k==="qopenmore"){SH.bmore=true;quickSync();const p=byId("f-phone");if(p){try{p.focus();}catch(x){}}}
  else if(k==="qedit"){SH.qEdit=!SH.qEdit;if(SH.qEdit)SH.bmore=true;quickSync();}
  else if(k==="qchange"){quickChangeClient();}
  else if(k==="qbook"){SH.whoKeep=null;quickSave();}
  else if(k==="qnotime"){SH.whoKeep=null;setVal("f-time","");quickSync();quickSave();}
  else if(k==="qmore"){quickMore();}
}
function handleAct(k,el){
  // a button tap must take focus off the toolbar date box first (Safari doesn't always do it), so a half-typed date is applied
  // and the toolbar is allowed to rebuild
  const tbd=byId("tb-date");if(tbd&&S.tbDateFocus){tbd.blur();S.tbDateFocus=false;}
  if(k==="menu"){if(S.menuOpen)closeMenu(true);else openMenu();return;}
  if(S.menuOpen)closeMenu();      // any other tap on a menu item shuts the menu first
  if(k==="signout")signOut();
  else if(k==="togglecanc"){S.showCancelled=!S.showCancelled;savePrefs();const mi=$('#menu [data-act="togglecanc"]');if(mi)mi.setAttribute("aria-checked",S.showCancelled?"true":"false");renderBody();}
  else if(k==="svcpanel")openSvcPanel();
  else if(k==="restart"){S.starting=false;if(S.userId)startApp();else renderLogin("","");}
  else if(k==="reload"){location.reload();}
  else if(k==="reboot"){checkSession();}
  else if(k==="draftrestore"){restoreDraft();}
  else if(k==="draftdiscard"){clearDraft();}
  else if(k==="sendlink")sendLink();
  else if(k==="prev")go(-1);
  else if(k==="next")go(1);
  else if(k==="today"){S.date=todayYmd();afterNav();}
  else if(k==="viewday"){S.barPrevView=null;setView("day");}      // (a view picked by hand stays when the booking bar closes)
  else if(k==="viewweek"){S.barPrevView=null;setView("week");}
  else if(k==="qadd"){if(Date.now()<S.noClickUntil)return;openQuick(el.hasAttribute("data-staff")?{staff:el.getAttribute("data-staff"),date:el.getAttribute("data-date")||S.date,time:""}:{});}      // not the click that ends a drag onto an empty strip
  else if(k==="pwho")setPhoneWho(el.getAttribute("data-who"));
  else if(k==="godate"){S.barPrevView=null;S.view="day";savePrefs();gotoDate(el.getAttribute("data-date"));}
  else if(k==="retry"){S.loadErr="";fetchJobs(false);}
}
function onClick(e){
  const t=e.target;if(!t||!t.closest)return;
  if(S.menuOpen&&!t.closest("#menu,#menu-btn")){closeMenu();return;}      // a tap away from the open menu just shuts it
  if(SV){svcPanelClick(t);return;}
  const sh=t.closest("[data-sh]");
  if(sh&&SH){e.preventDefault();handleSheetAction(sh,e);return;}
  if(SH&&!SH.bar){
    if(t.id==="sh-back"&&SH.back){closeSheet(false);}
    // Service record and Termite inspection open in this same tab. (Maps opens in its own tab, so the sheet and the day are never lost to it.)
    const lk=t.closest("#ln-rec,#ln-insp");
    if(lk){
      if(S.uploads>0&&!confirm("Photos are still uploading. If you leave now, the rest won't be saved. Leave anyway?")){e.preventDefault();return;}
      if(S.uploads<=0&&SH.pendingN>0&&!confirm("Some photos haven't uploaded yet. They stay saved on this device and you can send them the next time you open this job. Leave anyway?")){e.preventDefault();return;}
      if(isDirty()&&!confirm("You have changes that are not saved. Leave without saving?"))e.preventDefault();
    }
    return;
  }
  const act=t.closest("[data-act]");
  if(act){handleAct(act.getAttribute("data-act"),act);return;}
  if(t.closest("a"))return;
  if(t.closest(".rz"))return;      // the stretch handle never opens the job
  const card=t.closest("[data-job]");
  if(card){
    if(Date.now()<S.noClickUntil)return;
    // Booking bar open: a short job is drawn taller than it is (16px at least), and that extra covers the start of the green spot under it. Below the job's real end it is free
    // time, so that tap goes to the grid (it books there, or says it doesn't fit) instead of closing the bar to open the job.
    const bc=(SH&&SH.bar&&S.isMaster&&S.screen==="cal")?card.closest(".col"):null;
    if(bc){
      const r=bc.getBoundingClientRect(),g=S.grid,raw=g.gs+(e.clientY-r.top)/g.ppm,j=S.byId[card.getAttribute("data-job")],s=j?tmToMin(j.start_time):null;
      if(s!=null&&raw>=s+Math.max(+j.duration_min||0,1)){barGridTap(bc.getAttribute("data-staff"),bc.getAttribute("data-date")||S.date,raw);return;}
    }
    openJob(card.getAttribute("data-job"));return;
  }
  if(S.isMaster&&S.screen==="cal"&&Date.now()>=S.noClickUntil){
    // an empty spot on the grid (day or week). Bar open: a green spot books the job there, any other spot says so (see barGridTap). Bar closed: the bar
    // opens with that person, day and time already set.
    const col=t.closest(".col");
    if(col){
      const r=col.getBoundingClientRect(),g=S.grid,staff=col.getAttribute("data-staff"),date=col.getAttribute("data-date")||S.date;
      if(SH&&SH.bar){barGridTap(staff,date,g.gs+(e.clientY-r.top)/g.ppm);return;}
      const min=Math.max(g.gs,Math.min(g.gs+Math.floor((e.clientY-r.top)/g.ppm/SNAP)*SNAP,g.ge-SNAP));
      openQuick({staff:staff,date:date,time:minToHM(min),exact:true});
      return;
    }
    // the empty part of a week lane's No time strip: the bar for that person and day (no time)
    const nt=t.closest(".wlh");
    if(nt){
      const staff=nt.getAttribute("data-staff")||"",date=nt.getAttribute("data-date")||S.date,had=!!(SH&&SH.bar);
      openQuick({staff:staff,date:date,time:""});
      if(had&&SH&&SH.bar&&barReady()){const st=S.staffById[staff];barHint((st?st.name+", ":"")+dayLbl(val("f-date"))+" set. Tap Save.");}
      return;
    }
    // the Unassigned list, while it is green: book it for nobody (no time)
    if(SH&&SH.bar&&t.closest(".tray")&&barReady()){barTrayTap();return;}
  }
}
function inBar(el){return !!(el&&el.closest&&el.closest("#bar"));}
function onInput(e){
  const id=e.target&&e.target.id;
  if(SH&&(!SH.bar||inBar(e.target))){
    if(SH.quick)quickClearMsg();
    if(e.target.getAttribute&&e.target.getAttribute("data-sv")){onSvcField(e.target);return;}      // a service's price or invoice wording
    if(id==="f-name")onNameInput();
    else if(id==="f-addr")onAddrInput();
    else if(id==="f-cnotes")SH.cnTouched=true;
    updateLinks();
    return;
  }
}
function onChange(e){
  const id=e.target&&e.target.id;
  if(SV){svcPanelChange(e.target);return;}
  if(SH&&(!SH.bar||inBar(e.target))){      // (with the bar open, the calendar's own date box still works)
    if(SH.quick)quickClearMsg();
    if(SH.bar&&id==="f-date")SH.dayHand=true;
    if(e.target.getAttribute&&e.target.getAttribute("data-svc")!=null){onSvcTick(e.target);}
    else if(id==="ph-cam"||id==="ph-lib"){const files=e.target.files;addPhotos(files).catch(function(){}).then(function(){try{e.target.value="";}catch(x){}});}
    else if(id==="f-dur"&&S.isMaster&&!SH.quick){SH.durHand=true;SH.durAuto=false;updateLenHint();updateLinks();}      // a length picked by hand: the services' usual times no longer change it
    else updateLinks();
    return;
  }
  if(id==="tb-date"){
    // Chrome fires "change" on every digit typed into a date box. While the box has focus, wait for typing to stop (one fetch per date).
    const v=e.target.value;clearTimeout(S.tbDateT);S.tbDateT=0;S.tbDateV="";
    if(!validYmd(v))return;
    if(S.tbDateFocus){S.tbDateV=v;S.tbDateT=setTimeout(flushDate,500);}
    else gotoDate(v);
  }
}
// apply a date that is waiting out the typing delay straight away (Enter, or leaving the box)
function flushDate(){
  const v=S.tbDateV;clearTimeout(S.tbDateT);S.tbDateT=0;S.tbDateV="";
  if(v&&v!==S.date)gotoDate(v);
}
function onKey(e){
  if(SV){if(e.key==="Escape"){closeSvcPanel(false);}return;}
  const modal=!!SH&&!SH.bar;      // a full job sheet (the booking bar is not modal: the calendar behind it still works)
  if(S.menuOpen&&!modal){
    if(e.key==="Escape"){e.preventDefault();closeMenu(true);return;}
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){menuKey(e);return;}
    if(e.key==="Tab"){closeMenu();}
  }
  if(e.key==="Enter"&&!modal&&e.target&&e.target.id==="tb-date"){flushDate();return;}
  if(e.key==="Enter"&&SH&&e.target&&e.target.id==="f-addr"){findAddr();return;}
  if(e.key==="Escape"&&SH){
    const l1=byId("f-name-list"),l2=byId("f-addr-list");
    if((l1&&!l1.hidden)||(l2&&!l2.hidden)){hideNameList();hideAddrList();return;}
    closeSheet(false);return;
  }
  if((e.key==="Enter"||e.key===" ")&&!modal){
    const t=e.target;
    if(t&&t.getAttribute&&t.hasAttribute("data-job")&&t.getAttribute("role")==="button"){e.preventDefault();openJob(t.getAttribute("data-job"));}
  }
}
function onFocusIn(e){
  if(e.target&&e.target.id==="tb-date")S.tbDateFocus=true;
  if(SH&&!SH.gTok&&e.target&&e.target.id==="f-addr")SH.gTok=uuid();      // a new address-entry session for Google (a new token after a pick, or when the sheet has just opened)
  if(SH&&SH.bar)barEditFlag();
}
function onFocusOut(e){
  if(e.target&&e.target.id==="tb-date"){S.tbDateFocus=false;flushDate();}
  if(SH&&SH.bar)setTimeout(barEditFlag,0);      // (once focus has landed on the next box, or on nothing)
  if(!SH)return;
  const id=e.target&&e.target.id;
  // only hide if focus really has left the box (a quick blur and refocus must not cancel a search that was just started)
  if(id==="f-name")setTimeout(function(){if(document.activeElement!==byId("f-name"))hideNameList();},150);
  if(id==="f-addr")setTimeout(function(){if(document.activeElement!==byId("f-addr"))hideAddrList();},150);
}
function wireGlobal(){
  document.addEventListener("click",onClick);
  document.addEventListener("submit",function(e){if(e.target&&e.target.id==="lg-form"){e.preventDefault();passwordLogin();}});
  document.addEventListener("input",onInput);
  document.addEventListener("change",onChange);
  document.addEventListener("keydown",onKey);
  document.addEventListener("focusin",onFocusIn);
  document.addEventListener("focusout",onFocusOut);
  document.addEventListener("pointerdown",function(e){
    if(SV){SV.back=!!(e.target&&e.target.id==="svp-back");return;}
    if(SH&&!SH.bar){SH.back=!!(e.target&&e.target.id==="sh-back");return;}
    onDown(e);
  });
  // keep focus in the text box when tapping a suggestion, so the list is still there for the click
  document.addEventListener("mousedown",function(e){if(SH&&e.target&&e.target.closest&&e.target.closest(".aclist"))e.preventDefault();});
  // Once a card has been picked up (after the press-and-hold), the page must not scroll under the finger. Before that, swipes scroll normally.
  document.addEventListener("touchmove",function(e){if(DR.on&&DR.started&&e.cancelable)e.preventDefault();},{passive:false});
  // Swipe left / right on the calendar = next / previous day (a week in week view). The calendar follows the thumb:
  // let go past a quarter of the screen (or flick) and the next day slides in, otherwise it springs back.
  // Once the finger is clearly going sideways the page stops scrolling up and down, so it can't jitter.
  // Left alone: a press-and-hold that picks a job up, an up/down scroll, and swipes inside the booking bar,
  // a job sheet or a sideways-scrolling row of chips.
  const SW={on:false,lock:"",x:0,y:0,t:0,dx:0,busy:false};
  const reduceMotion=function(){try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}};
  function swipeSpot(t){
    if(!t||!t.closest||S.screen!=="cal"||SW.busy)return false;
    if(SV||(SH&&!SH.bar))return false;
    if(t.closest(".bar,.sheet,input,textarea,select,.menu,.aclist,[data-noswipe]"))return false;
    for(let n=t;n&&n!==document.body;n=n.parentElement){      // a row that scrolls sideways keeps its own swipe
      if(n.scrollWidth>n.clientWidth+4){const ox=getComputedStyle(n).overflowX;if(ox==="auto"||ox==="scroll")return false;}
    }
    return true;
  }
  function swipeEl(){return byId("cb");}
  function swipeSet(x,ms){
    const el=swipeEl();if(!el)return;
    const w=Math.max(1,el.clientWidth);
    el.style.transition=ms?("transform "+ms+"ms ease-out, opacity "+ms+"ms ease-out"):"none";
    el.style.transform=x?("translateX("+Math.round(x)+"px)"):"";
    el.style.opacity=x?String(1-Math.min(Math.abs(x)/w,1)*0.35):"";
  }
  function swipeBack(){swipeSet(0,180);}
  document.addEventListener("touchstart",function(e){
    SW.on=e.touches.length===1&&swipeSpot(e.target);SW.lock="";SW.dx=0;
    if(SW.on){SW.x=e.touches[0].clientX;SW.y=e.touches[0].clientY;SW.t=Date.now();}
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!SW.on)return;
    if(DR.started||e.touches.length!==1){if(SW.lock==="h")swipeBack();SW.on=false;return;}      // a job got picked up, or a second finger
    const tch=e.touches[0],dx=tch.clientX-SW.x,dy=tch.clientY-SW.y;
    if(!SW.lock){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      SW.lock=Math.abs(dx)>Math.abs(dy)*1.2?"h":"v";
      if(SW.lock==="v"){SW.on=false;return;}      // up/down: let the page scroll as normal
      if(DR.on&&!DR.started)endDrag();      // sideways before the hold time: this is a swipe, not a pick-up
    }
    if(e.cancelable)e.preventDefault();
    SW.dx=dx;
    if(!reduceMotion())swipeSet(dx*0.9,0);
  },{passive:false});
  document.addEventListener("touchend",function(){
    if(!SW.on)return;SW.on=false;
    if(SW.lock!=="h"){return;}
    const el=swipeEl(),w=el?el.clientWidth:window.innerWidth,dx=SW.dx,dt=Math.max(1,Date.now()-SW.t);
    const go1=Math.abs(dx)>w*0.25||(Math.abs(dx)>40&&Math.abs(dx)/dt>0.5);      // far enough, or a quick flick
    S.noClickUntil=Date.now()+400;       // the lift-off must not also count as a tap on an empty slot
    if(!go1){swipeBack();return;}
    const dir=dx<0?1:-1;
    if(reduceMotion()||!el){swipeSet(0,0);go(dir);return;}
    SW.busy=true;
    swipeSet(-dir*w,160);                                    // slide the old day out
    setTimeout(function(){
      go(dir);                                               // draw the new day
      swipeSet(dir*w*0.35,0);                                // start it just off to the side
      void (swipeEl()&&swipeEl().offsetWidth);               // (make the browser take that start position)
      requestAnimationFrame(function(){swipeSet(0,200);});    // and slide it in
      setTimeout(function(){const e2=swipeEl();if(e2){e2.style.transition="";e2.style.transform="";e2.style.opacity="";}SW.busy=false;},260);
    },160);
  },{passive:true});
  document.addEventListener("touchcancel",function(){if(SW.on&&SW.lock==="h")swipeBack();SW.on=false;},{passive:true});
  document.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&SH&&e.target&&e.target.tagName==="INPUT"){e.preventDefault();}
    if(e.key==="Enter"&&SV&&e.target&&e.target.tagName==="INPUT"){e.preventDefault();try{e.target.blur();}catch(x){}}      // Services panel: Enter saves the box (leaving it does that)
  });
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.screen==="cal")scheduleRefetch(150);});
  window.addEventListener("focus",function(){if(S.screen==="cal")scheduleRefetch(150);});
  window.addEventListener("online",function(){if(S.screen==="cal")scheduleRefetch(150);else if(S.screen==="offline")checkSession();});
  try{
    const mq=window.matchMedia(NARROW),redraw=function(){if(S.screen==="cal")renderBody();};
    if(mq.addEventListener)mq.addEventListener("change",redraw);else if(mq.addListener)mq.addListener(redraw);
  }catch(e){}
  // the grid is fitted to the window: fit it again when the window changes size or the phone is turned (once things settle)
  let rzT=0;
  const refit=function(){clearTimeout(rzT);rzT=setTimeout(onWinResize,120);};
  window.addEventListener("resize",refit);
  window.addEventListener("orientationchange",refit);
  window.addEventListener("beforeunload",function(e){if(S.uploads>0||(SH&&isDirty())){e.preventDefault();e.returnValue="";}});
}

// Is someone already logged in? Asks the stored session. If the answer is "can't reach the server" the person is NOT logged out, so
// say that instead of showing the login screen.
function checkSession(){
  renderBoot("Opening the calendar...");
  S.sb.auth.getSession().then(function(r){
    const s=r&&r.data&&r.data.session;
    if(s)return onSession(s);
    if(S.screen!=="boot"&&S.screen!=="offline")return;
    if(r&&r.error&&netErr(r.error)&&!S.hashErr){renderOffline();return;}
    renderLogin(S.hashErr||"",S.hashErr?"warn":"");S.hashErr="";
  }).catch(function(e){if(netErr(e))renderOffline();else renderLogin(friendly(e),"bad");});
}
function boot(){
  wireGlobal();      // first, so the buttons on the error screens below work
  const cfg=window.LPC_SUPABASE||{};
  if(!cfg.url||!cfg.anonKey){renderNotConnected();return;}            // nothing else runs until the project exists
  if(!/^https?:\/\//i.test(cfg.url)){renderFatal("The database address in lpc-config.js doesn't look right. Ask Mitch.",false);return;}
  if(!window.supabase||!window.supabase.createClient){renderFatal("Couldn't load the login tools. Check you're online, then tap Reload.",false);return;}
  try{S.sb=window.supabase.createClient(cfg.url,cfg.anonKey);}
  catch(e){renderFatal("Couldn't start the calendar. "+friendly(e),false);return;}
  loadPrefs();
  renderBoot("Opening the calendar...");
  S.hashErr=hashError();
  S.sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){onSession(session);},0);});
  checkSession();
}
window.lpcSelfTest=lenSelfTest;      // in the browser console: lpcSelfTest() lists anything wrong with the job length rule (nothing = all good)
try{const bad=lenSelfTest();if(bad.length)console.warn("Job length self-test failed:\n"+bad.join("\n"));}catch(e){console.warn("Job length self-test could not run.",e);}
boot();
})();
