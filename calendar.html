}
function armResize(){
  DR.armT=0;
  if(!DR.on||DR.started||DR.mode!=="resize"||!DR.card||!DR.card.isConnected)return;
  startResize();
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(err){}
}
/* ----- stretching a job (master): the bottom edge follows the finger or mouse, snapped to 15 min, and the new end time shows as it goes.
   Let go and the new length is saved the same way as a move (shows straight away, put back if the save fails, Undo in the toast). ----- */
function startResize(){
  DR.started=true;S.dragging=true;S.noClickUntil=Date.now()+900;DR.zoneT=0;DR.pageT=0;DR.trayT=0;
  DR.card.classList.add("resizing");document.body.classList.add("isresize");
  const lab=document.createElement("div");lab.className="rzlab";lab.style.position="fixed";lab.style.zIndex="300";lab.setAttribute("aria-hidden","true");
  document.body.appendChild(lab);DR.lab=lab;
  updateResize();
  DR.raf=requestAnimationFrame(tick);
}
// the length the job would have if let go now
function rzDur(){
  const g=S.grid,col=DR.card&&DR.card.parentNode;
  if(!col||!col.getBoundingClientRect)return DR.rzOrig;
  if(Math.abs(DR.ly-DR.sy)<4&&!DR.rzMoved)return DR.rzOrig;      // not really moved: keep the length it had (it may not be on a 15 min step)
  DR.rzMoved=true;
  const r=col.getBoundingClientRect(),end=g.gs+(DR.ly-r.top)/g.ppm+DR.rzOff;
  const maxEnd=Math.min(24*60,Math.max(g.ge,WORK_END+120));
  let d=Math.round((end-DR.rzS)/SNAP)*SNAP;
  return Math.max(MIN_DUR,Math.min(d,maxEnd-DR.rzS));
}
function updateResize(){
  if(!DR.card||!DR.lab)return;
  const g=S.grid,d=rzDur();DR.rzDur=d;
  const h=Math.max(d*g.ppm-2,16);
  DR.card.style.height=h+"px";
  DR.card.classList.remove("tiny","short","mid","full");
  cardFit(h,DR.card.offsetWidth).split(" ").forEach(function(c){if(c&&c!=="nw"&&c!=="xn")DR.card.classList.add(c);});
  const tm=DR.card.querySelector(".tm");if(tm)tm.textContent=cardTime(DR.card.className,DR.rzS,d);
  DR.lab.textContent=fmtMin(DR.rzS)+" to "+fmtMin(DR.rzS+d)+" ("+fmtDur(d)+")";
  const r=DR.card.getBoundingClientRect(),lw=DR.lab.offsetWidth,lh=DR.lab.offsetHeight;
  let top=r.bottom+4;if(top+lh>window.innerHeight-4)top=r.top-lh-4;
  // a finger is on the bottom edge, so a label under the card would be under the fingertip: put it just above the finger (or above a short card)
  if(DR.touch)top=Math.max(r.top-lh-8,DR.ly-lh-30);
  DR.lab.style.left=Math.max(4,Math.min(r.left,window.innerWidth-lw-4))+"px";DR.lab.style.top=Math.max(4,top)+"px";
}
function armDrag(){
  DR.armT=0;
  if(!DR.on||DR.started||!DR.card||!DR.card.isConnected)return;
  startDrag();
  updateDrag();
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(err){}
}
function onMove(e){
  if(!DR.on||e.pointerId!==DR.pid)return;
  if(!DR.started){
    if(Math.hypot(e.clientX-DR.sx,e.clientY-DR.sy)<8)return;     // small move threshold so a tap still opens the job
    if(DR.touch){endDrag();return;}                              // finger moved before the hold finished: that is a scroll, leave it to the browser
    if(DR.mode==="resize")startResize();else startDrag();
  }
  DR.lx=e.clientX;DR.ly=e.clientY;
  if(DR.mode==="resize")updateResize();else updateDrag();
  if(e.cancelable)e.preventDefault();
}
function startDrag(){
  DR.started=true;S.dragging=true;S.noClickUntil=Date.now()+900;DR.zoneT=0;DR.pageT=0;DR.trayT=0;
  const g=DR.card.cloneNode(true);
  g.removeAttribute("data-job");g.removeAttribute("tabindex");g.setAttribute("aria-hidden","true");
  g.className=g.className.replace("dragging","")+" ghost";
  g.setAttribute("style",(DR.card.getAttribute("style")||"")+";position:fixed;left:0;top:0;right:auto;bottom:auto;margin:0;width:"+DR.w+"px;height:"+DR.h+"px;z-index:300;pointer-events:none");
  document.body.appendChild(g);DR.ghost=g;
  DR.card.classList.add("dragging");document.body.classList.add("isdrag");
  DR.raf=requestAnimationFrame(tick);
}
function dropTarget(x,y,ghostTop){
  const el=document.elementFromPoint(x,y);
  const z=el&&el.closest?el.closest("[data-drop]"):null;
  if(!z)return null;
  const kind=z.getAttribute("data-drop");
  const date=z.getAttribute("data-date")||S.date;      // week view: each column is a day
  if(kind==="col"){
    const r=z.getBoundingClientRect(),g=S.grid;
    let min=g.gs+Math.round(((ghostTop-r.top)/g.ppm)/SNAP)*SNAP;
    min=Math.max(g.gs,Math.min(min,g.ge-SNAP));
    return {kind:kind,el:z,staff:z.getAttribute("data-staff"),date:date,min:min};
  }
  if(kind==="notime")return {kind:kind,el:z,staff:z.getAttribute("data-staff"),date:date};
  if(kind==="tray")return {kind:kind,el:z};

}
function clearMark(){
  if(DR.mark&&DR.mark.parentNode)DR.mark.parentNode.removeChild(DR.mark);
  if(DR.over){DR.over.classList.remove("dropover");DR.over=null;}
}
function markTarget(t){
  if(!t){clearMark();return;}
  if(t.kind==="col"){
    if(DR.over){DR.over.classList.remove("dropover");DR.over=null;}
    if(!DR.mark){DR.mark=document.createElement("div");DR.mark.className="dropmark";}
    const j=S.byId[DR.id],g=S.grid,h=Math.min(Math.max(((j&&j.duration_min)||60)*g.ppm,16),(g.ge-t.min)*g.ppm);      // never taller than the column is under it
    DR.mark.style.top=((t.min-g.gs)*g.ppm)+"px";DR.mark.style.height=h+"px";
    DR.mark.textContent=S.view==="week"?hm(t.min):fmtMin(t.min);
    if(DR.mark.parentNode!==t.el)t.el.appendChild(DR.mark);
  }else{
    if(DR.mark&&DR.mark.parentNode)DR.mark.parentNode.removeChild(DR.mark);
    if(DR.over!==t.el){if(DR.over)DR.over.classList.remove("dropover");t.el.classList.add("dropover");DR.over=t.el;}
  }
}
function updateDrag(){
  if(!DR.ghost)return;
  const gx=DR.lx-DR.offX,gy=DR.ly-DR.offY;
  DR.ghost.style.left=gx+"px";DR.ghost.style.top=gy+"px";
  markTarget(dropTarget(DR.lx,DR.ly,gy));
}
function tick(){
  if(!DR.started)return;
  let moved=false;
  const gw=byId("gw");
  if(gw){
    const r=gw.getBoundingClientRect(),topEl=$(".gtop"),hh=topEl?topEl.offsetHeight:0,E=52;
    if(DR.lx>=r.left-30&&DR.lx<=r.right+30&&DR.ly>=r.top-30&&DR.ly<=r.bottom+30){
      let dy=0,dx=0;
      // The sticky header (names, and the No time yet strip) is not an edge: a card held over it, or just picked up from it, must not scroll the grid. Only the band just under it scrolls up.
      // And only when the grid is taller than its frame (S.gridScrolls): a fitted grid has nothing to scroll, and a finger parked near the bottom must not walk the grid away from under it.
      if(S.gridScrolls){
        if(DR.ly>=r.top+hh&&DR.ly<r.top+hh+E)dy=-Math.min(18,Math.max(4,(r.top+hh+E-DR.ly)/3));
        else if(DR.ly>=r.top+hh&&DR.ly>r.bottom-E)dy=Math.min(18,Math.max(4,(DR.ly-(r.bottom-E))/3));

        else if(DR.lx>r.right-E)dx=Math.min(18,Math.max(4,(DR.lx-(r.right-E))/3));
      }

      if((dy||dx)&&Date.now()-DR.zoneT>300){
        if(dy){const b=gw.scrollTop;gw.scrollTop+=dy;if(gw.scrollTop!==b)moved=true;}
        if(dx){const b=gw.scrollLeft;gw.scrollLeft+=dx;if(gw.scrollLeft!==b)moved=true;}
      }
    }else DR.zoneT=0;
  }
  // the Unassigned tray scrolls on its own too, so a card can be dragged down to the bottom of a long list
  const tr=DR.mode==="resize"?null:$(".tray");
  if(tr&&tr.scrollHeight>tr.clientHeight+2){
    const r=tr.getBoundingClientRect(),E=44;

    if(DR.lx>=r.left&&DR.lx<=r.right&&DR.ly>=r.top&&DR.ly<=r.bottom){
      if(DR.ly<r.top+E)dy=-Math.min(18,Math.max(4,(r.top+E-DR.ly)/3));
      else if(DR.ly>r.bottom-E)dy=Math.min(18,Math.max(4,(DR.ly-(r.bottom-E))/3));
    }
    if(dy){
      if(!DR.trayT)DR.trayT=Date.now();
      if(Date.now()-DR.trayT>300){const b=tr.scrollTop;tr.scrollTop+=dy;if(tr.scrollTop!==b)moved=true;}
    }else DR.trayT=0;
  }
  const sy=window.pageYOffset;
  // The page only scrolls under a held card when that shows more of the grid: the grid is fitted to the screen, so a finger parked on
  // the 4pm row at the bottom of a phone must not slide the page (and the drop) along.
  const gr=gw?gw.getBoundingClientRect():null;
  const pgUp=DR.ly<48&&window.pageYOffset>0&&(!gr||gr.top<0||DR.ly<gr.top);
  const pgDown=DR.ly>window.innerHeight-48&&(!gr||gr.bottom>window.innerHeight+1);
  if(pgUp||pgDown){
    if(!DR.pageT)DR.pageT=Date.now();
    if(Date.now()-DR.pageT>300){if(pgUp)window.scrollBy(0,-12);else window.scrollBy(0,12);}
  }else DR.pageT=0;
  if(window.pageYOffset!==sy)moved=true;
  if(moved){if(DR.mode==="resize")updateResize();else updateDrag();}
  DR.raf=requestAnimationFrame(tick);
}
function endDrag(){
  const started=DR.started;      // read before it is reset below
  window.removeEventListener("pointermove",onMove);
  window.removeEventListener("pointerup",onUp);
  window.removeEventListener("pointercancel",onCancel);
  if(DR.card){DR.card.removeEventListener("pointerup",onUp);DR.card.removeEventListener("pointercancel",onCancel);}
  clearTimeout(DR.armT);DR.armT=0;
  cancelAnimationFrame(DR.raf);
  clearMark();DR.mark=null;
  if(DR.ghost&&DR.ghost.parentNode)DR.ghost.parentNode.removeChild(DR.ghost);
  if(DR.card)DR.card.classList.remove("dragging","resizing");
  if(DR.lab&&DR.lab.parentNode)DR.lab.parentNode.removeChild(DR.lab);
  document.body.classList.remove("isdrag","isresize");
  DR.ghost=null;DR.card=null;DR.lab=null;DR.on=false;DR.started=false;DR.touch=false;DR.mode="move";DR.rzMoved=false;
  S.dragging=false;S.pressing=false;
  if(S.dirtyRender){
    // After a real drag the drop redraws the cards anyway. After a plain tap, a redraw right here would swap the card out before
    // the browser sends mouseup and click, and the tap would be lost, so wait one tick.
    if(started)renderBody();
    else setTimeout(function(){if(S.dirtyRender)renderBody();},0);
  }
}
function onUp(e){
  if(!DR.on||e.pointerId!==DR.pid)return;
  const started=DR.started,id=DR.id;
  if(DR.mode==="resize"){
    // a tap on the handle never opens the job; a stretch saves the new length (if it changed)
    let d=DR.rzOrig;const orig=DR.rzOrig;
    if(started){DR.lx=e.clientX;DR.ly=e.clientY;d=rzDur();}
    endDrag();
    S.noClickUntil=Date.now()+500;
    const j=S.byId[id];
    if(started&&j&&d!==orig&&tmToMin(j.start_time)!=null)moveJob(j,{duration_min:d});
    else if(started)renderBody();      // nothing changed: put the card back the way it was drawn
    return;
  }
  // let go within about 10px of where it started: nothing was moved, so don't treat it as a drop
  const moved=Math.hypot(e.clientX-DR.sx,e.clientY-DR.sy)>=10;
  const t=(started&&moved)?dropTarget(e.clientX,e.clientY,e.clientY-DR.offY):null;
  endDrag();
  if(started){S.noClickUntil=Date.now()+500;if(t)applyDrop(id,t);}
}
function onCancel(e){
  if(!DR.on||e.pointerId!==DR.pid)return;
  const started=DR.started,rz=DR.mode==="resize";
  endDrag();
  if(started)S.noClickUntil=Date.now()+500;
  if(rz){S.noClickUntil=Date.now()+500;if(started)renderBody();}      // a stretch that was cut off: the card goes back to its saved length
}
function applyDrop(id,t){
  const j=S.byId[id];if(!j)return;
  const p={};
  if(t.kind==="col"){p.staff_id=t.staff;p.job_date=t.date||S.date;p.start_time=minToTm(t.min);}
  else if(t.kind==="notime"){p.staff_id=t.staff;p.job_date=t.date||S.date;p.start_time=null;}
  else if(t.kind==="tray"){p.staff_id=null;}
  Object.keys(p).forEach(function(k){if(p[k]===j[k]||(p[k]==null&&j[k]==null))delete p[k];});
  if(!Object.keys(p).length)return;
  moveJob(j,p);
}
function sameField(k,a,b){
  if(k==="start_time")return tmToMin(a)===tmToMin(b);
  return a===b||(a==null&&b==null);
}
function isLenOnly(patch){const k=Object.keys(patch);return k.length===1&&k[0]==="duration_min";}
function moveLabel(patch,j){
  if(isLenOnly(patch)){const s=j&&tmToMin(j.start_time);return "Now "+fmtDur(patch.duration_min)+(s!=null?", "+fmtMin(s)+" to "+fmtMin(s+patch.duration_min):"");}
  const parts=[];
  if("start_time" in patch)parts.push(patch.start_time==null?"no start time":fmtMin(tmToMin(patch.start_time)));
  if("job_date" in patch)parts.push(dayShort(patch.job_date));
  if("staff_id" in patch){const s=patch.staff_id&&S.staffById[patch.staff_id];parts.push(patch.staff_id?(s?s.name:"someone else"):"Unassigned");}
  return "Moved to "+parts.join(", ");
}
async function moveJob(j,patch,isUndo){
  const id=j.id,old={};
  Object.keys(patch).forEach(function(k){old[k]=j[k];});
  Object.assign(j,patch);
  renderBody();
  S.pending++;
  let done=false;
  try{
    const r=await S.sb.from("jobs").update(patch).eq("id",id).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw plainErr("That job could not be changed. It may have been moved or deleted by someone else.");
    done=true;
  }catch(e){
    const cur=S.byId[id];if(cur)Object.assign(cur,old);
    renderBody();
    toast((isLenOnly(patch)?"Couldn't change how long that job is. ":"Couldn't move that job. ")+friendly(e),true);
  }finally{
    S.pending--;scheduleRefetch(300);
  }
  if(!done)return;
  if(isUndo){toast("Put back.");return;}
  toastUndo(moveLabel(patch,S.byId[id]||j),function(){
    // only put it back if nobody has changed it since the move
    const cur=S.byId[id];
    if(!cur||!Object.keys(patch).every(function(k){return sameField(k,cur[k],patch[k]);})){toast("Can't undo that one, the job has changed since.",true);return;}
    moveJob(cur,old,true);
  });
}

// every service type in sort order, plus any ticked name that isn't a known type (an older job)
function svcAllNames(){
  const names=S.types.map(function(t){return t.name;});

// focus and doesn't jump. Ticked services are always in it, even past the first few.
function renderSvcList(){

  const names=svcAllNames(),ticked={};SH.svc.forEach(function(e){ticked[e.type]=1;});

    h+='<label class="svrow'+(ticked[n]?" on":"")+'"><input type="checkbox" data-svc="'+esc(n)+'"'+(ticked[n]?" checked":"")+'><span>'+esc(n)+'</span></label>';
  });

    return '<div class="svcard"><div class="svhead"><b>'+esc(e.type)+'</b><span class="pf" id="sv-pf-'+i+'">price to fill</span></div>'+
      '<div class="fld"><label class="fl" for="sv-p-'+i+'">Price (ex GST)</label>'+

      '<div class="fld"><label class="fl" for="sv-d-'+i+'">What goes on the invoice</label>'+

// the "price to fill" tags and the total line; touches only text, so it is safe to run on every keystroke in a price box
function updateSvcMeta(){
  if(!SH)return;
  let blank=0,sum=0,any=false;
  SH.svc.forEach(function(e,i){
    const isBlank=trim(e.price)==="";
    if(isBlank)blank++;
    else{const n=parsePrice(e.price);if(n!=null&&!isNaN(n)){any=true;sum+=n;}}
    const pf=byId("sv-pf-"+i);if(pf)pf.hidden=!isBlank;
  });
  const t=byId("sv-total");if(!t)return;
  const parts=[];
  if(any)parts.push("Total (ex GST): $"+(Math.round(sum*100)/100).toFixed(2));
  if(blank)parts.push("Price to fill"+(blank>1?" on "+blank+" services":""));
  t.className="hint"+(blank?" new":"");
  t.textContent=parts.join(" · ");
}
// a service was ticked: it gets its default price (only if one is set) and its invoice wording. Unticking keeps what was typed, in case it was a slip.
function newSvcEntry(name){
  const m=SH.svcMemo[name];
  let e;
  if(m)e={type:name,description:m.description,price:m.price};
  else{
    const t=S.typesByName[name];
    e={type:name,description:typeDesc(name),price:t&&t.default_price!=null?String(t.default_price):""};
  }
  // an old job with a price but no service: the only service ticked takes that price. It stays on offer until the job saves, so a wrong tick that gets undone doesn't lose it.
  if(!SH.svc.length&&SH.legacyPrice!=null&&!SH.legacyHeld&&(!m||trim(m.price)==="")){e.price=String(SH.legacyPrice);SH.legacyHeld=name;}
  return e;
}
function onSvcTick(cb){
  const name=cb.getAttribute("data-svc"),i=SH.svc.findIndex(function(e){return e.type===name;});
  if(cb.checked&&i<0)SH.svc.push(newSvcEntry(name));
  else if(!cb.checked&&i>=0){
    const gone=SH.svc[i];
    // the old price was sitting on the service that just got unticked: take it back off (if it is still the untouched old price) so the next one can have it
    if(SH.legacyHeld===name){SH.legacyHeld="";if(trim(gone.price)===String(SH.legacyPrice))gone.price="";}
    SH.svcMemo[name]=gone;SH.svc.splice(i,1);
    if(SH.legacyPrice!=null&&!SH.legacyHeld&&SH.svc.length===1&&trim(SH.svc[0].price)===""){SH.svc[0].price=String(SH.legacyPrice);SH.legacyHeld=SH.svc[0].type;}      // one service left with no price: it is the only one now
  }
  const row=cb.closest(".svrow");if(row)row.classList.toggle("on",cb.checked);
  renderSvcDetails();updateLinks();renderRecs();
}

  const e=SH.svc[+el.getAttribute("data-i")];if(!e)return;

  h+='</div><div class="shfoot"><button type="button" class="btn pri" id="sh-save" data-sh="save">Save</button>';
  if(!SH.isNew){
    h+=(j.status==="done")?'<button type="button" class="btn" id="sh-done" data-sh="undone">Undo done</button>'
      :'<button type="button" class="btn ok" id="sh-done" data-sh="done">'+IC.tick+' Mark done</button>';
  }
  return h+'</div></div></div>';
}

/* ----- form reading, links, dirty check ----- */
function val(id){const e=byId(id);return e?e.value:null;}
function setVal(id,v){const e=byId(id);if(e)e.value=v==null?"":v;}
function readForm(){

function snap(){

function isDirty(){return !!SH&&snap()!==SH.baseline;}
function setLink(id,href){

function showMsg(text,kind){

function setBusy(on){

function $$all(s){return Array.prototype.slice.call(document.querySelectorAll(s));}

/* ----- closing ----- */
function closeSheet(force){
  if(!SH)return true;
  // X, Escape and a tap on the backdrop all come through here. Closing in the middle of a save would leave it half done.
  if(!force&&SH.busy){showMsg("Still saving, hang on a sec.","warn");return false;}
  if(!force&&isDirty()&&!confirm("You have changes that are not saved. Close anyway?"))return false;
  clearTimeout(SH.sT);clearTimeout(SH.acT);if(SH.acAbort){try{SH.acAbort.abort();}catch(e){}}
  const pf=SH.prevFocus;
  SH=null;
  byId("sheet").innerHTML="";
  document.documentElement.classList.remove("sheet-open","qa-open");
  const app=byId("app");app.removeAttribute("inert");app.removeAttribute("aria-hidden");
  if(S.dirtyRender)renderBody();
  if(pf&&pf.focus&&document.contains(pf)){try{pf.focus({preventScroll:true});}catch(e){}}
  return true;
}

/* ----- client name search (type-ahead) ----- */
function escLike(s){return String(s).replace(/[\\%_]/g,"\\$&");}
// Hiding the list also cancels any search that is waiting or on its way, so every caller (pick, too few letters, blur, Escape) gets that.
function hideNameList(){const l=byId("f-name-list");if(l){l.hidden=true;l.innerHTML="";}if(SH){clearTimeout(SH.sT);SH.sSeq++;SH.nameResults=[];SH.nameMatch={};}}
function onNameInput(){
  const f=byId("f-name");if(!f)return;
  // A quick save is running (the cursor is already in the box for "Save + add another"): this typing is for the next caller. It must not unlink or search on the
  // booking being saved. quickReset keeps it when the save is done, and quickNameBack puts the old name back if the save fails.
  if(SH.quick&&SH.busy)return;
  // Typing in the name box does NOT unlink the client. Fixing a spelling keeps their phone, email and address, and the job address.
  // Switching to someone else is done by picking from the list, or with the "Different client" button.
  if(SH.quick&&SH.clientId&&SH.client&&trim(f.value)!==trim(SH.client.name))quickUnlink();      // Quick add has no rename: typing again means someone else
  if(SH.renameTo!=null)SH.renameTo=trim(f.value);
  updateClientHint();
  clearTimeout(SH.sT);
  const q=trim(f.value);
  if(q.length<2){hideNameList();return;}
  SH.sT=setTimeout(function(){searchClients(q);},250);
}
async function searchClients(q){
  const sh=SH;if(!sh||(sh.quick&&sh.busy))return;      // a quick save is running: a client picked now would be lost when the panel resets
  const seq=++sh.sSeq;
  try{
    const words=q.split(/\s+/).filter(Boolean).slice(0,4);
    const digits=q.replace(/\D/g,"");
    let nq=S.sb.from("clients").select(CLIENT_COLS);
    words.forEach(function(w){nq=nq.ilike("name","%"+escLike(w)+"%");});
    nq=nq.order("name",{ascending:true}).limit(8);
    const jobs=[nq];
    if(digits.length>=3){
      // phones from the Xero seed are plain digits, so a straight match works for them
      jobs.push(S.sb.from("clients").select(CLIENT_COLS).ilike("phone","%"+digits+"%").order("name",{ascending:true}).limit(8));
      // phones typed in by hand may have spaces in them, so also try a looser pattern and keep only true digit matches
      if(digits.length>=6)jobs.push(S.sb.from("clients").select(CLIENT_COLS).ilike("phone","%"+digits.split("").join("%")+"%").order("name",{ascending:true}).limit(100));
    }
    // also match the text of a job site address ("296 tyag", "paterson"), unless what was typed is clearly a phone number
    let addrAt=-1;
    if(q.length>=3&&!(digits.length>=6&&/^[\d\s()+.-]+$/.test(q))){
      let aq=S.sb.from("client_properties").select("address,client:clients("+CLIENT_COLS+")");
      words.forEach(function(w){aq=aq.ilike("address","%"+escLike(w)+"%");});
      addrAt=jobs.length;
      jobs.push(aq.order("job_count",{ascending:false}).limit(12));
    }
    const res=await Promise.all(jobs);
    if(SH!==sh||seq!==sh.sSeq||(sh.quick&&sh.busy))return;      // a different sheet, or the list was hidden or a newer search started (or a quick save began meanwhile)
    const seen={},prim=[],sec=[],match={};
    res.forEach(function(r,i){
      if(r.error)return;       // e.g. the sites table isn't set up yet: the name and phone matches still show
      (r.data||[]).forEach(function(row){
        if(i===addrAt){
          const c=Array.isArray(row.client)?row.client[0]:row.client;
          if(!c||!c.id||seen[c.id]||isPlaceholderAddr(row.address))return;
          seen[c.id]=1;match[c.id]=trim(row.address);sec.push(c);return;
        }
        if(i===2&&String(row.phone||"").replace(/\D/g,"").indexOf(digits)<0)return;
        if(!seen[row.id]){seen[row.id]=1;prim.push(row);}
      });
    });
    // name and phone matches first, but keep a few places for address matches so a street typed in isn't crowded out
    const room=Math.min(sec.length,3);
    showNameList(prim.slice(0,8-room).concat(sec).slice(0,8),match);
  }catch(e){if(SH===sh&&seq===sh.sSeq)hideNameList();}
}
function showNameList(list,match){
  const l=byId("f-name-list");if(!l||!SH)return;
  SH.nameResults=list;SH.nameMatch=match||{};
  if(!list.length){l.hidden=true;l.innerHTML="";return;}
  l.innerHTML=list.map(function(c,i){
    const sub=(SH.nameMatch[c.id]?["Site: "+SH.nameMatch[c.id],c.phone]:[c.suburb,c.phone]).filter(Boolean).join(" · ");
    return '<button type="button" class="acitem" role="option" data-sh="pickclient" data-i="'+i+'"><b>'+esc(c.name)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':"")+'</button>';
  }).join("");
  l.hidden=false;
}
// prefer = the site address the search matched on, so that site is the one filled in
function applyClient(c,blankOnly,prefer){
  SH.clientId=c.id;SH.client=Object.assign({},c);
  SH.unlinked=null;SH.renameTo=null;       // picking a client settles who this job is for
  const set=function(id,v){const e=byId(id);if(!e)return;if(blankOnly&&trim(e.value))return;e.value=v==null?"":v;};
  if(S.isMaster)setVal("f-name",c.name);
  set("f-phone",c.phone);set("f-email",c.email);set("f-street",c.street);set("f-suburb",c.suburb);set("f-state",c.state);set("f-postcode",c.postcode);
  SH.preferAddr=prefer||"";
  SH.sites=[];SH.sitesFor=null;SH.sitesOk=false;renderSites();      // the last client's sites don't belong to this one
  hideNameList();updateClientHint();updateLinks();
  loadSites(SH,c.id);       // fills the job address from their sites (or their own address) if the box is empty
}
// Only the "Different client" button calls this. It blanks the boxes that still hold the old client's details, but keeps a copy so
// "Same client, just fixing the spelling" can put them back.
function unlinkClient(){
  const old=SH.client||{};
  const map={"f-phone":"phone","f-email":"email","f-street":"street","f-suburb":"suburb","f-state":"state","f-postcode":"postcode"};
  const vals={};
  Object.keys(map).forEach(function(id){if(trim(val(id))===trim(old[map[id]])){vals[id]=val(id);setVal(id,"");}});
  // the job address stays, unless it was only ever filled in from this client's details and nobody has touched it
  const oldAddr=composeAddr(old.street,old.suburb,old.state,old.postcode),cur=trim(val("f-addr"));
  if(!SH.addrTouched&&cur&&(cur===oldAddr||cur===SH.addrAuto)){vals["f-addr"]=val("f-addr");setVal("f-addr","");SH.addrAuto="";}
  SH.unlinked=SH.client?{client:Object.assign({},SH.client),vals:vals}:null;
  SH.renameTo=null;
  SH.clientId=null;SH.client=null;
  SH.sites=[];SH.sitesFor=null;SH.sitesOk=false;SH.sitesSeq++;SH.preferAddr="";renderSites();
  updateLinks();
}
function diffClient(){
  if(!SH||!SH.clientId)return;
  unlinkClient();
  updateClientHint();
  const n=byId("f-name");if(n){try{n.focus();n.select();}catch(e){}}
}
// "Same client, just fixing the spelling": put the old client and their details back. What is typed in the name box becomes the new name.
function sameClient(){
  const u=SH&&SH.unlinked;if(!u)return;
  Object.keys(u.vals).forEach(function(id){if(!trim(val(id)))setVal(id,u.vals[id]);});     // never overwrite something typed since
  SH.clientId=u.client.id;SH.client=Object.assign({},u.client);
  SH.renameTo=trim(val("f-name"));SH.unlinked=null;
  hideNameList();updateClientHint();updateLinks();
  loadSites(SH,SH.clientId);
}
function updateClientHint(){
  if(SH&&SH.quick){quickSync();return;}
  const h=byId("f-name-hint");if(!h||!SH)return;
  const nm=trim(val("f-name"));
  if(SH.clientId){
    const renaming=!!(SH.client&&nm&&nm!==trim(SH.client.name));
    h.className="hint "+(renaming?"new":"ok");
    h.innerHTML=esc(renaming?"Renaming this client (save to apply). Changes to their phone, email and address are saved to their record too."
      :"Existing client ("+SH.clientId+"). Changes to their phone, email and address are saved to their record.")+
      ' <button type="button" class="linkbtn" data-sh="diffclient">Different client</button>';
  }else if(nm){
    h.className="hint new";
    h.innerHTML=esc("New client. They get added to your client list when you save.")+
      (SH.unlinked?' <button type="button" class="linkbtn" data-sh="sameclient">Same client, just fixing the spelling</button>':"");
  }else{h.className="hint";h.textContent="";}
}

/* ----- a client's job sites -----
   client_properties holds the places a client has had work done (seeded from Xero, plus any added here). Picking a client, or opening
   one of their jobs, loads them: one site fills an empty job address, several show up as chips to tap. Their own contact address
   counts as a site too (last in the list) if it isn't already one. */
function normAddr(s){return String(s==null?"":s).toLowerCase().replace(/\s*,\s*/g,", ").replace(/\s+/g," ").trim();}
function isPlaceholderAddr(a){const t=trim(a);return !t||/^\(.*\)$/.test(t);}      // the Xero seed has "(address unknown)" rows
function siteLine(s){return composeAddr(s.address,s.suburb,s.state,s.postcode);}
// "111 Paterson St, Byron Bay NSW 2481" -> street, suburb, state, postcode. Only splits when the tail has a state or a postcode, else it is all street.
function splitAddr(line){
  const a=trim(line);
  const m=/^(.+),\s*([^,\d]+?)(?:\s+(NSW|VIC|QLD|SA|WA|TAS|NT|ACT))?(?:\s+(\d{4}))?$/i.exec(a);
  if(m&&(m[3]||m[4]))return {street:trim(m[1]),suburb:trim(m[2]),state:m[3]?m[3].toUpperCase():"",postcode:m[4]||""};
  return {street:a,suburb:"",state:"",postcode:""};
}
function siteSlug(a){return String(a).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24)||"site";}
async function fetchSites(clientId,client){
  let rows=null;
  try{
    const r=await S.sb.from("client_properties").select("id,address,suburb,state,postcode,job_count,source").eq("client_id",clientId)
      .order("job_count",{ascending:false}).order("address",{ascending:true});
    if(r.error)throw r.error;
    rows=r.data||[];
  }catch(e){console.warn("Couldn't load this client's job sites.",e);}
  const seen={},list=[];
  (rows||[]).forEach(function(r){
    if(isPlaceholderAddr(r.address))return;
    const k=normAddr(r.address);if(seen[k])return;
    seen[k]=1;seen[normAddr(composeAddr(r.address,r.suburb,r.state,r.postcode))]=1;
    list.push({id:r.id,address:trim(r.address),suburb:trim(r.suburb),state:trim(r.state),postcode:trim(r.postcode),source:r.source});
  });
  const c=client||{};
  if(trim(c.street)&&!seen[normAddr(c.street)])
    list.push({id:null,address:trim(c.street),suburb:trim(c.suburb),state:trim(c.state),postcode:trim(c.postcode),source:"contact"});
  return {list:list,ok:rows!==null};
}
async function loadSites(sh,clientId){
  if(!sh||!clientId)return;
  const seq=++sh.sitesSeq;
  const res=await fetchSites(clientId,sh.client);
  if(SH!==sh||seq!==sh.sitesSeq||sh.clientId!==clientId)return;      // another client was picked, or the sheet was closed
  sh.sites=res.list;sh.sitesFor=clientId;sh.sitesOk=res.ok;
  renderSites();
  applySitePrefill(sh);
}
// the job address box counts as empty if it is blank, or was only ever filled in by this page (an earlier client's site)
function addrBoxEmpty(){return !trim(val("f-addr"))||!SH.addrTouched;}
function applySitePrefill(sh){
  if(SH!==sh||!addrBoxEmpty())return;
  const list=sh.sites;
  let line="";
  if(list.length){
    let pick=list[0];
    if(sh.preferAddr){const k=normAddr(sh.preferAddr);pick=list.filter(function(x){return normAddr(x.address)===k||normAddr(siteLine(x))===k;})[0]||pick;}
    line=siteLine(pick);
  }else if(sh.client){line=composeAddr(sh.client.street,sh.client.suburb,sh.client.state,sh.client.postcode);}     // no street on file: their suburb, as before
  if(!line){
    // nothing to fill in for this client: an earlier client's site that was only auto-filled doesn't stay in the box (not if their sites failed to load: then we don't know)
    if(sh.sitesOk&&trim(val("f-addr"))&&!sh.addrTouched){
      const dirty=isDirty();
      setVal("f-addr","");sh.addrAuto="";
      if(!dirty)sh.baseline=snap();
      updateLinks();renderSites();
    }
    return;
  }
  if(normAddr(val("f-addr"))===normAddr(line))return;
  const wasDirty=isDirty();
  setVal("f-addr",line);sh.addrTouched=false;sh.addrAuto=line;
  if(!wasDirty)sh.baseline=snap();       // filling it in isn't a change the person made, so closing the job shouldn't ask about it
  updateLinks();renderSites();
}
function renderSites(){
  const el=byId("f-addr-sites");if(!el||!SH)return;
  if(SH.quick)quickSync();      // Quick add: the sites have just loaded (or been cleared), so its summary can stop saying it is still looking
  const list=SH.sites||[];
  if(list.length<2){el.hidden=true;el.innerHTML="";return;}
  const cur=normAddr(val("f-addr"));
  el.innerHTML='<span class="sitelbl">Their sites:</span>'+list.map(function(s,i){
    const line=siteLine(s),on=!!cur&&(cur===normAddr(line)||cur===normAddr(s.address));
    return '<button type="button" class="chip'+(on?" on":"")+'" data-sh="picksite" data-i="'+i+'" aria-pressed="'+(on?"true":"false")+'">'+esc(line)+'</button>';
  }).join("");
  el.hidden=false;
}
function pickSite(i){
  const s=SH.sites[i];if(!s)return;
  setVal("f-addr",siteLine(s));SH.addrTouched=true;SH.addrAuto="";SH.addrPick=null;
  hideAddrList();updateLinks();renderSites();
}
// A real site has a street number in it (12 Smith St, 3/45 Smith St, Lot 4 Smith Rd). A suburb on its own ("Bangalow", "Byron Bay NSW 2481") isn't one.
function hasStreetNumber(street){
  const s=trim(street).replace(/\b(?:NSW|VIC|QLD|SA|WA|TAS|NT|ACT)\b/gi," ").replace(/\s\d{4}\s*$/,"");
  return /\d/.test(s);
}
// On save: if the job's address isn't one of the client's saved sites, add it as one. The caller catches any failure, so the job save never fails over this.
async function saveNewSite(sh,clientId,addr){
  const line=trim(addr);
  if(!clientId||!line||isPlaceholderAddr(line))return;
  const pick=sh.addrPick&&normAddr(sh.addrPick.line)===normAddr(line)?sh.addrPick:null;
  const parts=pick||splitAddr(line);
  if(!pick&&!hasStreetNumber(parts.street))return;       // just a suburb (the contact-box fallback): the job keeps it, but it isn't a place to go back to
  let sites=sh.sites;
  if(sh.sitesFor!==clientId||!sh.sitesOk){
    const r=await fetchSites(clientId,sh.client);
    if(!r.ok)throw new Error("couldn't read this client's sites");
    sites=r.list;
  }
  const keys={};keys[normAddr(line)]=1;keys[normAddr(parts.street)]=1;
  const savedRows=function(list){return list.filter(function(x){return x.id;});};       // saved rows only: their contact address showing in the chips doesn't count as saved
  const isThere=function(rows){return rows.some(function(x){return keys[normAddr(x.address)]||keys[normAddr(siteLine(x))];});};
  let real=savedRows(sites);
  if(isThere(real))return;
  const base=clientId+"::"+siteSlug(parts.street),taken={};
  real.forEach(function(x){taken[x.id]=1;});
  let id=base,n=1;
  for(let attempt=0;attempt<8;attempt++){
    while(taken[id]){n++;id=base+"-"+n;}
    const row={id:id,client_id:clientId,address:parts.street,suburb:nn(parts.suburb),state:nn(parts.state),postcode:nn(parts.postcode),source:"calendar"};
    const ins=await S.sb.from("client_properties").insert(row);
    if(!ins.error){
      sh.sites=real.concat([{id:id,address:row.address,suburb:trim(row.suburb),state:trim(row.state),postcode:trim(row.postcode),source:"calendar"}]);
      sh.sitesFor=clientId;sh.sitesOk=true;
      if(SH===sh)renderSites();
      return;
    }
    if(ins.error.code!=="23505")throw ins.error;
    // That id is already used. Usually that is this same address, added from another device since this list loaded, so look again before
    // trying -2, -3 ... (otherwise the same address gets saved twice).
    taken[id]=1;
    const fresh=await fetchSites(clientId,sh.client);
    if(!fresh.ok)throw new Error("couldn't read this client's sites");
    sh.sites=fresh.list;sh.sitesFor=clientId;sh.sitesOk=true;
    real=savedRows(fresh.list);
    if(SH===sh)renderSites();
    if(isThere(real))return;
    real.forEach(function(x){taken[x.id]=1;});
  }
  throw new Error("no free id for the new site");
}

/* ----- job address lookup (Photon) -----
   Photon is a public address search built for searching as you type. Nothing goes out until 350ms after typing stops (and 4+ letters),
   a newer search cancels an older one, answers are remembered for the session, and a late answer never touches the box: results only
   go into the pick-list, and the box only changes when someone taps one.
   Photon rarely has house numbers in regional NSW, and a number in the search tends to push the street out of the 8 answers, so the
   search is for the street part and the number that was typed goes back in front of the street name when one is picked.
   Photon matches by word prefix, so "Rd" finds nothing where "Road" would: the usual street-type shorthand is spelled out before searching.
   A shop or car park that Photon found by its NAME is left out (it is not an address on the street that was typed), so every line in the
   list is a street, or a real address on the street that was typed. */
function addrHint(t){const h=byId("f-addr-hint");if(h)h.textContent=t||"";}
// Hiding the list also cancels a lookup that is waiting or on its way, so every caller gets that.
function hideAddrList(){
  const l=byId("f-addr-list");if(l){l.hidden=true;l.innerHTML="";}
  addrHint("");
  if(SH){clearTimeout(SH.acT);if(SH.acAbort){try{SH.acAbort.abort();}catch(e){}SH.acAbort=null;}SH.acSeq++;SH.acResults=[];}
}
function onAddrInput(){
  SH.addrTouched=true;SH.addrAuto="";SH.addrPick=null;
  // Quick add has no street, suburb ... boxes to see or fix for a NEW client. They only ever hold the lookup pick for this address, so they go as soon as the text is changed
  // (otherwise a cleared or corrected address comes back from them on save).
  if(SH.quick&&!SH.clientId)["f-street","f-suburb","f-state","f-postcode"].forEach(function(id){setVal(id,"");});
  hideAddrList();       // whatever was showing belongs to the old text
  renderSites();
  const q=trim(val("f-addr"));
  if(q.length<4)return;
  const sh=SH;
  sh.acT=setTimeout(function(){if(SH===sh)addrLookup(q);},350);
}
// Enter: search now instead of waiting
function findAddr(){
  if(!SH)return;
  const q=trim(val("f-addr"));
  clearTimeout(SH.acT);
  if(q.length<4){addrHint("Type a bit more of the address.");return;}

const NUMTOK="\\d+[a-z]?",NUMSEQ=NUMTOK+"(?:\\s*[/&-]\\s*"+NUMTOK+")*";
const LEAD_RE=new RegExp("^\\s*((?:(?:unit|u|apt|apartment|flat|shop|suite|ste|lot|level|lvl|villa)\\.?\\s*)?"+NUMSEQ+"(?:\\s*,?\\s+"+NUMSEQ+")?)(?=\\s|,|$)","i");
// "5/296 Tyagarah Rd" -> {num:"5/296", rest:"Tyagarah Rd"}. Handles 111, 3a, 5/296, 283-285, 3 & 3a, Lot 4, Unit 11 70.
function splitTyped(q){
  const t=String(q==null?"":q).replace(/\s+/g," ").trim(),m=LEAD_RE.exec(t);
  if(!m)return {num:"",rest:t};
  let num=m[1].replace(/,/g," ").replace(/\s*&\s*/g," & ").replace(/\s*([\/-])\s*/g,"$1").replace(/\s+/g," ").trim();
  num=num.charAt(0).toUpperCase()+num.slice(1);
  return {num:num,rest:t.slice(m[0].length).replace(/^[\s,]+/,"")};
}
function hasToken(text,tok){
  const e=String(tok).replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
  return new RegExp("(^|[^0-9a-z])"+e+"($|[^0-9a-z])","i").test(String(text));
}
// "5/296" -> "296", "Unit 11 70" -> "70", "Lot 4" -> "4". A range ("283-285") or "3 & 3a" stays whole. This is the part that is the house number on the street.
function typedHouseNum(num){
  const seqs=String(num==null?"":num).match(new RegExp(NUMSEQ,"gi"))||[];
  const last=seqs.length?seqs[seqs.length-1]:"";
  const i=last.lastIndexOf("/");
  return i>=0?last.slice(i+1):last;
}
const STREET_TYPES={rd:"Road",cct:"Circuit",ct:"Court",ln:"Lane",pde:"Parade",hwy:"Highway",tce:"Terrace",cres:"Crescent",pl:"Place",dr:"Drive",ave:"Avenue",cl:"Close",st:"Street"};
// "Tyagarah Rd" -> "Tyagarah Road". Whole words only, any case. The first word is left alone: "St Helena Rd" starts with a saint, not a street.
function expandStreetTypes(text){
  return String(text==null?"":text).replace(/(^|[\s,])([a-z]+)\.?(?=$|[\s,])/gi,function(m,pre,w){
    const e=pre?STREET_TYPES[w.toLowerCase()]:null;
    return e?pre+e:m;
  });
}
function stateAbbr(st){
  const t=trim(st);if(!t)return "";
  if(STATE_ABBR[t])return STATE_ABBR[t];
  return /^(NSW|VIC|QLD|SA|WA|TAS|NT|ACT)$/i.test(t)?t.toUpperCase():t;
}
// Only Australian answers that are addresses: streets, and things with a house number or a name on a street. Parks, suburbs and bus stops are left out.
function usableFeature(f){
  const p=(f&&f.properties)||{};
  if(p.countrycode!=="AU")return false;
  if(p.type==="street")return !!trim(p.name);
  if(p.type!=="house")return false;
  if(trim(p.housenumber))return !!(trim(p.street)||trim(p.name));
  if(/^(public_transport|highway|railway|aeroway|waterway|natural)$/.test(String(p.osm_key||"")))return false;
  return !!(trim(p.street)||trim(p.name));
}
// A street always stays. Anything else (a shop, a fuel station, a car park) only stays when it is on the street that was typed: its street has a word that
// starts with the first word typed. One that Photon found by its name ("Pat" finding the Patagonia shop on Jonson Street) is left out.
function onTypedStreet(f,typedStreet){
  const p=(f&&f.properties)||{};
  if(p.type==="street")return true;
  const first=(String(typedStreet==null?"":typedStreet).toLowerCase().match(/[a-z0-9]+/)||[""])[0];
  if(!first)return true;
  return (String(p.street==null?"":p.street).toLowerCase().match(/[a-z0-9]+/g)||[]).some(function(w){return w.indexOf(first)===0;});
}
// "<number> <street or name>, <suburb> <STATE> <postcode>". The result's own house number wins; with none, the number that was typed goes in front of the street.
function photonParts(f,typedNum){
  const p=(f&&f.properties)||{},hn=trim(p.housenumber),nameT=trim(p.name),streetT=trim(p.street);
  const streetName=p.type==="street"?nameT:(streetT||nameT);
  let n="";
  // typed "5/296" and the result says 296: keep the 5/. Only the house number part is compared (296), never the unit (5).
  if(hn)n=(typedNum&&typedNum!==hn&&hasToken(typedHouseNum(typedNum),hn))?typedNum:hn;
  else if(typedNum&&(p.type==="street"||streetT))n=typedNum;
  const street=(n?n+" ":"")+streetName;
  let suburb=trim(p.city)||trim(p.town)||trim(p.village)||trim(p.locality)||trim(p.district);
  if(suburb&&suburb.toLowerCase()===streetName.toLowerCase())suburb="";
  const state=stateAbbr(p.state),pc=trim(p.postcode);
  return {street:street,suburb:suburb,state:state,postcode:pc,line:composeAddr(street,suburb,state,pc)};
}
async function addrLookup(q){
  const sh=SH;if(!sh)return;
  const parts=splitTyped(q),sendQ=expandStreetTypes(parts.num?parts.rest:q);       // "Rd" -> "Road": Photon matches whole-word prefixes
  if(sendQ.length<3){addrHint("Type a bit more of the street.");return;}       // "111 Pa": wait for more of the street
  const key=sendQ.toLowerCase();
  if(sh.acAbort){try{sh.acAbort.abort();}catch(e){}sh.acAbort=null;}
  const seq=++sh.acSeq;
  const hit=S.addrCache.get(key);
  if(hit){showAddrList(hit,q);return;}
  const ctl=("AbortController" in window)?new AbortController():null;sh.acAbort=ctl;
  addrHint("Looking...");
  try{
    const url=PHOTON_URL+"?q="+encodeURIComponent(sendQ)+"&limit=8&lang=en&lat="+PHOTON_LAT+"&lon="+PHOTON_LON;
    const r=await fetch(url,ctl?{signal:ctl.signal}:{});
    if(!r.ok)throw plainErr("Address lookup answered with an error.");
    const data=await r.json();
    if(!data||!Array.isArray(data.features))throw plainErr("Address lookup answered with something odd.");
    const feats=data.features.filter(function(f){return f&&f.properties&&f.properties.countrycode==="AU";});
    S.addrCache.set(key,feats);
    if(S.addrCache.size>80)S.addrCache.delete(S.addrCache.keys().next().value);
    if(SH!==sh||seq!==sh.acSeq)return;       // the sheet changed, or newer typing / a pick / a blur has cancelled this
    if(trim(val("f-addr"))!==q)return;       // the text has moved on since this was asked
    showAddrList(feats,q);
  }catch(e){
    if(SH!==sh||seq!==sh.acSeq)return;
    if(e&&e.name==="AbortError")return;
    addrHint("Address lookup unavailable, type it in.");
  }
}
function showAddrList(feats,q){
  const l=byId("f-addr-list");if(!l||!SH)return;
  const sp=splitTyped(q),num=sp.num,typedStreet=expandStreetTypes(sp.num?sp.rest:q),seen={},out=[];
  feats.forEach(function(f){
    if(!usableFeature(f)||!onTypedStreet(f,typedStreet))return;
    const pp=photonParts(f,num);
    if(!pp.street)return;
    const k=pp.line.toLowerCase();if(seen[k])return;seen[k]=1;out.push(pp);
  });
  SH.acResults=out.slice(0,8);
  if(!SH.acResults.length){l.hidden=true;l.innerHTML="";addrHint("No match found. Type it in.");return;}
  addrHint("");
  l.innerHTML=SH.acResults.map(function(p,i){return '<button type="button" class="acitem" role="option" data-sh="pickaddr" data-i="'+i+'">'+esc(p.line)+'</button>';}).join("");
  l.hidden=false;
}
function pickAddr(i){
  const p=SH.acResults[i];if(!p)return;
  setVal("f-addr",p.line);SH.addrTouched=true;SH.addrAuto="";
  // the client's street, suburb ... boxes only get filled when there is a client (or a name typed for one): with no client they would block the save
  // Quick add, new client: those boxes are hidden and only ever hold the latest pick, so a second pick replaces the first (in the full sheet they are visible and stay as they are).
  const qNew=!!(SH.quick&&!SH.clientId);
  if((SH.clientId||trim(val("f-name")))&&(qNew||(!trim(val("f-street"))&&!trim(val("f-suburb"))))){setVal("f-street",p.street);setVal("f-suburb",p.suburb);setVal("f-state",p.state);setVal("f-postcode",p.postcode);}
  hideAddrList();
  SH.addrPick={line:p.line,street:p.street,suburb:p.suburb,state:p.state,postcode:p.postcode};     // remembered so a save can store the suburb, state and postcode with the site
  updateLinks();renderSites();
}

/* ----- photo queue -----
   Every photo is shrunk and kept on the device (IndexedDB, or in memory if the browser won't allow that) BEFORE it is uploaded,
   and is only removed once both the file upload and the job_photos row have worked. A dropped signal, a crash or leaving the
   page mid-batch no longer loses a photo. On an iPhone a camera shot isn't saved to the camera roll, so this is the only copy. */
const PQ_DB="lpc-cal-photos-v1",PQ_STORE="pendingPhotos";
let pqDb=null;      // null = not opened yet, false = this browser won't give us IndexedDB
function pqOpen(){
  if(pqDb!==null)return Promise.resolve(pqDb||null);
  return new Promise(function(res){
    try{
      if(!window.indexedDB){pqDb=false;res(null);return;}
      const rq=indexedDB.open(PQ_DB,1);
      rq.onupgradeneeded=function(){const d=rq.result;if(!d.objectStoreNames.contains(PQ_STORE))d.createObjectStore(PQ_STORE,{keyPath:"id"});};
      rq.onsuccess=function(){pqDb=rq.result;pqDb.onversionchange=function(){try{pqDb.close();}catch(e){}pqDb=null;};res(pqDb);};
      rq.onerror=function(){pqDb=false;res(null);};
      rq.onblocked=function(){res(null);};
    }catch(e){pqDb=false;res(null);}
  });
}
function pqRun(mode,fn){
  return pqOpen().then(function(db){
    if(!db)throw new Error("no indexeddb");
    return new Promise(function(res,rej){
      let rq=null;
      try{
        const tx=db.transaction(PQ_STORE,mode);
        rq=fn(tx.objectStore(PQ_STORE));
        tx.oncomplete=function(){res(rq?rq.result:undefined);};
        tx.onerror=tx.onabort=function(){rej(tx.error||new Error("indexeddb failed"));};
      }catch(e){rej(e);}
    });
  });
}
async function pqPut(it){
  try{await pqRun("readwrite",function(st){return st.put(it);});}
  catch(e){S.pendingPhotos.push(it);}       // memory fallback: lasts until the page is closed
}
async function pqDel(id){
  S.pendingPhotos=S.pendingPhotos.filter(function(x){return x.id!==id;});
  try{await pqRun("readwrite",function(st){return st.delete(id);});}catch(e){}
}
async function pqList(jobId){
  let out=S.pendingPhotos.slice();
  try{const all=await pqRun("readonly",function(st){return st.getAll();});out=out.concat(all||[]);}catch(e){}
  return jobId?out.filter(function(x){return x.jobId===jobId;}):out;
}
// how many photos for this job are saved on the device but not uploaded yet; shows or hides the "Try again (N)" button
async function refreshPending(){
  const sh=SH;if(!sh||!sh.jobId)return;
  let n=0;
  try{n=(await pqList(sh.jobId)).length;}catch(e){}
  if(SH!==sh)return;
  sh.pendingN=n;
  const row=byId("ph-retry-row"),b=byId("ph-retry");
  if(row)row.hidden=!n;
  if(b)b.textContent="Try again ("+n+")";
}
// one stored photo: upload the file, add the job_photos row, then (and only then) forget the stored copy.
// The path comes from the stored id, so a retry after a half-finished go picks up where it left off instead of doubling up.
async function uploadOne(it){
  const path=it.jobId+"/"+it.id+".jpg";
  let existed=false;
  const up=await S.sb.storage.from("job-photos").upload(path,it.blob,{contentType:"image/jpeg",upsert:false});
  if(up.error){
    if(String(up.error.statusCode||up.error.status||"")==="409"||/already exists|duplicate/i.test(String(up.error.message||"")))existed=true;
    else throw up.error;
  }
  if(existed){
    const ex=await S.sb.from("job_photos").select("id").eq("job_id",it.jobId).eq("path",path).limit(1);
    if(ex.error)throw ex.error;
    if(ex.data&&ex.data.length){await pqDel(it.id);return;}
  }
  const ins=await S.sb.from("job_photos").insert({job_id:it.jobId,path:path,caption:it.caption});
  if(ins.error)throw ins.error;
  await pqDel(it.id);
}
function photoStat(sh,jobId,t){if(SH===sh&&sh.jobId===jobId){const ps=byId("ph-stat");if(ps)ps.textContent=t;}}
// after a batch: tidy up, say what happened. If the sheet was closed in the meantime, a toast tells them the photos landed.
async function afterUploads(sh,jobId,ok,bad,unread,lastErr){
  sh.uploading=false;
  if(SH)updateLinks();
  if(SH===sh){
    await loadPhotos();
    await refreshPending();  // recount the photos still waiting, so the message below is right
    if(SH===sh){
      const ps=byId("ph-stat"),parts=[];
      if(ok)parts.push(ok+" added.");
      if(bad)parts.push(bad+" didn't upload yet. "+(sh.pendingN?"They're kept on this device, tap Try again when you have signal. ":"")+lastErr);
      if(unread)parts.push(unread+" couldn't be read.");
      if(ps&&parts.length)ps.textContent=parts.join(" ");
    }
  }else if(ok>0){toast(ok+" photo"+(ok===1?"":"s")+" added.");}
  if(bad||unread)toast((bad?bad+" photo"+(bad===1?"":"s")+" didn't upload. They're kept to try again. ":"")+(unread?unread+" couldn't be read. ":"")+lastErr,true);
}
async function loadPhotos(){
  const id=SH&&SH.jobId;if(!id)return;
  refreshPending();
  try{
    const r=await S.sb.from("job_photos").select("id,path,caption,created_at").eq("job_id",id).order("created_at",{ascending:true});
    if(r.error)throw r.error;
    let urls={};
    const paths=(r.data||[]).map(function(p){return p.path;});
    if(paths.length){
      const s=await S.sb.storage.from("job-photos").createSignedUrls(paths,3600);
      if(!s.error)(s.data||[]).forEach(function(x){if(x&&x.signedUrl)urls[x.path]=x.signedUrl;});
    }
    if(!SH||SH.jobId!==id)return;
    SH.photos=(r.data||[]).map(function(p){return {id:p.id,path:p.path,caption:p.caption,url:urls[p.path]||""};});
    renderPhotos();
  }catch(e){const ps=byId("ph-stat");if(ps&&SH&&!SH.uploading)ps.textContent="Couldn't load the photos. "+friendly(e);}
}
function renderPhotos(){
  const g=byId("ph-grid");if(!g||!SH)return;
  g.innerHTML=SH.photos.map(function(p){
    return p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+esc(p.url)+'" alt="'+esc(p.caption||"Job photo")+'" loading="lazy"></a>':"";
  }).join("");
  const ps=byId("ph-stat");
  if(ps&&!SH.uploading)ps.textContent=SH.photos.length?SH.photos.length+" photo"+(SH.photos.length===1?"":"s")+" on this job.":"No photos yet.";
}
function loadImg(file){
  return new Promise(function(res,rej){
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im);};
    im.onerror=function(){URL.revokeObjectURL(u);rej(plainErr("Couldn't read that photo."));};
    im.src=u;
  });
}
async function toJpeg(file){
  let src=null;
  try{if(window.createImageBitmap)src=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){src=null;}
  if(!src)src=await loadImg(file);
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
  if(!w||!h)throw plainErr("Couldn't read that photo.");
  const k=Math.min(1,1600/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
  const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cw,ch);cx.drawImage(src,0,0,cw,ch);
  if(src.close){try{src.close();}catch(e){}}
  const blob=await new Promise(function(res){cv.toBlob(res,"image/jpeg",0.82);});
  cv.width=cv.height=0;
  if(!blob)throw plainErr("Couldn't shrink that photo.");
  return blob;
}
async function addPhotos(fileList){
  if(!SH||!SH.jobId||SH.uploading||S.uploads>0)return;
  const files=Array.prototype.slice.call(fileList||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name||"");});
  if(!files.length)return;
  const sh=SH,jobId=sh.jobId,caption=nn(val("f-caption"));
  sh.uploading=true;S.uploads++;updateLinks();      // S.uploads is page-wide, so it still counts after the sheet is closed
  let ok=0,bad=0,unread=0,lastErr="";
  try{
    for(let i=0;i<files.length;i++){
      photoStat(sh,jobId,"Uploading photo "+(i+1)+" of "+files.length+"...");
      let item=null;
      try{
        const blob=await toJpeg(files[i]);
        item={id:uuid(),jobId:jobId,caption:caption,blob:blob,ts:Date.now()};
        await pqPut(item);          // saved on the device first
      }catch(e){unread++;lastErr=friendly(e);continue;}
      try{await uploadOne(item);ok++;}
      catch(e){bad++;lastErr=friendly(e);}
    }
    await afterUploads(sh,jobId,ok,bad,unread,lastErr);
  }finally{
    sh.uploading=false;S.uploads--;
    if(SH)updateLinks();
  }
}
// "Try again (N)": send what is still waiting for this job
async function retryPhotos(){
  const sh=SH;if(!sh||!sh.jobId||sh.uploading||S.uploads>0)return;
  const jobId=sh.jobId;
  let items=[];
  try{items=await pqList(jobId);}catch(e){}
  if(!items.length){refreshPending();return;}
  if(SH!==sh)return;
  sh.uploading=true;S.uploads++;updateLinks();
  let ok=0,bad=0,lastErr="";
  try{
    for(let i=0;i<items.length;i++){
      photoStat(sh,jobId,"Uploading photo "+(i+1)+" of "+items.length+"...");
      try{await uploadOne(items[i]);ok++;}
      catch(e){bad++;lastErr=friendly(e);}
    }
    await afterUploads(sh,jobId,ok,bad,0,lastErr);
  }finally{
    sh.uploading=false;S.uploads--;
    if(SH)updateLinks();
  }
}

/* ----- validation, patches, saving ----- */
// Contact details that would have nowhere to go on a job with no client. Street, suburb, state and postcode only count when the job
// address box is filled in, because with that box empty they are folded into the job address and saved there.
function hasContact(f){return !!(f.phone||f.email||(f.address&&(f.street||f.suburb||f.state||f.postcode)));}
function validate(f){
  if(S.isMaster){
    if(!validYmd(f.date))return "Pick a date for the job.";
    if(!(f.dur>0))return "Pick how long the job takes.";
    if(!SH.clientId&&!f.name&&SH.isNew)return "Type the client's name.";
  }
  // a client-less job can't keep a phone, email or address, so say so instead of saving "Saved" and quietly dropping them
  if(!SH.clientId&&!f.name&&hasContact(f))
    return S.isMaster?"Type the client's name so the phone, email and address have somewhere to save, or clear those boxes."
      :"This job has no client, so phone, email and address can't be saved. Clear those boxes, or ask Mitch to add the client.";
  for(let i=0;i<f.services.length;i++){
    if(isNaN(parsePrice(f.services[i].price)))return "The price for "+f.services[i].type+" needs to be a number, like 250 or 250.50.";
  }
  if(f.email&&!looksEmail(f.email))return "That email address doesn't look right.";
  return "";
}
function buildJobPatch(sh,f,clientId,extra){
  const j=sh.job||{},isNew=sh.isNew,p={};
  if(S.isMaster){
    const staff=f.staff||null;
    if(isNew||staff!==(j.staff_id||null))p.staff_id=staff;
    if(isNew||f.date!==j.job_date)p.job_date=f.date;
    const tm=f.time?minToTm(tmToMin(f.time)):null,otm=j.start_time?minToTm(tmToMin(j.start_time)):null;
    if(isNew||tm!==otm)p.start_time=tm;
    if(isNew||f.dur!==j.duration_min)p.duration_min=f.dur;
    if(isNew||(clientId||null)!==(j.client_id||null))p.client_id=clientId||null;
  }
  // services, service_type and price are written together, and only when the services (or a price or wording) changed
  const svcNew=canonServices(f.services);
  if(isNew||JSON.stringify(svcNew)!==JSON.stringify(canonServices(loadServices(j)))){
    p.services=svcNew;
    p.service_type=svcNew.length?svcNew.map(function(e){return e.type;}).join(" + "):null;
    p.price=sumPrice(svcNew);
  }
  // never null out an address nobody touched (a client change blanks the street boxes, but that isn't the person clearing the job address)
  const addr=nn(f.address);if(isNew||(addr!==nn(j.address)&&(addr!==null||sh.addrTouched)))p.address=addr;
  const notes=nn(f.notes);if(isNew||notes!==nn(j.notes))p.notes=notes;
  if(extra)Object.assign(p,extra);
  return p;
}
async function findClientByName(name){
  const r=await S.sb.from("clients").select(CLIENT_COLS).ilike("name",escLike(name)).limit(3);
  if(r.error)throw r.error;
  return r.data||[];
}
async function createClientRow(f){
  const base=slugify(f.name);
  const r=await S.sb.from("clients").select("id").or("id.eq."+base+",id.like."+base+"-*");
  if(r.error)throw r.error;
  const taken={};(r.data||[]).forEach(function(x){taken[x.id]=1;});
  let n=1,id=base;
  for(let attempt=0;attempt<6;attempt++){
    while(taken[id]){n++;id=base+"-"+n;}
    const row={id:id,name:f.name,phone:nn(f.phone),email:nn(f.email),street:nn(f.street),suburb:nn(f.suburb),state:nn(f.state),postcode:nn(f.postcode),source:"calendar"};
    const ins=await S.sb.from("clients").insert(row);
    if(!ins.error)return row;
    if(ins.error.code==="23505"){taken[id]=1;continue;}
    throw ins.error;
  }
  throw plainErr("Couldn't find a free id for that new client. Try again.");
}
// rename=true only after the person has said yes to renaming this client (see saveSheet). The name is only sent when it isn't blank.
async function updateClientRow(sh,f,rename){
  const base=sh.client||{},p={};
  ["name","phone","email","street","suburb","state","postcode"].forEach(function(k){
    const nv=nn(f[k]);
    if(k==="name"){if(S.isMaster&&rename&&nv&&nv!==trim(base.name))p.name=nv;return;}
    if(nv!==nn(base[k]))p[k]=nv;
  });
  if(!Object.keys(p).length)return;
  const r=await S.sb.from("clients").update(p).eq("id",sh.clientId).select("id");
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw plainErr("The client details didn't save. You may not be allowed to change this client.");
  Object.assign(sh.client,p);
  if(sh.job&&sh.job.client)Object.assign(sh.job.client,p);
}
function upsertLocal(row){
  const r=currentRange();
  const inR=row.job_date>=r.from&&row.job_date<=r.to&&(S.isMaster||row.staff_id===S.me.id);
  const i=S.jobs.findIndex(function(x){return x.id===row.id;});
  if(inR){if(i>=0)S.jobs[i]=row;else S.jobs.push(row);}else if(i>=0)S.jobs.splice(i,1);
  S.byId={};S.jobs.forEach(function(x){S.byId[x.id]=x;});
  renderBody();
}
async function saveSheet(extra,opts){
  opts=opts||{};
  if(!SH||SH.busy)return false;
  // Everything below reads and writes THIS sheet (sh), even if the screen has moved on by the time a request comes back.
  const sh=SH;
  let f=readForm();const bad=validate(f);
  if(bad){showMsg(bad,"bad");return false;}
  setBusy(true);showMsg("Saving...","ok");
  S.pending++;
  let okSave=false,lostContact=false,siteFailed=false;
  try{
    // 1. the client
    let clientId=sh.clientId,rename=false;
    if(S.isMaster&&clientId&&sh.client&&f.name&&f.name!==trim(sh.client.name)){
      // The name box was changed on a linked client. Never rename silently: ask.
      if(sh.renameTo===f.name||confirm('Rename "'+sh.client.name+'" to "'+f.name+'" on their client record?\n\nOK = rename them.\nCancel = add a separate new client from what is on screen.'))rename=true;
      else clientId=null;           // Cancel: a new client, made from the fields as they are now (nothing gets blanked)
    }
    if(S.isMaster&&!clientId&&f.name&&sh.unlinked&&f.name.toLowerCase()!==trim(sh.unlinked.client.name).toLowerCase()){
      // Backstop: the client was unlinked earlier and a different name is now typed. Is this just a spelling fix?
      const u=sh.unlinked;
      if(confirm('Rename "'+u.client.name+'" to "'+f.name+'"? OK = rename this client. Cancel = add a separate new client.')){
        sh.clientId=clientId=u.client.id;sh.client=Object.assign({},u.client);
        if(SH===sh){Object.keys(u.vals).forEach(function(id){if(!trim(val(id)))setVal(id,u.vals[id]);});f=readForm();}
        sh.unlinked=null;sh.renameTo=f.name;rename=true;
      }
    }
    if(S.isMaster&&!clientId&&f.name){
      if(sh.dupDeclined!==f.name.toLowerCase()){
        const dup=await findClientByName(f.name);
        if(dup.length){
          const d=dup[0];
          if(confirm('There is already a client called "'+d.name+'"'+(d.suburb?" ("+d.suburb+")":"")+".\n\nOK = use that client.\nCancel = add a separate new client.")){
            if(SH===sh){
              applyClient(d,true);
              if(sh.quick)quickTakeClient(d);
              showMsg("Using the existing client. Check the details, then save again.","warn");
            }
            return false;
          }
          sh.dupDeclined=f.name.toLowerCase();
        }
      }
      if(sh.quick)quickClientAddr(sh,f);
      const row=await createClientRow(f);
      sh.clientId=clientId=row.id;sh.client=Object.assign({},row);sh.unlinked=null;sh.renameTo=null;
      if(SH===sh)updateClientHint();
    }else if(clientId){
      await updateClientRow(sh,f,rename);
      sh.renameTo=null;
    }
    lostContact=!clientId&&hasContact(f);
    // 2. the job
    // (Quick add: a job address that was cleared on purpose stays blank. Its hidden client boxes must not put it back.)
    if(!f.address&&!(sh.quick&&sh.addrTouched)){const a=composeAddr(f.street,f.suburb,f.state,f.postcode);if(a){f.address=a;if(SH===sh)setVal("f-addr",a);}}
    const patch=buildJobPatch(sh,f,clientId,extra);
    let row=null;
    if(sh.isNew){
      patch.status=patch.status||"booked";
      const r=await S.sb.from("jobs").insert(patch).select(JOB_COLS).single();
      if(r.error)throw r.error;
      row=r.data;
      sh.isNew=false;sh.jobId=row.id;
    }else if(Object.keys(patch).length){
      const r=await S.sb.from("jobs").update(patch).eq("id",sh.jobId).select(JOB_COLS);
      if(r.error)throw r.error;
      if(!r.data||!r.data.length)throw plainErr("That job didn't save. It may have been deleted or moved to someone else.");
      row=r.data[0];
    }
    if(row){sh.job=row;if(row.client)sh.client=Object.assign({},row.client);}
    else if(sh.job&&sh.client){sh.job.client=Object.assign({},sh.job.client||{},sh.client);}
    if(sh.job)upsertLocal(sh.job);       // the calendar shows what was written, whether or not this sheet is still open
    if(SH===sh)sh.baseline=snap();
    if(sh.svc.length){sh.legacyPrice=null;sh.legacyHeld="";}      // the old price now lives on a saved service
    okSave=true;
    // The job is saved. If its address isn't one of the client's sites yet, add it. A failure here is logged and mentioned, never a failed save.
    try{await saveNewSite(sh,clientId,f.address);}
    catch(e){siteFailed=true;console.warn("The job saved, but its address couldn't be added to the client's sites.",e);}
    scheduleRefetch(300);
  }catch(e){
    if(SH===sh){showMsg(friendly(e),"bad");if(sh.quick)quickNameBack(sh);}
  }finally{
    S.pending--;
    if(SH===sh)setBusy(false);
  }
  if(!okSave)return false;
  clearDraftForJob(sh.jobId);
  const siteNote="The address couldn't be added to their list of sites.";
  if(SH!==sh){toast("Saved"+(siteFailed?". "+siteNote:""),siteFailed);return true;}       // the sheet was closed while this was saving (logged out, for one); the write itself went through
  if(opts.quick){quickDone(sh,opts,siteFailed,siteNote);return true;}
  const warn=lostContact?" The phone, email and address weren't saved, because this job has no client.":"",kind=lostContact?"warn":"ok";
  if(opts.fresh){
    // First save of a new job: reopen it as a saved job so photos, paperwork and the done button appear.
    const saved=sh.job;
    closeSheet(true);
    openSheet(saved,null);
    showMsg("Saved."+(S.byId[saved.id]?"":" It is on "+niceDate(saved.job_date)+", so it isn't on this screen.")+warn+" You can add photos now.",kind);
    if(siteFailed)toast(siteNote,true);
  }else if(opts.keepOpen){
    refreshSheetHead();showMsg("Saved."+warn,kind);updateLinks();
    if(siteFailed)toast(siteNote,true);
  }else{
    const jid=sh.job&&sh.job.id,jd=sh.job&&sh.job.job_date;
    closeSheet(true);
    let msg=(!S.isMaster||!jid||S.byId[jid]?"Saved":"Saved. It is on "+niceDate(jd)+", so it isn't on this screen.")+warn;
    if(siteFailed)msg+=(/\.$/.test(msg)?" ":". ")+siteNote;
    toast(msg,lostContact||siteFailed);
  }
  return true;
}

async function setStatus(kind){
  if(!SH||!SH.jobId)return;
  let extra;
  if(kind==="done")extra={status:"done",done_at:new Date().toISOString(),done_by:S.me.id};
  else if(kind==="undone")extra={status:"booked",done_at:null,done_by:null};
  else if(kind==="cancel"){if(!confirm("Cancel this job? It stays on file but drops off the calendar."))return;extra={status:"cancelled",done_at:null,done_by:null};}
  else if(kind==="reopen")extra={status:"booked"};

async function deleteJob(){
  if(!SH||!SH.jobId||!S.isMaster)return;
  if(!confirm("Delete this job for good?\n\nIts photos are deleted too. Any service records stay on file. This can't be undone."))return;
  const sh=SH,id=sh.jobId;
  setBusy(true);S.pending++;
  let paths=[];
  try{
    try{const pr=await S.sb.from("job_photos").select("path").eq("job_id",id);if(!pr.error)paths=(pr.data||[]).map(function(x){return x.path;});}catch(e){}
    const d=await S.sb.from("jobs").delete().eq("id",id).select("id");
    if(d.error)throw d.error;
    if(!d.data||!d.data.length)throw plainErr("That job wasn't deleted. It may already be gone.");
    if(paths.length){try{await S.sb.storage.from("job-photos").remove(paths);}catch(e){}}
    S.jobs=S.jobs.filter(function(x){return x.id!==id;});S.byId={};S.jobs.forEach(function(x){S.byId[x.id]=x;});
    if(SH===sh)closeSheet(true);      // a delete that finishes late must not close some other sheet
    renderBody();toast("Job deleted");
  }catch(e){
    if(SH===sh){showMsg(friendly(e),"bad");setBusy(false);}
  }finally{S.pending--;scheduleRefetch(300);}
}
